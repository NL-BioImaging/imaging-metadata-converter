id: https://github.com/NL-BioImaging/imaging-metadata-consolidator/models/imaging/units
name: imaging_units
title: Imaging metadata units
description: The units enumerations of the imaging metadata model, from models/LiMi_XMLSchema.xsd. Each unit lists the other
  spellings it is known by as aliases (its names, and an ASCII form such as "um" for "µm"), so a vendor spelling can be read
  as the unit.
