  TIRFMethod:
    permissible_values:
      Lightguide: {}
      Objective: {}
      Prism: {}
      Other: {}
    description: This field captures the approach used by this TIRF Hardware Module to produce TIRF illumination. In Objective-based
      TIRF, the excitation lightpath and the emission channel share the same optics, which provides high signals but might
      result in high background. In Prism-based TIRF excitation light enters the dovetail prism, reflects at the glass/water
      interface and escapes through the opposite facet without interferring with the emission channel . In Lightguide-based
      TIRF, excitation light enters the lightguide, reflects multiple times from its top and bottom surfaces to generate wide-area
      evanescent waves and escapes from the opposite side of the lightguide without interferring with the emission channel.
    annotations:
      description_source: derived from TIRFHardwareModule.Method
