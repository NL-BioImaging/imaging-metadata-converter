    permissible_values:
      Global shutter: {}
      Rolling shutter: {}
      Other: {}
    description: In case of a CMOS Camera and if selectable, this field reports the sensor Exposure modality used for the
      Acquisition of this Channel. In the Rolling Exposure mode adjacent rows of the array are exposed at slightly different
      times as the readout 'waves' sweep through each half of the sensor. In the Global Exposure mode (i.e., 'Snapshot' exposure
      mode) all pixels of the array are exposed simultaneously, thus enabling 'freeze frame' capture of fast moving or fast
      changing events. In this modality the CMOS Camera behaves like an interline CCD sensor.
