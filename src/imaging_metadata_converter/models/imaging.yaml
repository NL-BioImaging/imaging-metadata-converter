slots:
  ObjectType:
    description: The class of this object, where a slot can hold several.
    range: string
    designates_type: true
classes:
  MicroscopeStand:
    description: This element refers to the core structure of this Microscope, which might also be referred to as Body, Frame,
      or Platform.
    close_mappings:
    - ome:Microscope
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '2'
          xsdfu_manytomany: 'true'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Type:
        range: MicroscopeType
        description: This field describes the general category to which this Microscope belongs. A Compound Microscope is
          a Microscope in which the primary image is generated by an objective or an objective and a tube-lens, and in which
          the Sample is observed through an eyepiece. A Custom Microscope is specially designed for specialized purposes.
          An Electrophysiology Microscope is a Microscope dedicated to electrophysiological observation and manipulation.
          A Lightsheet Microscope is a Microscope in which in contrast to epifluorescence microscopy only a thin slice (usually
          a few hundred nanometers to a few micrometers) of the sample is illuminated perpendicularly to the direction of
          observation. A Stereo Microscope (also known as Dissecting Microscope) is a low-power, binocular Microscope with
          long free working distance used for dissecting. Generally in this type of Microscope the object is observed by each
          eye from a slightly different angle, thus causing stereoscopic perception.
        required: true
        annotations:
          Tier: '1'
      Origin:
        range: Origin
        description: This field describes the origin of this Microscope Stand. Specifically it specifies whether this Microscope
          Stand was purchased from a Commercial vendor and is being used as-is (i.e., Commercial- as is), purchased from a
          Commercial vendor and subsequently Modified for a specialized application (i.e., Commercial- custom-modified) or
          entirely Custom-built from scratch (i.e., Custom-built).
        annotations:
          Tier: '1'
      EyePieceFieldNumber:
        range: float
        description: The Field Number represents the diaphragm size of the Microscope eyepiece expressed in mm.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: MicroscopeStands
    slots:
    - ObjectType
  LightSource:
    description: This element describes one or more Light Source(s) available for this Instrument. An Instrument may have
      several Light Sources of different types (Laser, Light Emitting Diode, Filament, Arc etc.). A typical fluorescence Microscope
      has two Light Sources, one for Transmitted light and one for Fluorescence light.
    exact_mappings:
    - ome:LightSource
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
          xsdfu_manytomany: 'true'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LightSourceID
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      PurchaseDate:
        range: date
        description: This field records the Date in which this Light Source was purchased.
        annotations:
          Tier: '2'
      IlluminationPowerReportingStatistic:
        range: LightSourceIlluminationPowerReportingStatistic
        description: This field reports the statistic used by the Manufacturer to report the nominal Illumination Power output
          emitted by this Light Source at Peak Wavelength.
        annotations:
          Tier: '2'
      IlluminationPowerReportingPosition:
        range: LightSourceIlluminationPowerReportingPosition
        description: This field records the Position where the reported Illumination Intensity value was obtained as reported
          by the Manufacturer.
        annotations:
          Tier: '2'
      Role:
        range: LightSourceRole
        multivalued: true
        description: 'The illumination role(s) this light source serves: Transmitted light, or excitation of Fluorescence.
          Recorded in the XSD as the Split annotation of each light source.'
    annotations:
      xsdfu_plural: LightSources
      default_subtype: GenericExcitationSource
      default_subtype_source: LiMi's generic light source (an arbitrary light source not described by the other subtypes)
    slots:
    - ObjectType
  Filter:
    description: This element describes an optical Filter positioned in the Light Path for one or more Channels available
      for this Instrument. An optical Filter is a device designed to selectively control the Wavelengths, color temperature,
      vibration direction, and/or intensity of the radiation which it transmits or reflects. An Instrument may have several
      Filters of different types, such as an Excitation, Emission, Neutral Density or an additional Generic Filter positioned
      in the Light Path for different purposes. For each fluorescence Image there should be at least one Filter element specified
      per Channel. This element can be associated with an optional Optics Holder, such as a Filter Cube, Filter Turret, Filtr
      Wheel, or Filter Slider.
    exact_mappings:
    - ome:Filter
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      TransmittanceRange:
        range: TransmittanceRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element records the Range (also known as Band) of Wavelengths that are transmitted by this optical
          component. It also records the maximum amount of light transmitted. Multiple of these elements can be used.
        exact_mappings:
        - ome:transmittance_range
      TransmittanceProfileFile:
        range: TransmittanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Transmittance profile
          of this optical component.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
          xsdfu_manytomany: 'true'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: FilterID
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Type:
        range: FilterType
        description: This field captures the Type of Filter used in this case.
        exact_mappings:
        - ome:type
        required: true
        annotations:
          Tier: '1'
      CoatingMethod:
        range: CoatingMethod
        description: This field records the type of Coating used in this case. An optical coating is one or more thin layers
          of material deposited on an optical component such as a Lens, Filter or Mirror, which alters the way in which the
          optic reflects and transmits light.
        required: true
        annotations:
          Tier: '1'
      LightPathLocation:
        range: LightPathLocationOptions
        description: 'This field records the location of this component in the Microscope Light Path. The most common positions
          are: Infinity Space, Camera Port or Illumination Port.'
        required: true
        annotations:
          Tier: '1'
      FilterHolderPosition:
        range: integer
        minimum_value: 0
        description: This field records the position of this element in a Filter Holder of any kind, such as a Filter Slider,
          Turret or Wheel.
        annotations:
          Tier: '2'
      Technology:
        range: FilterTechnologyType
        description: This field records Filtering technology utilized by this optical element. The main types of Filter technology
          used in fluorescence analysis are Absorption (aka colored) glass, Metallic-coating, Polymer-Based, or Thin-film
          interference-coating.
        annotations:
          Tier: '2'
      AttenuationMethod:
        range: AttenuationMethodType
        description: This field records the mean by which this optical element achieves out-of-band transmission attenuation.
        required: true
        annotations:
          Tier: '2'
      AttenuationCoefficient:
        range: float
        description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient)
          is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed)
          by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended
          range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance
          (0≤T≤1).
        annotations:
          Tier: '3'
      Diameter:
        range: float
        description: This field describes the Diameter of this optical element.
        annotations:
          Tier: '3'
      DiameterUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from Filter.Diameter
        description: The unit of Diameter.
      Thickness:
        range: float
        description: This field describes the Thickness of this optical element.
        annotations:
          Tier: '3'
      ThicknessUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from Filter.Thickness
        description: The unit of Thickness.
      AngleOfIncidence:
        range: float
        description: This field records the optimal angle of incidence (AOI) for this Filter. The AOI is the angle between
          the optical axis of the incident light and the axis normal to the surface of the mirror. In specular reflection
          AOI is by definition equal to the Angle Of Reflection (AOR).
        annotations:
          Tier: '3'
      AngleOfIncidenceUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from Filter.AngleOfIncidence
        description: The unit of AngleOfIncidence.
      Polarization:
        range: FilterPolarizationType
        description: This field records the Polarization effect of this optical element. Any thin-film interference coating
          that is used at non-normal AOI will cause some amount of Polarization, the precise effect varying greatly with Wavelength
          and with the particular coating design.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: Filters
      default_subtype: GenericFilter
      default_subtype_source: LiMi's generic subtype
    slots:
    - ObjectType
  MirroringDevice:
    description: This element describes a Mirror positioned in the Light Path for one or more Channels available for this
      Instrument. An Instrument may have several Mirrors of different types, such as Dichroic, Beamsplitter or Reflector.
      This element can be associated with an optional Optics Holder, such as a Filter Cube, Filter Turret, Filter Wheel, or
      Filter Slider.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: MirrorID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      OpticsHolderPosition:
        range: string
        description: This field records the position of this Mirroring Device in a Optics Holder of any kind, such as a Slider,
          Turret or Wheel.
        annotations:
          Tier: '2'
      MirrorType:
        range: MirrorType
        description: This field records the general category of this Mirror.
        required: true
        annotations:
          Tier: '3'
      Geometry:
        range: MirrorGeometry
        description: This field records the geometrical shape of the surface(s) of this Mirror.
        annotations:
          Tier: '3'
      Diameter:
        range: float
        description: This field describes the Diameter of this optical element.
        annotations:
          Tier: '3'
      DiameterUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from MirroringDevice.Diameter
        description: The unit of Diameter.
      RadiusOfCurvature:
        range: float
        description: The radius of curvature of this Mirror. A spherical lens or Mirror surface has a center of curvature
          located either along or decentered from the system local optical axis. The vertex of the lens surface is located
          on the local optical axis. The distance from the vertex to the center of curvature is the radius of curvature of
          the surface.
        annotations:
          Tier: '3'
      RadiusOfCurvatureUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from MirroringDevice.RadiusOfCurvature
        description: The unit of RadiusOfCurvature.
      AngleOfIncidence:
        range: float
        description: This field records the optimal angle of incidence (AOI) for this Mirror. The AOI is the angle between
          the optical axis of the incident light and the axis normal to the surface of the Mirror. In specular reflection
          AOI is by definition equal to the Angle Of Reflection (AOR).
        annotations:
          Tier: '3'
      AngleOfIncidenceUnit:
        range: MirroringDeviceAngleOfIncidenceUnit
        ifabsent: string(deg)
        annotations:
          Tier: '3'
          description_source: derived from MirroringDevice.AngleOfIncidence
        description: The unit of AngleOfIncidence.
      SubstrateType:
        range: string
        description: This field records the type of Substrate that is used for this Mirror. It is typically a ground and polished
          piece of optical glass.
        annotations:
          Tier: '3'
      SubstrateMaterial:
        range: OpticalMaterialName
        description: This field records the chemical composition or the designation of the substrate of this Mirroring Device.
          The substrate is typically composed of a glass material with low autofluorescence, such as UV-grade fused silica
          or Borofloat.
        annotations:
          Tier: '3'
      GlassCode:
        range: string
        description: If available, this field records the international Glass Code of the material that constitutes this Mirror.
          The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying
          the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken
          at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three
          digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass
          Code of 517642.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: MirroringDevices
    slots:
    - ObjectType
  Dichroic:
    description: A Dichroic Mirror (also often referred to as Dichroic Beamsplitter or simply as Dichroic) is a Mirror that
      spectrally separate light by transmitting and reflecting light as a function of wavelength. In the context of fluorescence
      microscopy, they are typically used to reflect the excitation light, but transmit the emitted fluorescence. Dichroic
      Mirrors can be categorized in different manners. However, the most important criteria for choosing a Dichoric Mirror
      are the Transmittance and the Reflectance Wavelength ranges.
    exact_mappings:
    - ome:Dichroic
    is_a: MirroringDevice
    abstract: true
    attributes:
      TransmittanceProfileFile:
        range: TransmittanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Transmittance profile
          of this optical component.
      ReflectanceProfileFile:
        range: ReflectanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Reflectance profile of
          this optical component.
      TransmittanceRange:
        range: TransmittanceRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element records the Range (also known as Band) of Wavelengths that are transmitted by this optical
          component. It also records the maximum amount of light transmitted. Multiple of these elements can be used.
      ReflectanceRange:
        range: ReflectanceRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the Range (also known as Band) of Wavelengths that are reflected by this optical
          componewnt. It also records the maximum amount of light reflected. Multiple of these elements can be used.
      Type:
        range: FilterType
        description: This field captures the Type of Dichroic used in this case.
        required: true
        annotations:
          Tier: '1'
      CoatingMethod:
        range: CoatingMethod
        description: This field records the type of Coating used in this case. An optical coating is one or more thin layers
          of material deposited on an optical component such as a Lens, Filter or Mirror, which alters the way in which the
          optic reflects and transmits light.
        required: true
        annotations:
          Tier: '1'
      LightPathLocation:
        range: LightPathLocationOptions
        description: 'This field records the location of this component in the Microscope Light Path. The most common positions
          are: Infinity Space, Camera Port or Illumination Port.'
        required: true
        annotations:
          Tier: '1'
      Technology:
        range: FilterTechnologyType
        description: This field records the filtering Technology utilized for this optical element. The main types of technologies
          used in fluorescence analysis are Absorption (aka colored) glass, Polymer or Thin-film coating.
        annotations:
          Tier: '2'
      AttenuationMethod:
        range: AttenuationMethodType
        description: This field records the mean by which this optical element achieves out-of-band transmission attenuation.
        required: true
        annotations:
          Tier: '2'
      AttenuationCoefficient:
        range: float
        description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient)
          is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed)
          by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended
          range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance
          (0≤T≤1).
        annotations:
          Tier: '3'
      Thickness:
        range: float
        description: This field describes the Thickness of this optical element.
        annotations:
          Tier: '3'
      ThicknessUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from Dichroic.Thickness
        description: The unit of Thickness.
      Polarization:
        range: FilterPolarizationType
        description: This field records the polarization effect of this optical element. Any thin-film interference coating
          that is used at non-normal angles-of-incidence will cause some amount of polarization, the precise effect varying
          greatly with wavelength and with the particular coating design.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: Dichroics
      default_subtype: GenericDichroic
      default_subtype_source: LiMi's generic subtype
  Detector:
    description: This element describes a Detector available for this Instrument. An Instrument may have more than one Detector
      of different types, such as a Photomultiplier, or a Camera. The Detector ID can be used as a reference within the Channel
      element. The values stored in Detector represent the fixed values, variable values modified during the Acquisition go
      in DetectorSettings.
    exact_mappings:
    - ome:Detector
    is_a: ManufacturerSpec
    mixins:
    - DetectorExtension
    abstract: true
    attributes:
      RelayLens:
        inlined: false
        annotations:
          xsd_element: RelayLensRef
          Tier: '1'
        description: This is a reference to a lens positioned at the mount connecting this detector to the microscope body.
        range: Lens
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      WavelengthRange:
        range: ComponentWavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the Range of Wavelengths this device is designed for, according to the Manufacturer.
          Multiple of this element may be used.
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: ChildElement
          Tier: '2'
          xsdfu_plural: WavelengthRanges
      ID:
        range: DetectorID
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Mount:
        range: DetectorMount
        description: This field records the type of Mount used to connect this detector to the Microscope Stand.
        ifabsent: string(C-mount)
        annotations:
          Tier: '1'
      MaxBitDepth:
        range: DigitizerType
        description: This field records the Maximum Bit Depth provided by the Detector's Analog to Digital Converter (ADC;
          also referred to as Digitizer).
        required: true
        annotations:
          Tier: '2'
      QuantumEfficiency:
        range: float
        description: This field records the Quantum Efficiency observed at Peak Wavelength, according to the Manufacturer.
          Quantum Efficiency is generally defined as is the ratio of incident photons to converted electrons. Typically expressed
          as a number between 0 and 1.
        required: true
        annotations:
          Tier: '2'
      ElectronicConversionFactor:
        range: float
        description: This field records the Electron-Conversion Factor for this Detector, as specified by the Manufacturer.
          The Electron Conversion Factor relates the actual number of electrons generated by the Detector with the digital
          number associated with each Pixel. It is expressed in electrons/Analog-to-Digital-Unit (ADU). Note that ADU can
          also be referred to as Digital Number (DN) or Binary Number. It is sometimes referred to as Digital Gain or, in
          case of CCD cameras as CCD Gain.
        required: true
        annotations:
          Tier: '2'
      ReadOutNoise:
        range: float
        description: This field captures the Read-out Noise associated with this Detector, as specified by the Manufacturer.
          Read-out Noise is a constant amount of noise and it includes thermal noise build-up and clock induced charge added
          by the CCD chip, the readout amplifier and surrounding electronics. It is generally expressed in photo-electrons
          (i.e., e- root-mean-square).
        required: true
        annotations:
          Tier: '2'
      ReadNoiseUnit:
        range: UnitsElectricCurrent
        ifabsent: string(e- rms)
        annotations:
          Tier: '2'
      DetectorNoiseModel:
        range: DetectorNoiseModel
        description: This field records the Noise Model associated with this Detector.
        required: true
        annotations:
          Tier: '2'
      DarkCurrentRate:
        range: float
        description: This field records the Dark Current Rate of this Detector as specified by the Manufacturer. The Dark
          Current Rate is the median current detected in the absence of light. Generally expressed in e-/Pixel/sec.
        required: true
        annotations:
          Tier: '2'
      DarkCurrentRateUnit:
        range: UnitsElectricCurrent
        ifabsent: string(e-/Pixel/sec)
        annotations:
          Tier: '2'
          description_source: derived from Detector.DarkCurrentRate
        description: The unit of DarkCurrentRate.
      DynamicRange:
        range: float
        description: This field records the Dynamic Range of this Detector in deciBel (dB).
        annotations:
          Tier: '2'
      DynamicRangeUnit:
        range: UnitsRatio
        ifabsent: string(decibel (dB))
        annotations:
          Tier: '2'
          description_source: derived from Detector.DynamicRange
        description: The unit of DynamicRange.
      AmbientOperatingTemperature:
        range: float
        description: This field records the Ambient Temperature at which this Detector is designed to operate, according to
          the Manufacturer.
        annotations:
          Tier: '3'
      AmbientOperatingTemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '3'
          description_source: derived from Detector.AmbientOperatingTemperature
        description: The unit of AmbientOperatingTemperature.
      AmbientOperatingHumidity:
        range: float
        description: This field records the Ambient Humidity at which this detector is designed to operate, according to the
          Manufacturer.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: Detectors
      default_subtype: GenericDetector
      default_subtype_source: LiMi's generic subtype
    slots:
    - ObjectType
  ComponentWavelengthRange:
    description: This element records the Range of Wavelengths this device is designed for, according to the Manufacturer.
      Multiple of this element may be used.
    attributes:
      PeakWavelength:
        range: float
        description: This field records the nominal Wavelength associated with the peak response rate of this device.
        annotations:
          Tier: '2'
      PeakWavelengthUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from ComponentWavelengthRange.PeakWavelength
        description: The unit of PeakWavelength.
      CutOn:
        range: PositiveFloat
        description: CutOn is the Wavelength below which the response rate is below 50%.
        required: true
        annotations:
          Tier: '3'
      CutOnUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '3'
          description_source: derived from ComponentWavelengthRange.CutOn
        description: The unit of CutOn.
      CutOff:
        range: PositiveFloat
        description: CutOff is the Wavelength above which the response rate is below 50%.
        required: true
        annotations:
          Tier: '3'
      CutOffUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '3'
          description_source: derived from ComponentWavelengthRange.CutOff
        description: The unit of CutOff.
      WavelengthProfile:
        range: uri
        description: The location of a file containing the Wavelength profile of this hardware component.
        required: true
        annotations:
          Tier: '3'
    annotations:
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '2'
      xsdfu_plural: WavelengthRanges
  LightPath:
    attributes:
      LightSourceSettings:
        range: LightSourceSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element holds the Setting applied to a Light Source used in the Light Path during the acquisition
          of this Channel as well as a reference to the LightSource (the ID attribute) in question.
      LightSourceCoupling:
        inlined: false
        annotations:
          xsd_element: LightSourceCouplingRef
          Tier: '2'
        multivalued: true
        description: This empty element refers to a LightSourceCoupling component used in this light path.
        range: LightSourceCoupling
      ExcitationFilter:
        inlined: false
        annotations:
          xsd_element: ExcitationFilterRef
          Tier: '1'
          xsdfu_plural: LightPaths
          xsdfu_parentordered: 'true'
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This empty element refers to an ExcitationFilter component used in this light path.
        exact_mappings:
        - ome:excitation_filters
        range: Filter
      StandardDichroic:
        inlined: false
        annotations:
          xsd_element: StandardDichroicRef
          Tier: '1'
        multivalued: true
        description: This empty element refers to a StandardDichroic component used in this light path.
        close_mappings:
        - ome:dichroic
        range: MirroringDevice
      EmissionFilter:
        inlined: false
        annotations:
          xsd_element: EmissionFilterRef
          Tier: '1'
        multivalued: true
        description: This empty element refers to an EmissionFilter component used in this light path.
        exact_mappings:
        - ome:emission_filters
        range: Filter
      FilterSet:
        range: FilterSet
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a FilterSet that was used for the acquisition of this Channel. A Filter Set is
          typically composed of one Excitation Filter, one Emission Filter and a Dichroic. They might either be pre-assembled
          by the Manufacturer and purchased as a whole or they can be custom assembled on site depending on the needs of the
          user.
      GenericFilter:
        inlined: false
        annotations:
          xsd_element: GenericFilterRef
          Tier: '1'
        multivalued: true
        description: This empty element refers to an additional Generic Filter component placed in this Light Path.
        range: Filter
      LensSettings:
        range: LensSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element holds the Setting applied to a Lens used in the Light Path during the acquisition of this
          Channel as well as a reference (the ID attribute) to the Lens in question.
      MirroringDeviceSettings:
        range: MirroringDeviceSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element holds the Setting applied to a Mirror used in the Light Path during the acquisition of this
          Channel as well as a reference (the ID attribute) to the Mirror in question.
      Aperture:
        inlined: false
        annotations:
          xsd_element: ApertureRef
        multivalued: true
        description: This refers to an available Optical Aperture, which is part of this Optical Assembly.
        range: OpticalAperture
      OpticalAssembly:
        inlined: false
        annotations:
          xsd_element: OpticalAssemblyRef
        multivalued: true
        description: This empty element refers to an Optical Assembly component placed in this Light Path.
        range: OpticalAssembly
      OpticalApertureSettings:
        range: OpticalApertureSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element refers to the Optical Aperture device used to acquire this image and it holds the settings
          that were applied to it during this Acquisition.
        annotations:
          xsd_element: OpticalApertureSettingsGroup
      PolarizationOptics:
        inlined: false
        annotations:
          xsd_element: PolarizationOpticsRef
          Tier: '1'
        multivalued: true
        description: This empty element refers to a PolarizationOptics component placed in this light path.
        range: PolarizationOptics
      PrismSettings:
        range: PrismSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element holds the Setting applied to a Prism used in the Light Path during the acquisition of this
          Channel as well as a reference (the ID attribute) to the Prism in question.
      ShutterSettings:
        range: ShutterSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element holds the Setting applied to a Shutter used in the Light Path during the acquisition of
          this Channel as well as a reference (the ID attribute) to the Shutter in question.
      DetectorSettings:
        range: DetectorSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element holds the Setting applied to the Detector used for the Acquisition of this Channel as well
          as a reference to the Detector (the ID attribute) in question.
        annotations:
          xsd_element: DetectorSettingsGroup
      ConfocalScannerSettings:
        range: ConfocalScannerSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element holds the Setting applied to a Confocal Scanner used during the Acquisiton of this Channel
          as well as a reference (the ID attribute) to the Confocal Scanner in question.
      AcoustoOpticalDeviceSettings:
        range: AcoustoOpticalDeviceSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element refers to the Acousto Optical Device used to acquire this image and it holds the settings
          that were applied to it during this Acquisition.
        annotations:
          xsd_element: AcoustoOpticalDeviceSettingsGroup
      ElectroOpticalDeviceSettings:
        range: ElectroOpticalDeviceSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element holds the Setting applied to an Electro-Optical Device used during the Acquisition of this
          Channel as well as a reference (the ID attribute) to the Electro-Optical Device in question.
        annotations:
          xsd_element: ElectroOpticalDeviceSettingsGroup
      TIRFSettings:
        range: TIRFSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: Total Internal Reflection Fluorescence (TIRF) microscopy is a modality in which fluorescence is excited
          in a thin layer by an evanescent wave produced by total internal reflection. This element defines the TIRF conditions
          that were used for this Experiment.
      LightPathMap:
        range: LightPathLightPathMap
        inlined: true
        description: This element holds a Map that records the order in which the different optical component associated with
          this Light Path are physically laid out.
        annotations:
          Extension: Basic
          Domain: ImageAcquisitionSettings
          Category: ChildElement
          Tier: '2'
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A user-defined Name for this component.
        annotations:
          Tier: '1'
    slots:
    - ObjectType
    description: A description of the light path
    exact_mappings:
    - ome:LightPath
    annotations:
      description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
      Tier: '1'
      Tier_source: models/fullSchema.json (the LiMi XSD gives LightPath no Tier)
  LightPathLightPathMap:
    description: This element holds a Map that records the order in which the different optical component associated with
      this Light Path are physically laid out.
    attributes:
      OpticalComponentPosition:
        range: LightPathLightPathMapOpticalComponentPosition
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element records the Position of individual optical components in this Light Path.
        annotations:
          Domain: ImageAcquisitionSettings
          Category: ChildElement
          Tier: '2'
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        identifier: true
        annotations:
          Tier: '1'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: ChildElement
      Tier: '2'
  LightPathLightPathMapOpticalComponentPosition:
    description: This element records the Position of individual optical components in this Light Path.
    attributes:
      ID:
        range: LSID
        description: This is the ID of an existing Optical Component that is present in this Light Path.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Order:
        range: PositiveInt
        description: This field records the Positional order in which this optical component is found in this Light Path during
          the Acquisition of this Image.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Domain: ImageAcquisitionSettings
      Category: ChildElement
      Tier: '2'
  Settings:
    description: Settings is an empty complex type that is contained and extended by all the *Settings elements. Each *Settings
      element defines an attribute named ID of simple type *ID and the other information that is needed. Each simple type
      *ID is restricted to the base type LSID with an appropriate pattern.
    exact_mappings:
    - ome:Settings
    abstract: true
    attributes:
      MapAnnotation:
        range: MapAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A Map Annotation. The contents of this is a list of Key/Value pairs.
      AdditionalVendorInformation:
        range: AdditionalVendorInformation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element is intendended to be used as a last-resort solution to capture vendor-specific Additional
          Information about this hardware component, which cannot be described using either available model elements (Classes
          or Attributes) or the Map Annotation feature of the schema. The use of this feature should not be intended as a
          way to hide information that the Imaging Community has designated as essential to ensure rigor and reproducibility.
          In case this feature is used, the Vendor is fully responsible for this information, including but not limited to,
          making sure this information is appropriately recorded and kept up to date.
  DetectorSettings:
    description: This element holds the Setting applied to the Detector used for the Acquisition of this Channel as well as
      a reference to the Detector (the ID attribute) in question.
    exact_mappings:
    - ome:DetectorSettings
    is_a: Settings
    abstract: true
    attributes:
      ID:
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: Detector
      EffectiveBitDepth:
        range: DigitizerType
        description: If selectable, this field reports the Effective Bit Depth that was used by the Detector's Analog to Digital
          Converter (ADC; also referred to as Digitizer) for the Acquisition of this Channel.
        required: true
        annotations:
          Tier: '1'
      AnalogGain:
        range: float
        description: 'This field reports the Analog Gain (also known as Inherent Gain or simply as Gain) that was applied
          during the Acquisition of this Image. The Analog Gain is a property Inherent to the Detector and it specifies how
          many electrons correspond to 1 signal unit (photon) detected. Gain is reported in terms of electrons/ADU (analog-to-digital
          unit). A gain of 8 means that the Detector digitizes the light signal so that each ADU corresponds to 8 photoelectrons.
          NOTE: In the case of Point Detectors the value of Analog Gain can be set freely by the user. Conversely, in the
          case of Cameras, it is common for the Gain to be preset by the Manufacturer to minimize noise. In this case, either
          the Analog Gain cannot be changed or the user is given the choice of selecting between a few preset Analog Gains
          values upon Acquisition. Finally, several Cameras might have so-called Automatic Gain Control (AGC or AutoGain)
          that will automatically adjusts so the full range of the Analog-to-Digital Converter (ADC) is used. Unless you can
          turn off the AGC, the use of these Cameras are highly discouraged for quantitative work.'
        close_mappings:
        - ome:gain
        required: true
        annotations:
          Tier: '1'
      AmplificationGain:
        range: float
        description: 'This field reports the Amplification Gain (i.e., electronic gain as apposed to the inherent Gain) that
          was set during the Acquisition of this Image. Amplification Gain in general measures of the ability of a Detector
          to add energy to the input light signal therefore increasing its power or amplitude. Higher Amplification Gain levels
          amplify the signal and result in greater brightness, contrast and background signal. Examples include: 1) the Electron
          Multiplication (EM) gain (as opposed to the inherent Analog Gain) for an EMCCD camera. 2) The Gain introduced by
          the Micro-Channel Plate in an Intensified CCD or CMOS camera. 3) The amplification of the electron current provided
          by a Photomultiplier Tube, and measured as the ratio of the input photoelectron current emitted by the photocatode
          and the current reaching the anode. 4) The signal amplification provided by an Avalache Photo Diode (APD).'
        required: true
        annotations:
          Tier: '1'
      Offset:
        range: float
        description: 'If available, this field reports the actual Offset that was set for this Detector during the Acquisition
          of this Channel. Offset is an electronic baseline added to the output signal generated by the sensor to ensure that
          the resulting signal level always correspond to a positive number of counts. Offset defines the black level setting
          of the image and it should be adjusted so that the lowest signals are near the detection threshold. NOTE: Please
          note that most modern Cameras do not have the possibility of setting the Offset.'
        exact_mappings:
        - ome:offset
        annotations:
          Tier: '2'
      OffsetMode:
        range: DetectorOffsetMode
        description: This field describes the way in which the Voltage Offset of the Detector is reported. It typically is
          expressed as an Arbitrary-units number, a Scaled percent (-100 to 100), or a a Voltage.
        annotations:
          Tier: '3'
    slots:
    - ObjectType
    annotations:
      default_subtype: GenericDetectorSettings
      default_subtype_source: LiMi's generic subtype
  Annotation:
    description: An annotation from which all others are ultimately derived.
    abstract: true
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
          Tier: '3'
        description: This element contains a description for the annotation.[plain-text multi-line string]
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: AnnotationID
        description: A Unique Identifier for this element.
        required: true
        identifier: true
        annotations:
          Tier: '3'
      Namespace:
        range: uri
        description: We recommend the inclusion of a namespace for annotations you define. If it is absent then we assume
          the annotation is to use our (OME's) default interpretation for this type.
        required: true
        annotations:
          Tier: '3'
      Annotator:
        range: ExperimenterID
        description: The Annotator is the person who attached this annotation.e.g. If UserA annotates something with TagB,
          owned by UserB, UserA is still the Annotator.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: Annotations
    slots:
    - ObjectType
  BasicAnnotation:
    description: An abstract Basic Annotation from which some others are derived.
    is_a: Annotation
    abstract: true
    annotations:
      xsdfu_plural: BasicAnnotations
  NumericAnnotation:
    description: An abstract Basic Annotation from which some others are derived.
    is_a: BasicAnnotation
    abstract: true
    annotations:
      xsdfu_plural: NumericAnnotations
  TextAnnotation:
    description: An abstract Basic Annotation from which some others are derived.
    is_a: Annotation
    abstract: true
    annotations:
      xsdfu_plural: TextAnnotations
  TypeAnnotation:
    description: An abstract Type Annotation from which some others are derived.
    is_a: Annotation
    abstract: true
    annotations:
      xsdfu_plural: TypeAnnotations
  FileAnnotation:
    is_a: TypeAnnotation
    attributes:
      BinaryFile:
        range: BinaryFile
        inlined: true
        required: true
        description: Describes a binary file.
    description: A file object annotation
    annotations:
      description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
  Shape:
    description: The shape element contains a single specific ROI shape and links that to any channels, and a timepoint and
      a z-section. It also records any transform applied to the ROI shape.
    abstract: true
    attributes:
      Transform:
        range: AffineTransform
        inlined: true
        description: This is a matrix used to transform the shape. The element has 6 xsd:float attributes. If the element
          is present then all 6 values must be included.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      FillColor:
        range: Color
        description: 'The color of the fill - encoded as RGBA The value "-1" is #FFFFFFFF so solid white (it is a signed 32
          bit value) NOTE: Prior to the 2012-06 schema the default value was incorrect and produced a transparent red not
          solid white.'
      FillRule:
        range: ShapeFillRule
        description: The rule used to decide which parts of the shape to fill. [enumeration]
        annotations:
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
      StrokeColor:
        range: Color
        description: 'The color of the stroke - encoded as RGBA The value "-1" is #FFFFFFFF so solid white (it is a signed
          32 bit value) NOTE: Prior to the 2012-06 schema the default value was incorrect and produced a transparent red not
          solid white.'
      StrokeWidth:
        range: float
        description: The width of the stroke. Units are set by StrokeWidthUnit.
      StrokeWidthUnit:
        range: UnitsLength
        description: The units used for the stroke width.
        ifabsent: string(Pixel)
      StrokeDashArray:
        range: string
        description: e.g....................... "none", "10 20 30 10"
      Text:
        range: string
      FontFamily:
        range: ShapeFontFamily
        description: 'The font family used to draw the text. [enumeration] Note: these values are all lower case so they match
          the standard HTML/CSS values. "fantasy" has been included for completeness; we do not recommend its regular use.
          This attribute is under consideration for removal from the OME-XML schema.'
        annotations:
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
      FontSize:
        range: NonNegativeInt
        description: Size of the font. Units are set by FontSizeUnit.
      FontSizeUnit:
        range: UnitsLength
        description: The units used for the font size.
        ifabsent: string(pt)
      FontStyle:
        range: ShapeFontStyle
        description: The style and weight applied to the text. [enumeration] This is a simplified combination of the HTML/CSS
          attributes font-style AND font-weight.
        annotations:
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
      Locked:
        range: boolean
        description: Controls whether the shape is locked and read only, true is locked, false is editable.
      ID:
        range: ShapeID
        required: true
        identifier: true
      TheZ:
        range: NonNegativeInt
        description: The z-section the ROI applies to. If not specified then the ROI applies to all the z-sections of the
          Image. [units:none] This is numbered from 0.
      TheT:
        range: NonNegativeInt
        description: The timepoint the ROI applies to. If not specified then the ROI applies to all the timepoints of the
          Image. [units:none] This is numbered from 0.
      TheC:
        range: NonNegativeInt
        description: The Channel the ROI applies to. If not specified then the ROI applies to all the channels of the Image.
          [units:none] This is numbered from 0.
    annotations:
      xsdfu_plural: Shapes
    slots:
    - ObjectType
  AffineTransform:
    description: A matrix used to transform the shape. ⎡ A00, A01, A02 ⎤ ⎢ A10, A11, A12 ⎥ ⎣ 0, 0, 1 ⎦
    attributes:
      A00:
        range: float
        required: true
      A10:
        range: float
        required: true
      A01:
        range: float
        required: true
      A11:
        range: float
        required: true
      A02:
        range: float
        required: true
      A12:
        range: float
        required: true
  ManufacturerSpec:
    description: This describes the Manufacturer specifications for this component (i.e., Manufacturer Name, Model designation
      and Catalog Number).
    exact_mappings:
    - ome:ManufacturerSpec
    abstract: true
    attributes:
      MapAnnotation:
        range: MapAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A Map Annotation. The contents of this is a list of Key/Value pairs.
      SpecsFile:
        range: FileAnnotation
        inlined: true
        description: This element refers to a PDF file that contains the specifications for this hardware component as provided
          by the Manufacturer.
        annotations:
          Extension: Basic
          Domain: MicroscopeHardwareSpecifications
          Category: ChildElement
          Tier: '3'
      AdditionalVendorInformation:
        range: AdditionalVendorInformation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element is intendended to be used as a last-resort solution to capture vendor-specific Additional
          Information about this hardware component, which cannot be described using either available model elements (Classes
          or Attributes) or the Map Annotation feature of the schema. The use of this feature should not be intended as a
          way to hide information that the Imaging Community has designated as essential to ensure rigor and reproducibility.
          In case this feature is used, the Vendor is fully responsible for this information, including but not limited to,
          making sure this information is appropriately recorded and kept up to date.
      Manufacturer:
        range: string
        description: This field refers to the company, research group or individual who built or manufactured this hardware
          component.
        exact_mappings:
        - ome:manufacturer
        required: true
        annotations:
          Tier: '1'
      Model:
        range: string
        description: This field refers to the Model name or any other designation the Manufacturer uses for this component.
        exact_mappings:
        - ome:model
        required: true
        annotations:
          Tier: '1'
      CatalogNumber:
        range: string
        description: This field records the Catalog, Part or Serial Number used by the Manufacturer to uniquely identify this
          component.
        required: true
        annotations:
          Tier: '1'
      LotNumber:
        range: string
        description: The Lot Number used by the Manufacturer to refer to a specific production batch or lot for this component.
        exact_mappings:
        - ome:lot_number
        annotations:
          Tier: '3'
  Map:
    description: This is a Mapping of Key/Value pairs.
    attributes:
      M:
        range: MapEntry
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This is a Key/Value pair used to build up a Mapping. The Element and Attribute Name are kept to single
          letters to minimize the length at the expense of readability as they are likely to occur many times.
        annotations:
          Tier: '3'
          xsdfu_plural: Ms
    annotations:
      Tier: '3'
      xsdfu_plural: Maps
  MapEntry:
    description: This is a Key/Value pair used to build up a Mapping. The Element and Attribute Name are kept to single letters
      to minimize the length at the expense of readability as they are likely to occur many times.
    exact_mappings:
    - ome:MapEntry
    attributes:
      Value:
        range: string
        exact_mappings:
        - ome:value
        annotations:
          xsd_text_content: true
      K:
        range: string
        description: This is the key of this Key/Value pair.
        exact_mappings:
        - ome:key
        annotations:
          Tier: '3'
    annotations:
      Tier: '3'
      xsdfu_plural: Ms
  Software:
    description: This element represents a commercial, or open-source Software, script, macro, plugin or module utilized for
      any Image Acquisition or Quality Control task related to this Instrument.
    mixins:
    - SoftwareExtension
    abstract: true
    attributes:
      SoftwareModule:
        inlined: false
        annotations:
          xsd_element: SoftwareModuleRef
        multivalued: true
        description: This empty element refers to any existing Software Module that was used in association with this Instrument.
        range: Software
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: string
        description: This field records the Name or any other designation the Author uses for this Software.
        required: true
        annotations:
          Tier: '1'
      Version:
        range: string
        description: This field records the Version of this Software.
        required: true
        annotations:
          Tier: '1'
      Developer:
        range: string
        description: This field records the Developer(s) of this Software. In case this is a non-commercial, open-source Software,
          this refers to the name of the individual or consortium who developed the Software. In the case of a commercial
          Software, this might refer to the Commercial entity but it can also be used to refer to the individual developer,
          if knonw.
        required: true
        annotations:
          Tier: '1'
      WebsiteURL:
        range: uri
        description: This field records the URL address of any Website where the Software can be obtained. In case of open-source
          Software this field should record the URL for the Git repository from which to obtain the source-code.
        required: true
        annotations:
          Tier: '2'
      PrimaryPublicationID:
        range: string
        description: This field captures the a Unique Identifier for the Primary Publication describing this Software. Examples
          include, Digital Object Identifier (DOI), PubMed Central Identifier (PMCID), ArXiv.org ID etc.
        annotations:
          Tier: '2'
      OpenSource:
        range: boolean
        description: This records whether this Software is OpenSource (True) or proprietary (False).
        annotations:
          Tier: '2'
      Macro:
        range: boolean
        description: This field records whether this Software is a Macro or a Scprit (True) or is it a full free-standing
          program.
        annotations:
          Tier: '2'
      Build:
        range: string
        description: The specific build of this Software.
        annotations:
          Tier: '2'
      Patch:
        range: string
        description: This recodes the version for an optional Patch, HotFix or Update used for this Sofware to run this Instrument.
          A Patch (aka HotFix, or Update) is a set of changes to a computer program or its supporting data designed to update,
          fix, or improve it. This includes fixing security vulnerabilities, and other bugs, with such patches usually being
          called bugfixes or bug fixes, and improving the functionality, usability or performance.
        annotations:
          Tier: '2'
      ReleaseDate:
        range: date
        description: The date in which this Software was resleased.
        annotations:
          Tier: '3'
      Language:
        range: string
        description: This records the computer Language in which this Software was developed.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: Software tools
      default_subtype: AcquisitionSoftware
      default_subtype_source: 'chosen by the user: no generic software in LiMi'
    slots:
    - ObjectType
  SamplePositioning:
    description: This element describes a Sample-Optics Positioning device available for this Instrument. An Instrument may
      have more than one of these devices of different types. For example, a typical setup might include a Mechanical Stage,
      a Stage Insert, a Turret Objective Focusing, and a Piezoelectric Objective Focusing device.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: SamplePositioningID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Encoded:
        range: Encoded
        description: This field describes whether this Sample Positioning Device is equipped with a system (i.e., encoder)
          to monitor movement and provide automatic positional feedback for high-precision operations, and it specifies the
          type of encoders it has.
        required: true
        annotations:
          Tier: '1'
      Motorized:
        range: boolean
        description: This field describes whether (True) or not (False) this Sample Positioning Device is fitted with a Motorized
          component (i.e., ball-screw drives or rack mechanisms, sometimes equipped with precision calibration) to primarily
          assist in the translational movement of the sample in the X and Y or Z directions. A Motorized Stage is also often
          referred to as a Scanning Stage.
        required: true
        annotations:
          Tier: '1'
      ZMaxVelocity:
        range: float
        description: This field describes the maximum Z-axis Velocity at which this Sample Positioning Device is capable of
          moving.
        annotations:
          Tier: '1'
      ZMaxVelocityUnit:
        range: UnitsVelocity
        ifabsent: string(nm/s)
        annotations:
          Tier: '1'
          description_source: derived from SamplePositioning.ZMaxVelocity
        description: The unit of ZMaxVelocity.
      ZRepeatability:
        range: float
        description: This field captures the expected Accuracy with which this Sample Positioning Device is capable of returning
          to a previously visited Z-axis Position, as specified by the Manufacturer. This metric is important for example
          for Tiling.
        required: true
        annotations:
          Tier: '1'
      ZRepeatabilityUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '1'
          description_source: derived from SamplePositioning.ZRepeatability
        description: The unit of ZRepeatability.
      ZTravelRange:
        range: float
        description: This field describes the total range in the Z-axis that this Sample Positioning Device can travel.
        annotations:
          Tier: '1'
      ZTravelRangeUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '1'
          description_source: derived from SamplePositioning.ZTravelRange
        description: The unit of ZTravelRange.
      MovementAxes:
        range: StageMovementAxes
        description: This field describes the axes or combination of axes along which this Sample Positioning Device is capable
          of moving.
        required: true
        annotations:
          Tier: '2'
      BuiltIn:
        range: boolean
        description: This field indicates whether this Sample Positioning Device is built into the Microscope Stand (True)
          or it is removable and interchangeable (False).
        required: true
        annotations:
          Tier: '2'
      ZReproducibility:
        range: float
        description: This field captures the expected Precision with which this this Sample Positioning Device is capable
          of maintaining a given Z-axis Position over time during as specified by the Manufacturer. This metric is generally
          referred to as Reproducibility and it might also be referred to as Focal Drift. This metric is particularly relevant
          for Stereology systems and for the calibration of Sample Positioning devices.
        annotations:
          Tier: '2'
      ZReproducibilityUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from SamplePositioning.ZReproducibility
        description: The unit of ZReproducibility.
      ZSettlingTime:
        range: float
        description: This field describes the expected time it takes for this Sample Positioning Device to stabilize at the
          target Z-axis position, as specified by the Manufacturer.
        annotations:
          Tier: '2'
      ZSettlingTimeUnit:
        range: UnitsTime
        ifabsent: string(ms)
        annotations:
          Tier: '2'
          description_source: derived from SamplePositioning.ZSettlingTime
        description: The unit of ZSettlingTime.
      ZResolution:
        range: float
        description: This field describes the Z-axis motion Resolution of this Sample Positioning Device as specified by the
          Manufacturer.
        annotations:
          Tier: '2'
      ZResolutionUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from SamplePositioning.ZResolution
        description: The unit of ZResolution.
      ZPositionLinearityError:
        range: float
        description: This field describes the Z-axis positioning error (typically expressed in % error) associated with this
          Sample Positioning Device as specified by the Manufacturer.
        annotations:
          Tier: '2'
      Type:
        range: PositioningType
        description: This field describes the general category of this Sample Positioning Device.
        annotations:
          Tier: '3'
      RotationAngle:
        range: float
        description: The angle by which this Sample Positioning Device is capable of rotating.
        annotations:
          Tier: '3'
      RotationAngleUnit:
        range: UnitsAngle
        ifabsent: string(deg)
        annotations:
          Tier: '3'
          description_source: derived from SamplePositioning.RotationAngle
        description: The unit of RotationAngle.
    annotations:
      xsdfu_plural: SamplePositioningDevices
    slots:
    - ObjectType
  FocusingDevice:
    description: A Focusing mechanism is used to obtain maximum sharpness in an Image by changing the distance between a Sample
      and the optical system forming the Image. In this case, a Z-axis Focusing mechanism moves the Objective along the optical
      axis.
    is_a: SamplePositioning
    abstract: true
    annotations:
      xsdfu_plural: FocusingDevices
  Stage:
    description: This element describes a platform positioned at right angle to the optical axis of this Microscope, which
      is designed to either directly hold a Specimen Holder containing a Sample to be observed, or a Stage Insert, which itself
      holds the Sample Holder. In many cases, this device is capable of mechanical movements (as in a Mechanical Stage) to
      allow easy positioning and rotation of the Sample in the X-, Y-, and Z-axes.
    is_a: SamplePositioning
    mixins:
    - StageExtension
    abstract: true
    attributes:
      XYMaxVelocity:
        range: float
        description: This field describes the maximum XY-axis Velocity at which this Stage is capable of moving.
        annotations:
          Tier: '1'
      XYMaxVelocityUnit:
        range: UnitsVelocity
        ifabsent: string(nm/s)
        annotations:
          Tier: '1'
          description_source: derived from Stage.XYMaxVelocity
        description: The unit of XYMaxVelocity.
      XYRepeatability:
        range: float
        description: This field captures the expected Accuracy with which this Stage is capable of returning to a previously
          visited XY-plane Position, as specified by the Manufacturer. This metric is important for example for Tiling.
        required: true
        annotations:
          Tier: '1'
      XYRepeatabilityUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '1'
          description_source: derived from Stage.XYRepeatability
        description: The unit of XYRepeatability.
      XTravelRange:
        range: float
        description: This field describes the Total Range in the X-axis that this Stage can Travel.
        required: true
        annotations:
          Tier: '2'
      XTravelRangeUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from Stage.XTravelRange
        description: The unit of XTravelRange.
      YTravelRange:
        range: float
        description: This field describes the Total Range in the Y-axis that this Stage can Travel.
        required: true
        annotations:
          Tier: '2'
      YTravelRangeUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from Stage.YTravelRange
        description: The unit of YTravelRange.
      XYReproducibility:
        range: float
        description: This field captures the expected Precision with which this Stage is capable of maintaining a given XY-plane
          Position over time during as specified by the Manufacturer. This metric is generally referred to as Reproducibility
          and it might also be referred to as Lateral Drift. This metric is particularly relevant for Stereology systems and
          for the calibration of Sample Positioning devices.
        annotations:
          Tier: '2'
      XYReproducibilityUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from Stage.XYReproducibility
        description: The unit of XYReproducibility.
      XYSettlingTime:
        range: float
        description: This field describes the expected time it takes for this Stage to stabilize at the target XY-plane position,
          as specified by the Manufacturer.
        annotations:
          Tier: '2'
      XYSettlingTimeUnit:
        range: UnitsTime
        ifabsent: string(ms)
        annotations:
          Tier: '2'
          description_source: derived from Stage.XYSettlingTime
        description: The unit of XYSettlingTime.
      XYResolution:
        range: float
        description: This field describes the XY-plane motion Resolution of this Stage as specified by the Manufacturer.
        annotations:
          Tier: '2'
      XYZResolutionUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
      XYPositionLinearityError:
        range: float
        description: This field describes the XY-axis positioning error (typically expressed in % error) associated with this
          Stage as specified by the Manufacturer.
        annotations:
          Tier: '2'
    annotations:
      default_subtype: MechanicalStage
      default_subtype_source: 'chosen by the user: no generic stage in LiMi'
  LightSourceCoupling:
    description: This element describes the device(s)/method(s) used to couple an available Light Source(s) with this Microscope
      Stand to transfer light to the specimen. A typical light Microscope has a Light Coupling device for each available Light
      Source.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      CouplingLens:
        inlined: false
        annotations:
          xsd_element: CouplingLensRef
          Tier: '2'
        description: This is a reference to a Lens positioned at the connection between this Light Source coupling element
          and the Microscope Stand.
        range: Lens
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LightSourceCouplingID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '2'
      Attenuation:
        range: float
        description: This field reports a measure of the capacity of this Light Source Coupling device to attenuate the Illumination
          Power of the light passing through measured at the Peak Wavelength and expressed in dB/km.
        required: true
        annotations:
          Tier: '3'
      Transmittance:
        range: float
        description: The maximum amount of light this Light Source Coupling device is capable of transmitting at the Peak
          Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        annotations:
          Tier: '3'
    annotations:
      xsdfu_plural: LightSourceCouplingDevices
    slots:
    - ObjectType
  OpticalAssembly:
    description: This is a device that might include one or more Lenses, other Optics and Optics Holders. Optical Devices
      might be custom built or they might also be available as pre-assembled units. Such devices might be embedded within
      the Microscope Stand or exist as independent units. Examples include the Condenser and the Microscope Tube.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Filter:
        inlined: false
        annotations:
          xsd_element: FilterRef
          Tier: '2'
        multivalued: true
        description: This refers to an available Filter, which is part of this Optical Assembly.
        range: Filter
      Lens:
        inlined: false
        annotations:
          xsd_element: LensRef
        multivalued: true
        description: This refers to an available Lens, which is part of this Optical Assembly.
        range: Lens
      MirroringDevice:
        inlined: false
        annotations:
          xsd_element: MirroringDeviceRef
        multivalued: true
        description: This refers to an available Mirroring Device, which is part of this Optical Assembly.
        range: MirroringDevice
      Aperture:
        inlined: false
        annotations:
          xsd_element: ApertureRef
        multivalued: true
        description: This refers to an available Optical Aperture, which is part of this Optical Assembly.
        range: OpticalAperture
      PolarizationOptics:
        inlined: false
        annotations:
          xsd_element: PolarizationOpticsRef
        multivalued: true
        description: This refers to an available Polarization Optics, which is part of this Optical Assembly.
        range: PolarizationOptics
      Prism:
        inlined: false
        annotations:
          xsd_element: PrismRef
        multivalued: true
        description: This refers to an available Prism, which is part of this Optical Assembly.
        range: Prism
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
    annotations:
      xsdfu_plural: OpticalAssemblyDevices
    slots:
    - ObjectType
  OpticsHolder:
    description: This element represents a Holder for Filters, Dichroic and other Optical Element that is associated with
      this Instrument. These Holders come in different arrangements such as Cubes, Sliders, Turrets, and Wheels. While some
      of these Holders, such as Filter Cubes, might be pre-assebled by the Manufacturer and pruchased as a whole, in the majority
      of cases they are assembled on site depending on the needs of the user.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LensID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Motorized:
        range: boolean
        description: This field describes whether this device is Motor (True) or Manually (False) operated.
        annotations:
          Tier: '3'
      ResponseTime:
        range: float
        description: This field records the time it takes for this Shutter to open and close, according to the Manufacturer.
        annotations:
          Tier: '3'
      ResponseTimeUnit:
        range: UnitsTime
        annotations:
          Tier: '3'
          description_source: derived from OpticsHolder.ResponseTime
        description: The unit of ResponseTime.
      NrOfSlots:
        range: integer
        description: This field records how many Slots this Optics Holder has.
        annotations:
          Tier: '2'
    slots:
    - ObjectType
  FilterWheel:
    description: This element represents a circular holder for multiple individual Filters or Dichroics.
    is_a: OpticsHolder
    abstract: true
  FilterSlider:
    description: This element represents a linear holder for multiple individual Filters or Dichroics.
    is_a: OpticsHolder
    abstract: true
  OpticalAperture:
    description: This element represents any mechanical, non optical device that is placed in the Light Path and spatially
      modifies the light beam. Examples include, Pin Holes, Phase Rings, Dark Field Stops, Hoffman Modulators, Diffraction
      Gratings etc. This element can be associated with an optional Optics Turret.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LensID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      OpticsHolderPosition:
        range: string
        description: This field records the position of this Optical Aperture in a Optics Turret.
        annotations:
          Tier: '2'
      OuterDiameter:
        range: float
        description: This field captures the physical outer diameter of the component
        annotations:
          Tier: '3'
      OuterDiameterUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from OpticalAperture.OuterDiameter
        description: The unit of OuterDiameter.
    slots:
    - ObjectType
  Lens:
    description: This element describes additional lenses positioned in the Light Path for one or more Channels available
      for this Instrument. A Lens is a component of glass or transparent plastic material, usually circular, with two primary
      surfaces that are ground and polished in a specific manner designed to produce either a convergence or divergence of
      light passing through the material. An Instrument may have several Lenses with different functions, such as a Magnification
      Changer (also known as Optovar), a Coupling Lens connecting the Light Source with the Microscope Stand, a Relay Lens
      positioned at the Detector mount, or additional Lenses placed in the Light Path for various purposes. This element can
      be associated with an optional Optics Turret.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LensID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Magnification:
        range: float
        description: This field records the nominal Magnification provided by this Lens as specified by the Manufacturer.
        required: true
        annotations:
          Tier: '1'
      LensNA:
        range: float
        description: This field captures the Numerical Aperture (NA) of this Lens expressed as a floating-point (real) number.
          NA is a number that was defined initially by Abbe to characterize Objectives and Condensers. NA can be calculated
          by the expression n sin alpha, where n is the Refractive Index of the medium between the Lens and the Sample, and
          alpha is half the Angular Aperture of the Lens. NA is a measure of how much of the illumination that leaves the
          specimen actually passes through the Lens. The larger the NA, the more information the lens can transmit. Expected
          range 0.02 - 1.5.
        annotations:
          Tier: '1'
      Infinity:
        range: boolean
        description: This field records whether (True) or not (False) this Lens is infinity corrected. An Infinity-corrected
          Lens is fixed for an infinite sample to primary Image distance. It needs to be used with a Tube Lens of appropriate
          focal length to obtain the specified magnification.
        annotations:
          Tier: '2'
      Composite:
        range: boolean
        description: This field records whether this Lens is Composite (i.e., composed of multiple Lenses; True) or Simple
          (False).
        required: true
        annotations:
          Tier: '3'
      Shape:
        range: LensShapeType
        description: This field records the shape of the profile (e.g., concave vs. convex) of this Lens. Please note that
          this attribute is often used to classify Lenses into categories.
        required: true
        annotations:
          Tier: '3'
      Geometry:
        range: LensGeometry
        description: The geometrical shape of this lens' surface(s).
        annotations:
          Tier: '3'
      Diameter:
        range: float
        description: This field records the physical diameter of this Lens.
        annotations:
          Tier: '3'
      DiameterUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from Lens.Diameter
        description: The unit of Diameter.
      Coating:
        range: string
        description: An optical Coating consists of one or more thin layers of material deposited on an optical component
          such as a Lens or Mirror, which alters the way in which the optic reflects and transmits light. This field records
          the optical Coating used for this Lens.
        annotations:
          Tier: '3'
      AttenuationCoefficient:
        range: float
        description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient)
          is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed)
          by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended
          range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance
          (0≤T≤1).
        annotations:
          Tier: '3'
      WorkingDistance:
        range: float
        description: This field reports the Working Distance of this Lens under normal operating conditions. The Working Distance
          is the distance (in air, or in the specified immersion liquid) between the front of an Objective and the surface
          of the cover glass or of the specimen if uncovered.
        annotations:
          Tier: '2'
      WorkingDistanceUnit:
        range: UnitsLength
        description: This field reports the Working Distance of this Lens under normal operating conditions. The Working Distance
          is the distance (in air, or in the specified immersion liquid) between the front of an Objective and the surface
          of the cover glass or of the specimen if uncovered.
        ifabsent: string(mm)
        annotations:
          Tier: '2'
      ImageDistance:
        range: float
        description: This field records the distance in air between the rear principal Plane of this Lens and the primary
          Image Plane.
        annotations:
          Tier: '3'
      ImageDistanceUnits:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
      FrontFocalLength:
        range: float
        description: This field records the distance (f) measured along the optical axis from the front principal Plane of
          this Lens to the front focal Plane (F).
        annotations:
          Tier: '3'
      FrontFocalLengthUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from Lens.FrontFocalLength
        description: The unit of FrontFocalLength.
      BackFocalLength:
        range: float
        description: This field records the distance (f') measured along the optical axis from the rear principal Plane of
          this Lens to the rear focal Plane (F').
        annotations:
          Tier: '3'
      BackFocalLengthUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from Lens.BackFocalLength
        description: The unit of BackFocalLength.
      RadiusOfCurvature:
        range: float
        description: This field records the Radius of Curvature of this Lens. A spherical Lens or Mirror surface has a center
          of curvature located either along or decentered from the system local optical axis. The vertex of the lens surface
          is located on the local optical axis. The distance from the vertex to the center of curvature is the Radius of Curvature
          of the surface.
        annotations:
          Tier: '3'
      RadiusOfCurvatureUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from Lens.RadiusOfCurvature
        description: The unit of RadiusOfCurvature.
      MaterialName:
        range: OpticalMaterialName
        description: This field records the chemical composition or designation of the Material this Lens is made of.
        annotations:
          Tier: '3'
      GlassCode:
        range: string
        description: If available, this field records the international Glass Code of the material that constitutes this Lens.
          The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying
          the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken
          at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three
          digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass
          Code of 517642.
        annotations:
          Tier: '3'
      RefractiveIndex:
        range: float
        description: This field records the Refractive Index of the material this Lens is made of, as specified by the Manufacturer.
          The Refractive Index is the ratio of the speed of light (more precisely, the phase velocity) in a vacuum versus
          that in a given medium.
        annotations:
          Tier: '3'
      AbbeNumber:
        range: float
        description: This field records the Abbe number of this Lens. The Abbe Number is a measure of the material's dispersion
          (variation of Refractive Index versus Wavelength), with high values indicating low dispersion.
        annotations:
          Tier: '3'
      Density:
        range: float
        description: This field records the Density of the material this Lens is made of.
        annotations:
          Tier: '3'
      DensityUnit:
        range: UnitsDensity
        annotations:
          Tier: '3'
          description_source: derived from Lens.Density
        description: The unit of Density.
    slots:
    - ObjectType
    annotations:
      default_subtype: GenericLens
      default_subtype_source: LiMi's generic subtype
  Camera:
    description: This element describes a Camera available for this Instrument. A Camera is a device that converts optical
      brightness into an electrical signal using a grid of pixel sensor unit cells and then reproduces an image of the specimen.
      An Instrument may have more than one camera of different types, such as traditional CCD, EMCCD, Intensified EMCCD, sCMOS,
      or Analog Video.
    is_a: Detector
    abstract: true
    attributes:
      ArrayWidth:
        range: integer
        description: This field records the Width of this Camera chip or sensor area, expressed in Pixel.
        annotations:
          Tier: '1'
      ArrayHeight:
        range: integer
        description: This field records the Height of this Camera chip or sensor area, expressed in Pixel.
        annotations:
          Tier: '1'
      PixelWidth:
        range: float
        description: This field records the Physical Width of each Camera Pixel.
        required: true
        annotations:
          Tier: '1'
      PixelWidthUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '1'
          description_source: derived from Camera.PixelWidth
        description: The unit of PixelWidth.
      PixelHeight:
        range: float
        description: This field records the Physical Height of each Camera Pixel.
        required: true
        annotations:
          Tier: '1'
      PixelHeightUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '1'
          description_source: derived from Camera.PixelHeight
        description: The unit of PixelHeight.
      Illumination:
        range: CameraIllumination
        description: This field records the type of illumination the Camera chip receives.
        required: true
        annotations:
          Tier: '2'
      ManufacturerOffet:
        range: float
        description: This field reports the Camera Offset when it is pre-set by the Manufacturer. The Offset is an electronic
          baseline added to the output signal from the sensor to ensure that the displayed signal level is always a positive
          number of counts.
        annotations:
          Tier: '2'
      Color:
        range: ColorMode
        description: This field records whether this is a Color Camera and what type it is.
        annotations:
          Tier: '2'
      PixelWellCapacity:
        range: integer
        description: This field records the maximum amount of charge each Pixel Well can hold, measured in electron counts.
        required: true
        annotations:
          Tier: '3'
      PixelWellCapacityUnit:
        range: UnitsElectricCharge
        ifabsent: string(e-)
        annotations:
          Tier: '3'
          description_source: derived from Camera.PixelWellCapacity
        description: The unit of PixelWellCapacity.
      MaximumFrameRate:
        range: float
        description: This field records the maximal rate at which this Camera can acquire a single full-frame.
        required: true
        annotations:
          Tier: '3'
      MaximumFrameRateUnit:
        range: UnitsFrequency
        ifabsent: string(fps)
        annotations:
          Tier: '3'
          description_source: derived from Camera.MaximumFrameRate
        description: The unit of MaximumFrameRate.
      MaximumReadoutRate:
        range: float
        description: This field records the maximal Pixel Readout Rate allowed by this Camera.
        required: true
        annotations:
          Tier: '3'
      MaximumReadoutRateUnit:
        range: UnitsFrequency
        ifabsent: string(MHz)
        annotations:
          Tier: '3'
          description_source: derived from Camera.MaximumReadoutRate
        description: The unit of MaximumReadoutRate.
      VerticalClockSpeed:
        range: float
        description: This field records the maximal speed at which each vertical column of pixels in the camera chip can be
          shifted down and read.
        annotations:
          Tier: '3'
      VerticalClockSpeedUnit:
        range: UnitsTime
        ifabsent: string(µs)
        annotations:
          Tier: '3'
          description_source: derived from Camera.VerticalClockSpeed
        description: The unit of VerticalClockSpeed.
  PointDetector:
    description: This element represents any Detector that collects light from a restricted point-like area of an Image. These
      detectors are typically used in Laser Scanning Confocal Microscopy.
    is_a: Detector
    abstract: true
    attributes:
      Coating:
        range: CoatingMaterial
        description: This field records the Coating Material used to increase the photoelectric properties of the metallic
          cathode used in this Detector. The coating releases electrons much more readily than the underlying metal, allowing
          it to detect the low-energy photons in infrared radiation. The lens transmits the radiation from the object being
          viewed to a layer of coated glass. The photons strike the metal surface and transfer electrons to its rear side.
          The freed electrons are then collected to produce the final Image.
        required: true
        annotations:
          Tier: '1'
      SignalProcessing:
        range: SignalProcessingMode
        description: This field describes the method employed by this device to process the output signal and convert it into
          a measure of incident light intensity. In Photon Counting mode the system is set in a manner in which each photon
          hitting the head of the detector gives either no or 1 discrete pulse. This way by counting the pulses one is sure
          to be counting individual photons. In Analog mode the system is set so the mean value of all signal pulses is used
          as a measure of intensity.
        annotations:
          Tier: '1'
      ResponseTime:
        range: float
        description: This field records the Time required for the Detector to respond to an optical input.
        annotations:
          Tier: '3'
      ResponseTimeUnit:
        range: UnitsTime
        annotations:
          Tier: '3'
          description_source: derived from PointDetector.ResponseTime
        description: The unit of ResponseTime.
      DeadTime:
        range: float
        description: This field records the Time required for the Detector to become responsive again after being hit by a
          photon.
        annotations:
          Tier: '3'
      DeadTimeUnit:
        range: UnitsTime
        annotations:
          Tier: '3'
          description_source: derived from PointDetector.DeadTime
        description: The unit of DeadTime.
      RadiantSensitivity:
        range: float
        description: This field records the Radiant Sensitivity observed with this Detector at the peak Wavelength
        annotations:
          Tier: '3'
      RadiantSensitivityUnit:
        range: UnitsPower
        annotations:
          Tier: '3'
          description_source: derived from PointDetector.RadiantSensitivity
        description: The unit of RadiantSensitivity.
  OpticalApertureSettings:
    description: This element refers to the Optical Aperture device used to acquire this image and it holds the settings that
      were applied to it during this Acquisition.
    is_a: Settings
    abstract: true
    attributes:
      TransmittanceProfileFile:
        range: TransmittanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Transmittance profile
          of this optical component.
      ReflectanceProfileFile:
        range: ReflectanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Reflectance profile of
          this optical component.
      TransmissionWavelengthRangeSettings:
        range: TransmissionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Transmission Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ReflectionWavelengthRangeSettings:
        range: ReflectionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Reflection Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ID:
        description: This is the Unique Identifier of the device used in this case.
        inlined: false
        annotations:
          Tier: '1'
        range: OpticalAperture
    slots:
    - ObjectType
    annotations:
      default_subtype: GenericOpticalApertureSettings
      default_subtype_source: LiMi's generic subtype
  WavelengthRangeSettingsType:
    abstract: true
    attributes:
      CutOn:
        range: PositiveFloat
        description: CutOn is the Wavelength below which the response rate is below 50%. In case a CutOn Wavelength is not
          available, such as in the case of a ShortPass or Notch configuration, please enter 000.
        required: true
        annotations:
          Tier: '1'
      CutOff:
        range: PositiveFloat
        description: CutOff is the Wavelength below which the response rate is below 50%. In case a CutOff Wavelength is not
          available, such as in the case of a LongPass configuration, please enter 000.
        required: true
        annotations:
          Tier: '1'
      WavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '1'
  ConfocalScanner:
    description: According to ISO-10934-2-2007, a confocal microscope is a microscope in which, ideally, a point in the object
      plane is illuminated by a diffraction-limited spot of light, and light emanating from this point is focused upon and
      detected from an area smaller than the central area of the diffraction disc. The confocal principle leads to improved
      axial resolution by suppression of light from out-of-focus planes. In order to utilize this modality, a Confocal Scanner
      is used to form an Image of an extended Specimen region by controlling the direction of an outgoing Laser beam, the
      position of the Specimen or the location of the illuminated and detected spots simultaneously. Refer to https://www.iso.org/standard/69820.html
      for further details and measurement methods.
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        required: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: ConfocalScannerID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      NrOfScanPoints:
        range: integer
        description: This field records the number of scanning points available for this scan head.
        required: true
        annotations:
          Tier: '2'
      MaxFrameRate:
        range: float
        description: This field captures the Maximum full Frame Rate available for this device, as specificed by the Manufacturer.
        annotations:
          Tier: '2'
      MaxFrameRateUnit:
        range: UnitsFrequency
        annotations:
          Tier: '2'
          description_source: derived from ConfocalScanner.MaxFrameRate
        description: The unit of MaxFrameRate.
      PointsConfiguration:
        range: string
        description: This field records a description of the arrangement of scan points (can be spiral, linear, grid, other)
        annotations:
          Tier: '3'
    slots:
    - ObjectType
  AcoustoOpticalDevice:
    description: This is a device that performs spatial, temporal, and spectral modulations of light on the basis of acousto-optic
      (AO) diffraction. AO diffraction is a phenomenon whereby an acoustic wave propagating in an optically transparent medium,
      produces a periodic modulation of the index of refraction of the medium via the elasto-optical effect and might therefore
      diffract portions of an incident light into one or more directions.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: AcoustoOpticalDeviceID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      ContrastRatio:
        range: PercentFraction
        description: This field records the reports on the ratio of maximum versus minimum transmittance.
        annotations:
          Tier: '2'
      Coating:
        range: string
        description: An optical Coating consists of one or more thin layers of material deposited on an optical component
          such as a Lens or Mirror, which alters the way in which the optic reflects and transmits light. This field records
          the thin-film material used to coat the non linear crystal and reduce surface reflection.
        annotations:
          Tier: '2'
      AttenuationMethod:
        range: AttenuationMethodType
        description: This field records the mean by which this optical element achieves out-of-band transmission attenuation.
        annotations:
          Tier: '2'
      AttenuationCoefficient:
        range: float
        description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient)
          is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed)
          by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended
          range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance
          (0≤T≤1).
        annotations:
          Tier: '3'
      TuningAccuracy:
        range: float
        description: This field measures the accuracy with which the wavelength discriminating capacity of this device can
          be tuned or changed.
        required: true
        annotations:
          Tier: '3'
      TuningAccuracyUnit:
        range: UnitsLength
        required: true
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDevice.TuningAccuracy
        description: The unit of TuningAccuracy.
      Polarization:
        range: PolarizationMode
        description: This field records the polarization effect of this optical element. Dichroic beamsplitters (and, in fact,
          any thin-film interference coating that is used at non-normal angles-of-incidence) will cause some amount of polarization,
          the precise effect varying greatly with wavelength and with the particular coating design.
        required: true
        annotations:
          Tier: '3'
      Bragg:
        range: boolean
        description: This indicates whether this device is operated under Bragg regime (True) or not. In Bragg regime, at
          one particular incidence angle , only one diffraction order is produced - the others are annihilated by destructive
          interference.
        required: true
        annotations:
          Tier: '3'
      TuningResolution:
        range: float
        description: This field measures the wavelength discriminating capacity of this device and it is defined as the full
          width at half-maximum (FWHM) of the main lobe from the selected optical output, and is a function of both wavelength
          and device configuration.
        annotations:
          Tier: '3'
      TuningResolutionUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDevice.TuningResolution
        description: The unit of TuningResolution.
      TuningRate:
        range: float
        description: This field records the time it takes for this device to be tuned without degrading resolution. This time
          is determined by the velocity of the acoustic wage as it traverses the aperture of this device.
        annotations:
          Tier: '3'
      TuningRateUnit:
        range: UnitsTime
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDevice.TuningRate
        description: The unit of TuningRate.
      AngleOfIncidence:
        range: float
        description: This field records the optimal angle of incidence (AOI) for this mirror. The AOI is the angle between
          the optical axis of the incident light and the axis normal to the surface of the mirror. In specular reflection
          AOI is by definition equal to the Angle Of Reflection (AOR).
        annotations:
          Tier: '3'
      AngleOfIncidenceUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDevice.AngleOfIncidence
        description: The unit of AngleOfIncidence.
      AngularAperture:
        range: float
        description: This field records the angular aperture is the half-angle of the cone of light entering the this device.
          It is, therefore, a measure of how much of the incident light actually passes through the device.
        annotations:
          Tier: '3'
      AngularApertureUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDevice.AngularAperture
        description: The unit of AngularAperture.
      Material:
        range: AODMaterial
        description: This field describes the transparent crystal or glass material used to build this device, through which
          the light propagates and whose refractive properties can be modulated by acoustic waves of different frequencies.
        annotations:
          Tier: '3'
      Design:
        range: AODDesign
        description: This field describes wheher the acoustic wave is absorbed or reflected by the distal surface of the crystal.
        annotations:
          Tier: '3'
      Geometry:
        range: AODGeometry
        description: This field describes the the direction of the applied electric field with respect to the light beam.
          Longitudinal devices have the electric field in the direction of the light beam, which passes through holes in the
          electrodes. Transverse devices have the electric field perpendicular to the light beam.
        annotations:
          Tier: '3'
      OperatingTemperature:
        range: float
        description: This field records the ambient temperature at which this device is designed to operate, according to
          the Manufacturer.
        annotations:
          Tier: '3'
      OperatingTemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDevice.OperatingTemperature
        description: The unit of OperatingTemperature.
    slots:
    - ObjectType
  ElectroOpticalDevice:
    description: This is is a device which can be used for controlling the power (→ intensity modulators), phase (→ phase
      modulators) or polarization of light with an electrical control signal. It typically contains one or two Pockels cells,
      and possibly additional optical elements such as polarizers.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: ElectroOpticalDeviceID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '2'
      ModulationMode:
        range: ModulationModeList
        description: This field records the describes the type of modulation this devices produces on a beam of light.
        annotations:
          Tier: '2'
      ContrastRatio:
        range: PercentFraction
        description: This field records the reports on the ratio of maximum versus minimum transmittance.
        annotations:
          Tier: '2'
      Coating:
        range: string
        description: An optical Coating consists of one or more thin layers of material deposited on an optical component
          such as a Lens or Mirror, which alters the way in which the optic reflects and transmits light. This field records
          the thin-film material used to coat the non linear crystal and reduce surface reflection.
        annotations:
          Tier: '2'
      AttenuationMethod:
        range: AttenuationMethodType
        description: This field records the mean by which this optical element achieves out-of-band transmission attenuation.
        annotations:
          Tier: '2'
      AttenuationCoefficient:
        range: float
        description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient)
          is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed)
          by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended
          range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance
          (0≤T≤1).
        annotations:
          Tier: '2'
      TuningAccuracy:
        range: float
        description: This field measures the accuracy with which the wavelength discriminating capacity of this device can
          be tuned or changed.
        required: true
        annotations:
          Tier: '3'
      TuningAccuracyUnit:
        range: UnitsLength
        required: true
        annotations:
          Tier: '3'
          description_source: derived from ElectroOpticalDevice.TuningAccuracy
        description: The unit of TuningAccuracy.
      TuningResolution:
        range: float
        description: This field measures the wavelength discriminating capacity of this device and it is defined as the full
          width at half-maximum (FWHM) of the main lobe from the selected optical output, and is a function of both wavelength
          and device configuration.
        annotations:
          Tier: '3'
      TuningResolutionUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from ElectroOpticalDevice.TuningResolution
        description: The unit of TuningResolution.
      TuningRate:
        range: float
        description: This field records the time it takes for this device to be tuned without degrading resolution. This time
          is determined by the velocity of the acoustic wage as it traverses the aperture of this device.
        annotations:
          Tier: '3'
      TuningRateUnit:
        range: UnitsTime
        annotations:
          Tier: '3'
          description_source: derived from ElectroOpticalDevice.TuningRate
        description: The unit of TuningRate.
      AngleOfIncidence:
        range: float
        description: This field records the optimal angle of incidence (AOI) for this mirror. The AOI is the angle between
          the optical axis of the incident light and the axis normal to the surface of the mirror. In specular reflection
          AOI is by definition equal to the Angle Of Reflection (AOR).
        annotations:
          Tier: '3'
      AngleOfIncidenceUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from ElectroOpticalDevice.AngleOfIncidence
        description: The unit of AngleOfIncidence.
      AngularAperture:
        range: float
        description: This field records the angular aperture is the half-angle of the cone of light entering the this device.
          It is, therefore, a measure of how much of the incident light actually passes through the device.
        annotations:
          Tier: '3'
      AngularApertureUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from ElectroOpticalDevice.AngularAperture
        description: The unit of AngularAperture.
      OperatingTemperature:
        range: float
        description: This field records the ambient temperature at which this device is designed to operate, according to
          the Manufacturer.
        annotations:
          Tier: '3'
      OperatingTemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '3'
          description_source: derived from ElectroOpticalDevice.OperatingTemperature
        description: The unit of OperatingTemperature.
      OperatingHumidity:
        range: PercentFraction
        description: This field records the ambient humidity at which this device is designed to operate, according to the
          manufactuer.
        annotations:
          Tier: '3'
      WarmUpTime:
        range: float
        description: This field records the time it takes for this device to reach operating conditions according to the Manufacturer.
        annotations:
          Tier: '3'
      WarmUpTimeUnit:
        range: UnitsTime
        annotations:
          Tier: '3'
          description_source: derived from ElectroOpticalDevice.WarmUpTime
        description: The unit of WarmUpTime.
    slots:
    - ObjectType
  AcoustoOpticalDeviceSettings:
    description: This element refers to the Acousto Optical Device used to acquire this image and it holds the settings that
      were applied to it during this Acquisition.
    is_a: Settings
    abstract: true
    attributes:
      TransmittanceProfileFile:
        range: TransmittanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Transmittance profile
          of this optical component.
      ReflectanceProfileFile:
        range: ReflectanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Reflectance profile of
          this optical component.
      TransmissionWavelengthRangeSettings:
        range: TransmissionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Transmission Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ReflectionWavelengthRangeSettings:
        range: ReflectionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Reflection Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ID:
        description: This is the Unique Identifier of the device used in this case.
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: AcoustoOpticalDevice
      DiffractionEfficiency:
        range: PercentFraction
        description: This field records a measure of the performance efficiency of this device. It's a measure of how much
          optical power is diffracted into a designated direction compared to the power incident onto the diffractive element.
        annotations:
          Tier: '2'
      AcousticVelocity:
        range: float
        description: This field records the acoustic wave transit time across the crystal used during this Acquisition.
        annotations:
          Tier: '3'
      AcousticVelocityUnit:
        range: UnitsVelocity
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDeviceSettings.AcousticVelocity
        description: The unit of AcousticVelocity.
      AcousticFrequency:
        range: float
        description: This field records the frequency of the acoustic wave used to alter the diffraction properties of the
          crystal during this Acquisition. Wavelength tuning is very rapid and limited only by the acoustic transit time across
          the crystal.
        annotations:
          Tier: '3'
      AcousticFrequencyUnit:
        range: UnitsFrequency
        annotations:
          Tier: '3'
          description_source: derived from AcoustoOpticalDeviceSettings.AcousticFrequency
        description: The unit of AcousticFrequency.
    slots:
    - ObjectType
  ElectroOpticalDeviceSettings:
    description: This element refers to the Electro-Optical Device used to acquire this image and it holds the settings that
      were applied to it during this Acquisition.
    is_a: Settings
    abstract: true
    attributes:
      TransmittanceProfileFile:
        range: TransmittanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Transmittance profile
          of this optical component.
      ReflectanceProfileFile:
        range: ReflectanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Reflectance profile of
          this optical component.
      TransmissionWavelengthRangeSettings:
        range: TransmissionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Transmission Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ReflectionWavelengthRangeSettings:
        range: ReflectionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Reflection Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ID:
        description: This is the Unique Identifier of the device used in this case.
        inlined: false
        annotations:
          Tier: '1'
        range: ElectroOpticalDevice
    slots:
    - ObjectType
  OpticalCalibrationStandard:
    description: The optical standard used in this case. This might be a pre-manufactured slide, such as those produced by
      Argolight (http://argolight.com/), Geller MicroAnalytical Laboratory (Magnification Reference Standard MRS-4 and others;
      http://www.gellermicro.com/mag_standards/mrs.html), Zeiss and others. Alternatively, the standard might be a slide containing
      multi-colored beads of known size and emission characteristics. Finally, slides coated with specific DNA origami patterns
      are increasingly being used for this purpose as well.
    is_a: ManufacturerSpec
    abstract: true
    attributes:
      WavelengthRange:
        range: WavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a range of Wavelengths this component is designed for, according to the Manufacturer.
          Multiple of this element may be used.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A User-defined Name for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        required: true
        annotations:
          Tier: '2'
      Method:
        range: string
        description: This field records a Description of Method that was employed to prepare this Optical Calibration Standard
          Sample.
        annotations:
          Tier: '2'
    slots:
    - ObjectType
  IntensityCalibration:
    description: This describes the procedure(s) that were used for excitation and detector calibration and the resulting
      calibration results.
    abstract: true
    attributes:
      IntensityCalibrationTool:
        inlined: false
        annotations:
          xsd_element: IntensityCalibrationToolRef
          Tier: '2'
        multivalued: true
        description: This element is a reference to the tool, if any, used to perform this calibratin procdure
        range: IntensityCalibrationTool
      IntensityCalibrationReport:
        range: FileAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element refers to any File containing a report generated by the Calibration Software referred to
          in Calibration procedure.
        annotations:
          Extension: Calibration and Performance
          Domain: ImageAcquisitionSettings
          Category: ChildElement
          Tier: '2'
      CalibrationSoftware:
        range: CalibrationSoftware
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a software tool utilized to analyze Calibration metrics obtained from this Calibration
          Procedure and generate a suitable Calibration Reports. As an example, such a Software tool might analyzes microscopy
          images of fluorescent Colored Beads in order to quantify the Resolution and Chromatic Registration of a fluorescence
          microsocope over the full Field of View (FOV). An example of such a tool is PSFj (http://www.knoplab.de/psfj/sample-page/).
          Alternatively, such a Software tool might be used to extract Intensity Calibration results obtained with a specific
          Intensity Calibration Tool, such as a Power Meter or MetaMax (https://www.umassmed.edu/grunwaldlab/).
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '3'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Date:
        range: date
        description: Ths field records the Date in which this Calibration procedure was performed.
        required: true
        annotations:
          Tier: '2'
      SampleSize:
        range: PositiveInt
        description: This field captures the Size of the Sample that was used to calculate the reported Intensity Calibration
          metrics. For example, this might represent the number of Illumination Power measurements that were utilized to calculate
          the Illumination Stability of a given Light Source.
        annotations:
          Tier: '2'
      Method:
        range: string
        description: This field records a Description of Method used for this calibration procedure.
        required: true
        annotations:
          Tier: '2'
  cellType:
    attributes:
      CellNr:
        range: PositiveInt
        description: The index of this Cell.
        required: true
        annotations:
          Tier: '2'
      CellValue:
        range: float
        description: The Value of the metric contained in this Cell.
        required: true
        annotations:
          Tier: '2'
      CellValueUnit:
        range: string
        annotations:
          Tier: '2'
          description_source: derived from cellType.CellValue
        description: The unit of CellValue.
  rowType:
    attributes:
      Cell:
        range: cellType
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        annotations:
          Tier: '3'
      RowNr:
        range: PositiveInt
        description: The index of this Row.
        required: true
        annotations:
          Tier: '2'
  OME:
    description: 'The OME element is a container for all information objects accessible by OME. These information objects
      include descriptions of the imaging experiments and the people who perform them, descriptions of the microscope, the
      resulting images and how they were acquired, the analyses performed on those images, and the analysis results themselves.
      An OME file may contain any or all of this information. With the creation of the Metadata Only Companion OME-XML and
      Binary Only OME-TIFF files the top level OME node has changed slightly. It can EITHER: Contain all the previously expected
      elements OR: Contain a single BinaryOnly element that points at its Metadata Only Companion OME-XML file.'
    mixins:
    - OMEExtension
    attributes:
      ID:
        description: A unique identifier for this document.
        identifier: true
        required: true
        annotations:
          source: added for metaseed datasets, which identify their root record; the XSD OME has none
      Name:
        description: A user assigned name for this document.
        annotations:
          source: added for metaseed datasets, which identify their root record; the XSD OME has none
      Rights:
        range: Rights
        inlined: true
        description: The rights holder of this data and the rights held.
      Project:
        range: Project
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: The Project ID is required. Datasets can be grouped into projects using a many-to-many relationship.
          A Dataset may belong to one or more Projects by including one or more ProjectRef elements which refer to Project
          IDs. Projects do not directly contain images - only by virtue of containing datasets, which themselves contain images.
        annotations:
          xsd_choice: OME_choice_2
      Dataset:
        range: Dataset
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: An element specifying a collection of images that are always processed together. Images can belong to
          more than one Dataset, and a Dataset may contain more than one Image. Images contain one or more DatasetRef elements
          to specify what datasets they belong to. Once a Dataset has been processed in any way, its collection of images
          cannot be altered. The ExperimenterRef and ExperimenterGroupRef elements specify the person and group this Dataset
          belongs to. Projects may contain one or more Datasets, and Datasets may belong to one or more Projects. This relationship
          is specified by listing DatasetRef elements within the Project element.
        annotations:
          xsd_choice: OME_choice_2
      Folder:
        range: Folder
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: An element specifying a possibly heterogeneous collection of data. Folders may contain Folders so that
          data may be organized within a tree of Folders. Data may be in multiple Folders but a Folder may not be in more
          than one other Folder.
        annotations:
          xsd_choice: OME_choice_2
      Experiment:
        range: Experiment
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the experiment during which this Image was acquired. The optional Description
          element may contain free text to further describe the experiment.
        annotations:
          xsd_choice: OME_choice_2
      Plate:
        range: Plate
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element identifies microtiter plates within a screen. A plate can belong to more than one screen.
          The Screen(s) that a plate belongs to are specified by the ScreenRef element. The Plate ID and Name attributes are
          required. The Wells in a plate are numbers from the top-left corner in a grid starting at zero. i.e. The top-left
          well of a plate is index (0,0).
        annotations:
          xsd_choice: OME_choice_2
      Screen:
        range: Screen
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: The Screen element is a grouping for Plates. The required attribute is the Screen's Name and ID - both
          must be unique within the document. The Screen element may contain an ExternalRef attribute that refers to an external
          database. A description of the screen may be specified in the Description element. Screens may contain overlapping
          sets of Plates i.e. Screens and Plates have a many-to-many relationship. Plates contain one or more ScreenRef elements
          to specify what screens they belong to.
        annotations:
          xsd_choice: OME_choice_2
      Experimenter:
        range: Experimenter
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a person who performed an imaging experiment. This person may also be a user of
          the OME system, in which case the UserName element contains their login name.Experimenters may belong to one or
          more groups which are specified using one or more ExperimenterGroupRef elements.
        annotations:
          xsd_choice: OME_choice_2
      ExperimenterGroup:
        range: ExperimenterGroup
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: The ExperimenterGroupID is required. Information should ideally be specified for at least one Leader
          as a contact for the group. The Leaders are themselves Experimenters.
        annotations:
          xsd_choice: OME_choice_2
      Instrument:
        range: Instrument
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the Instrument used to capture the Image. It is primarily a container referring
          to the list of hardware components included in a given Microscope. The list consists of the Microscope Stand, Microscope
          Table, Light Source, Light Source Coupling, Sample Holder, Focusing, Objective, Filter, Dichroic, Additional Lens
          (including a commonly used Magnification Changer, also known as Optovar), Additional Mirroring Device, Polarization
          Optics, Prism, Optical Aperture, Optical Device, Detector and Calibration Tool. The Filter element can be either
          composed of separate Excitation, Emission filters, and Dichroic mirrors or a single Filter Set. An Instrument might
          have multiple Light Sources, Detectors, Objectives, and Filters, etc. Each of these has its own ID attribute, which
          can be referred to from the Image, Plane or more commonly Channel elements associated with a given Image Acquisition
          session. It is understood that the Light Path configuration can be different for each Channel, but cannot be different
          for each timepoint or each Plane of an XYZ stack.
        annotations:
          xsd_choice: OME_choice_2
      Image:
        range: Image
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the actual Image that was acquired and its meta-data. The elements that are references
          (ending in Ref or Settings) refer to elements defined outside of the Image element. Ref elements are simple links,
          while Settings elements are links with additional values. If any of the required Image attributes or elements are
          missing, its guaranteed to be an invalid document.
        annotations:
          xsd_choice: OME_choice_2
      StructuredAnnotations:
        range: StructuredAnnotations
        inlined: true
        description: An unordered collection of annotation attached to objects in the OME data model.
        annotations:
          xsd_choice: OME_choice_2
      ROI:
        range: ROI
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A four dimensional 'Region of Interest'. If they are not used, and the Image has more than one Plane,
          the entire set of Planes is assumed to be included in the ROI. Multiple ROIs may be specified.
        annotations:
          xsd_choice: OME_choice_2
      BinaryOnly:
        range: OMEBinaryOnly
        inlined: true
        description: Pointer to an external metadata file. If this element is present, then no other metadata may be present
          in this file, i.e. this file is a place-holder.
        annotations:
          xsd_choice: OME_choice_2
      UUID:
        range: UniversallyUniqueIdentifier
        description: This unique identifier is used to keep track of multi part files. It allows the links between files to
          survive renaming. While OPTIONAL in the general case this is REQUIRED in a MetadataOnly Companion to a collection
          of BinaryOnly files.
      Creator:
        range: string
        description: This is the name of the creating application of the OME-XML and preferably its full version. e.g "CompanyName,
          SoftwareName, V2.6.3456" This is optional but we hope it will be set by applications writing out OME-XML from scratch.
      CustomProperties:
        description: Source metadata values the model does not model, kept so no metadata is lost.
        range: Property
        multivalued: true
        inlined_as_list: true
    tree_root: true
  OMEBinaryOnly:
    description: Pointer to an external metadata file. If this element is present, then no other metadata may be present in
      this file, i.e. this file is a place-holder.
    attributes:
      MetadataFile:
        range: string
        description: Filename of the OME-XML metadata file for this binary data. If the file cannot be found, a search can
          be performed based on the UUID.
        required: true
      UUID:
        range: UniversallyUniqueIdentifier
        description: The unique identifier of another OME-XML block whose metadata describes the binary data in this file.
          This UUID is considered authoritative regardless of mismatches in the filename.
        required: true
  Experimenter:
    description: This element describes a person who performed an imaging experiment. This person may also be a user of the
      OME system, in which case the UserName element contains their login name.Experimenters may belong to one or more groups
      which are specified using one or more ExperimenterGroupRef elements.
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: ExperimenterID
        required: true
        identifier: true
      FirstName:
        range: string
        description: First name, sometime called christian name or given name or forename. [plain text string]
      MiddleName:
        range: string
        description: Any other names. [plain text string]
      LastName:
        range: string
        description: A person's last name sometimes called surname or family name. [plain text string]
      Email:
        range: string
        description: A person's email address. [valid email address as string]
      Institution:
        range: string
        description: A person's Institution The organizing structure that people belong to other than groups. A university,
          or company, etc. We do not specify a department element, and do not mean for Institution to be used in this way.
          We simply wish to say XXX at YYY. Where YYY has a better chance of being tied to a geographically fixed location
          and of being more recognizable than a group of experimenters. [plain text string]
      UserName:
        range: string
        description: This is the username of the experimenter (in a 'unix' or 'database' sense). [plain text string]
        annotations:
          xsdfu_unique: 'true'
    annotations:
      Extension: Core
      Domanin: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: Experimenters
      xsdfu_global: 'true'
  ExperimenterGroup:
    description: The ExperimenterGroupID is required. Information should ideally be specified for at least one Leader as a
      contact for the group. The Leaders are themselves Experimenters.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the group. [plain-text multi-line string]
      Experimenter:
        inlined: false
        annotations:
          xsd_element: ExperimenterRef
          xsdfu_manytomany: 'true'
          xsdfu_childordered: 'true'
        multivalued: true
        description: This empty element refers to Experimenter that performed this experiment.
        range: Experimenter
      Leader:
        inlined: false
        annotations:
          xsd_element: Leader
        multivalued: true
        description: Contact information for a ExperimenterGroup leader specified using a reference to an Experimenter element
          defined elsewhere in the document.
        range: Experimenter
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      Name:
        range: string
        annotations:
          xsdfu_unique: 'true'
      ID:
        range: ExperimenterGroupID
        required: true
        identifier: true
    annotations:
      Extension: Core
      Domanin: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: ExperimenterGroups
      xsdfu_global: 'true'
  Project:
    description: The Project ID is required. Datasets can be grouped into projects using a many-to-many relationship. A Dataset
      may belong to one or more Projects by including one or more ProjectRef elements which refer to Project IDs. Projects
      do not directly contain images - only by virtue of containing datasets, which themselves contain images.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the project. [plain-text multi-line string]
      Experimenter:
        inlined: false
        annotations:
          xsd_element: ExperimenterRef
        description: This empty element refers to Experimenter that performed this experiment.
        range: Experimenter
      ExperimenterGroup:
        inlined: false
        annotations:
          xsd_element: ExperimenterGroupRef
        description: This empty element refers to the ExperimenterGroup that owns this Image.
        range: ExperimenterGroup
      Dataset:
        inlined: false
        annotations:
          xsd_element: DatasetRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: The DatasetRef element refers to a Dataset by specifying the Dataset ID attribute. One or more DatasetRef
          elements may be listed within the Image element to specify what Datasetsthe Image belongs to.
        range: Dataset
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      Name:
        range: string
      ID:
        range: ProjectID
        required: true
        identifier: true
    annotations:
      xsdfu_plural: Projects
  Dataset:
    description: An element specifying a collection of images that are always processed together. Images can belong to more
      than one Dataset, and a Dataset may contain more than one Image. Images contain one or more DatasetRef elements to specify
      what datasets they belong to. Once a Dataset has been processed in any way, its collection of images cannot be altered.
      The ExperimenterRef and ExperimenterGroupRef elements specify the person and group this Dataset belongs to. Projects
      may contain one or more Datasets, and Datasets may belong to one or more Projects. This relationship is specified by
      listing DatasetRef elements within the Project element.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the dataset. [plain-text multi-line string]
      Experimenter:
        inlined: false
        annotations:
          xsd_element: ExperimenterRef
        description: This empty element refers to Experimenter that performed this experiment.
        range: Experimenter
      ExperimenterGroup:
        inlined: false
        annotations:
          xsd_element: ExperimenterGroupRef
        description: This empty element refers to the ExperimenterGroup that owns this Image.
        range: ExperimenterGroup
      Image:
        inlined: false
        annotations:
          xsd_element: ImageRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: The ImageRef element is a reference to an Image element.
        range: Image
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      Name:
        range: string
        description: A name for the dataset that is suitable for presentation to the user.
      ID:
        range: DatasetID
        required: true
        identifier: true
    annotations:
      xsdfu_plural: Datasets
  Screen:
    description: The Screen element is a grouping for Plates. The required attribute is the Screen's Name and ID - both must
      be unique within the document. The Screen element may contain an ExternalRef attribute that refers to an external database.
      A description of the screen may be specified in the Description element. Screens may contain overlapping sets of Plates
      i.e. Screens and Plates have a many-to-many relationship. Plates contain one or more ScreenRef elements to specify what
      screens they belong to.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the screen.
      Reagent:
        range: Reagent
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: Reagent is used to describe a chemical or some other physical experimental parameter.
      Plate:
        inlined: false
        annotations:
          xsd_element: PlateRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: The PlateRef element is a reference to a Plate element. Screen elements may have one or more PlateRef
          elements to define the plates that are part of the screen. Plates may belong to more than one screen.
        range: Plate
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: ScreenID
        required: true
        identifier: true
      Name:
        range: string
      ProtocolIdentifier:
        range: string
        description: A pointer to an externally defined protocol, usually in a screening database.
      ProtocolDescription:
        range: string
        description: A description of the screen protocol; may contain very detailed information to reproduce some of that
          found in a screening database.
      ReagentSetDescription:
        range: string
        description: A description of the set of reagents; may contain very detailed information to reproduce some of that
          information found in a screening database.
      ReagentSetIdentifier:
        range: string
        description: A pointer to an externally defined set of reagents, usually in a screeningdatabase/automation database.
      Type:
        range: string
        description: A human readable identifier for the screen type; e.g. RNAi, cDNA, SiRNA, etc. This string is likely to
          become an enumeration in future releases.
    annotations:
      xsdfu_plural: Screens
  Plate:
    description: This element identifies microtiter plates within a screen. A plate can belong to more than one screen. The
      Screen(s) that a plate belongs to are specified by the ScreenRef element. The Plate ID and Name attributes are required.
      The Wells in a plate are numbers from the top-left corner in a grid starting at zero. i.e. The top-left well of a plate
      is index (0,0).
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the plate.
      Well:
        range: Well
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A Well is a component of the Well/Plate/Screen construct to describe screening applications. A Well has
          a number of WellSample elements that link to the Images collected in this well. The ReagentRef links any Reagents
          that were used in this Well. A well is part of only one Plate. The origin for the row and column identifiers is
          the top left corner of the plate starting at zero. i.e The top left well of a plate is index (0,0)
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      PlateAcquisition:
        range: PlateAcquisition
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: PlateAcquisition is used to describe a single Acquisition run for a plate. This object is used to record
          the set of images acquired in a single Acquisition run. The Images for this run are linked to PlateAcquisition through
          WellSample.
      ID:
        range: PlateID
        required: true
        identifier: true
      Name:
        range: string
        description: 'The Name identifies the plate to the user. It is used much like the ID, and so must be unique within
          the document. If a plate name is not available when one is needed it will be constructed in the following order:
          1. If name is available use it. 2. If not use "Start time - End time" (NOTE: Not a subtraction! A string representation
          of the two times separated by a dash.) 3. If these times are not available use the Plate ID.'
      Status:
        range: string
        description: 'A textual annotation of the current state of the plate with respect to the experiment work-flow; e.g.
          1. Seed cell: done; 2. Transfection: done; 3. Gel doc: todo.'
      ExternalIdentifier:
        range: string
        description: The ExternalIdentifier attribute may contain a reference to an external database.
      ColumnNamingConvention:
        range: NamingConvention
        description: The ColumnNamingConvention
      RowNamingConvention:
        range: NamingConvention
        description: The RowNamingConvention
      WellOriginX:
        range: float
        description: This defines the X position to use for the origin of the fields (individual images) taken in a well.
          It is used with the X in the WellSample to display the fields in the correct position relative to each other. Each
          Well in the plate has the same well origin. Units are set by WellOriginXUnit. In the OMERO clients by convention
          we display the WellOrigin in the center of the view.
      WellOriginXUnit:
        range: UnitsLength
        description: The units of the well origin in X - default:reference frame.
        ifabsent: string(reference frame)
      WellOriginY:
        range: float
        description: This defines the Y position to use for the origin of the fields (individual images) taken in a well.
          It is used with the Y in the WellSample to display the fields in the correct position relative to each other. Each
          Well in the plate has the same well origin. Units are set by WellOriginYUnit. In the OMERO clients by convention
          we display the WellOrigin in the center of the view.
      WellOriginYUnit:
        range: UnitsLength
        description: The units of the well origin in Y - default:reference frame.
        ifabsent: string(reference frame)
      Rows:
        range: PositiveInt
        description: The number of rows in the plate
      Columns:
        range: PositiveInt
        description: The number of columns in the plate
      FieldIndex:
        range: NonNegativeInt
        description: The index of the WellSample to display as the default Field
    annotations:
      xsdfu_plural: Plates
  Folder:
    description: An element specifying a possibly heterogeneous collection of data. Folders may contain Folders so that data
      may be organized within a tree of Folders. Data may be in multiple Folders but a Folder may not be in more than one
      other Folder.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the folder. [plain-text multi-line string]
      Folder:
        inlined: false
        annotations:
          xsd_element: FolderRef
        multivalued: true
        description: The FolderRef element refers to a Folder by specifying the Folder ID attribute. One or more FolderRef
          elements may be listed within the Folder element to specify what Folders the Folder contains. This tree hierarchy
          must be acyclic.
        range: Folder
      Image:
        inlined: false
        annotations:
          xsd_element: ImageRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: The ImageRef element is a reference to an Image element.
        range: Image
      ROI:
        inlined: false
        annotations:
          xsd_element: ROIRef
          xsdfu_manytomany: 'true'
        multivalued: true
        range: ROI
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: FolderID
        required: true
        identifier: true
      Name:
        range: string
        description: A name for the folder that is suitable for presentation to the user.
    annotations:
      xsdfu_plural: Folders
  ROI:
    description: A four dimensional 'Region of Interest'. If they are not used, and the Image has more than one Plane, the
      entire set of Planes is assumed to be included in the ROI. Multiple ROIs may be specified.
    attributes:
      Union:
        range: ROIUnion
        inlined: true
        annotations:
          xsd_choice: ROI_choice_1
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the ROI. [plain-text multi-line string]
      ID:
        range: ROIID
        required: true
        identifier: true
      Name:
        range: string
        description: The Name identifies the ROI to the user. [plain-text string]
    annotations:
      xsdfu_plural: ROIs
  ROIUnion:
    attributes:
      Shape:
        range: Shape
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        annotations:
          xsd_element: ShapeGroup
  Experiment:
    description: This element describes the experiment during which this Image was acquired. The optional Description element
      may contain free text to further describe the experiment.
    attributes:
      Experimenter:
        inlined: false
        annotations:
          xsd_element: ExperimenterRef
          Domain: Experimental
          Category: SamplePreparation
          Tier: '1'
        multivalued: true
        required: true
        description: This empty element refers to the Scientist (i.e., Experimenter) that performed this experiment.
        range: Experimenter
      Sample:
        range: Sample
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This field captures a description of the sample that was imaged in this experiment.
      MicrobeamManipulation:
        range: MicrobeamManipulation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: Defines a microbeam operation and the region of the image it was applied to. The LightSourceSettingsRef
          element is a reference to the LightSourceSettings that were used in this case, including a reference to the light
          source that was used for this micromanipulation experiment (e.g....................... a laser used for photobleaching).
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: This element holds a free text multi-line optional description for this component.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: ExperimentID
        description: A unique identifier for this Experiment.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A user assigned name for this Experiment.
        annotations:
          Tier: '1'
      Purpose:
        range: ExperimentPurpose
        description: This field records a term used the general purpose of the imaging experiment performed in this case.
        required: true
        annotations:
          Tier: '1'
      LabellingMethod:
        range: string
        description: This field records a term that describes the method used for the Labelling or Visualization of the structures
          (i.e. molecular components) under study in this Experiment. The use of a sub-class of the 'Visualization Method'
          (http://purl.obolibrary.org/obo/FBbi_00000031) term from the Biological Imaging Methods Ontology (FBbi; https://www.ebi.ac.uk/ols/ontologies/fbbi)
          is recommended.
        required: true
        annotations:
          Tier: '1'
      LabellingMethodTermAccession:
        range: uri
        description: This field records the Accession ID for the term used to describe the Visualization Method (also often
          referred to as Labelling Method). The use of a sub-classes of 'Visualization Method' (http://purl.obolibrary.org/obo/FBbi_00000031)
          from the Biological Imaging Methods Ontology (FBbi; https://www.ebi.ac.uk/ols/ontologies/fbbi) is recommended.
        annotations:
          Tier: '1'
      Tag:
        range: string
        description: This field describes small molecules, peptides or full proteins that were used as label in this Experiment.
          The use of a sub-class of the 'Tag' (http://purl.obolibrary.org/obo/MI_0507) term from the Molecular Interactions
          Controlled Vocabulary (MI; http://purl.obolibrary.org/obo/mi.owl) is recommended.
        annotations:
          Tier: '1'
      TagTermAccession:
        range: uri
        description: This records the Accession ID for the term used to describe the Tag used in this Experiment. The use
          of a sub-class of http://purl.obolibrary.org/obo/MI_0507 is recommended.
        annotations:
          Tier: '1'
      HystochemistryType:
        range: HystochemistryType
        description: This field records a term that describes the general category of Histochemistry staining used in this
          case.
        annotations:
          Tier: '1'
    annotations:
      Extension: Core
      Domain: Experimental
      Category: SamplePreparation
      Tier: '1'
  Instrument:
    description: This element describes the Instrument used to capture the Image. It is primarily a container referring to
      the list of hardware components included in a given Microscope. The list consists of the Microscope Stand, Microscope
      Table, Light Source, Light Source Coupling, Sample Holder, Focusing, Objective, Filter, Dichroic, Additional Lens (including
      a commonly used Magnification Changer, also known as Optovar), Additional Mirroring Device, Polarization Optics, Prism,
      Optical Aperture, Optical Device, Detector and Calibration Tool. The Filter element can be either composed of separate
      Excitation, Emission filters, and Dichroic mirrors or a single Filter Set. An Instrument might have multiple Light Sources,
      Detectors, Objectives, and Filters, etc. Each of these has its own ID attribute, which can be referred to from the Image,
      Plane or more commonly Channel elements associated with a given Image Acquisition session. It is understood that the
      Light Path configuration can be different for each Channel, but cannot be different for each timepoint or each Plane
      of an XYZ stack.
    exact_mappings:
    - ome:Instrument
    mixins:
    - InstrumentExtension
    attributes:
      MicroscopeStand:
        range: MicroscopeStand
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element refers to the core structure of this Microscope, which might also be referred to as Body,
          Frame, or Platform.
        close_mappings:
        - ome:microscope
        annotations:
          xsd_element: MicroscopeStandGroup
      MicroscopeTable:
        range: MicroscopeTable
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the Table used to support this Instrument during Image Acquisition.
      Software:
        range: Software
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element represents a commercial, or open-source Software, script, macro, plugin or module utilized
          for any Image Acquisition or Quality Control task related to this Instrument.
        annotations:
          xsd_element: SoftwareGroup
      EnvironmentalControlDevice:
        range: EnvironmentalControlDevice
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes an Environmental Control Device available for this Instrument to maintain a controlled
          Imaging Environment during Imaging Environment.
      LightSource:
        range: LightSource
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element describes the light source(s) available in this microscope
        exact_mappings:
        - ome:light_sources
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: LightSource
          Tier: '1'
          xsd_element: LightSourceGroup
      LightSourceCoupling:
        range: LightSourceCoupling
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the method(s) used to couple the light source with the light path moving through
          speciment to the detector
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: LightSourceCoupling
          Tier: '2'
          xsd_element: LightSourceCouplingGroup
      Objective:
        range: Objective
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: The Microscope's Objective lens consists of a lens, its mount, and any associated parts. It is the part
          of the imaging system, which forms a primary image of the object, either alone or in conjunction with a tube lens.
          The Objective typically consists of a compound lens consisting of along a common axis.
        exact_mappings:
        - ome:objectives
      OpticalAssembly:
        range: OpticalAssembly
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This is a device that might include one or more Lenses, other Optics and Optics Holders. Optical Devices
          might be custom built or they might also be available as pre-assembled units. Such devices might be embedded within
          the Microscope Stand or exist as independent units. Examples include the Condenser and the Microscope Tube.
        annotations:
          xsd_element: OpticalAssemblyGroup
      OpticalAperture:
        range: OpticalAperture
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents any mechanical, non optical device that is placed in the Light Path and spatially
          modifies the light beam. Examples include, Pin Holes, Phase Rings, Dark Field Stops, Hoffman Modulators, Diffraction
          Gratings etc. This element can be associated with an optional Optics Turret.
        annotations:
          xsd_element: OpticalApertureGroup
      StageInsert:
        range: StageInsert
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes an optional Stage Insert mounted on the Stage.
      SamplePositioning:
        range: SamplePositioning
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the objective lens and stage positioning device(s) available in this microscope.
          An Instrument may have more than one of these devices. The type of Focusing Device is specified by one of the child-element
          which are 'MechanicalStage', 'PiezoElectricSate', or 'PiezoElectricObjective'
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: SamplePositioning
          Tier: '2'
          xsd_element: SamplePositioningGroup
      FocusStabilizationDevice:
        range: FocusStabilizationDevice
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the focus stabilization device(s) available for this microscope
        annotations:
          Extension: Basic
          Domain: MicroscopeHardwareSpecifications
          Category: SamplePositioning.Focusing
          Tier: '2'
      OpticsHolder:
        range: OpticsHolder
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a Holder for Filters, Dichroic and other Optical Element that is associated with
          this Instrument. These Holders come in different arrangements such as Cubes, Sliders, Turrets, and Wheels. While
          some of these Holders, such as Filter Cubes, might be pre-assebled by the Manufacturer and pruchased as a whole,
          in the majority of cases they are assembled on site depending on the needs of the user.
        annotations:
          xsd_element: OpticsHolderGroup
      Filter:
        range: Filter
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: 'This element describes an optical Filter positioned in the Light Path for one or more Channels available
          for this Instrument. An optical Filter is a device designed to selectively control the Wavelengths, color temperature,
          vibration direction, and/or intensity of the radiation which it transmits or reflects. An Instrument may have several
          Filters of different types, such as an Excitation, Emission, Neutral Density or an additional Generic Filter positioned
          in the Light Path for different purposes. For each fluorescence Image there should be at least one Filter element
          specified per Channel. This element can be associated with an optional Optics Holder, such as a Filter Cube, Filter
          Turret, Filtr Wheel, or Filter Slider. Note: Filter Holder is not the same as a Filter Set.'
        exact_mappings:
        - ome:filters
        annotations:
          xsd_element: FilterGroup
      MirroringDevice:
        range: MirroringDevice
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element describes mirror component(s) available in this microscope
        close_mappings:
        - ome:dichroics
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Tier: '1'
          xsd_element: MirroringDeviceGroup
      Lens:
        range: Lens
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes additional lenses positioned in the Light Path for one or more Channels available
          for this Instrument. A Lens is a component of glass or transparent plastic material, usually circular, with two
          primary surfaces that are ground and polished in a specific manner designed to produce either a convergence or divergence
          of light passing through the material. An Instrument may have several Lenses with different functions, such as a
          Magnification Changer (also known as Optovar), a Coupling Lens connecting the Light Source with the Microscope Stand,
          a Relay Lens positioned at the Detector mount, or additional Lenses placed in the Light Path for various purposes.
          This element can be associated with an optional Optics Turret.
        annotations:
          xsd_element: LensGroup
      Prism:
        range: Prism
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a Prism positioned in the Light Path for one or more Channels available for this
          Instrument. A Prism is a block of glass or other transparent material with at least two intersecting flat, polished
          surfaces, used to disperse light or deviate it through an angle. A Prism can be viewed as an ensemble of different
          rigidly mounted Mirrors, with each face having a permanent orientation with respect to others. A Prism can be employed
          to deflect or deviate a light beam, rotate or invert an Image, separate polarization states, or disperse light into
          its component Wavelengths. An Instrument may have several Prisms with different functionality such as Polarizing,
          Reflecting, or Refracting (or Dispersing). Polarizing Prisms are birefringent crystals that divide incident non-polarized
          light into separate components polarized orthogonally to each other. Reflecting Prisms are useful for redirecting
          light beams by total internal reflection. Refracting (or Dispersing) Prisms can be employed to bend and separate
          light into its component colors. This element can be associated with an optional Optics Turret.
      PolarizationOptics:
        range: PolarizationOptics
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a Polarization device positioned in the Ligth Path for this Instrument. A Polarization
          device is an optical filter rotatable through 360° that lets light waves of a specific polarization pass through
          while blocking light waves of other polarizations. This element can be associated with an optional Optics Turret.
      Detector:
        range: Detector
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element describes a Detector available for this Instrument. An Instrument may have more than one
          Detector of different types, such as a Photomultiplier, or a Camera. The Detector ID can be used as a reference
          within the Channel element. The values stored in Detector represent the fixed values, variable values modified during
          the Acquisition go in DetectorSettings.
        exact_mappings:
        - ome:detectors
        annotations:
          xsd_element: DetectorGroup
      TIRFHardwareModule:
        range: TIRFHardwareModule
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: Total Internal Reflection Fluorescence (TIRF) microscopy is a modality in which fluorescence is excited
          in a thin layer by an evanescent wave produced by total internal reflection. This element describes a Hardware Module
          that is used to achieve TIRF microscopy.
      ConfocalScanner:
        range: ConfocalScanner
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: According to ISO-10934-2-2007, a confocal microscope is a microscope in which, ideally, a point in the
          object plane is illuminated by a diffraction-limited spot of light, and light emanating from this point is focused
          upon and detected from an area smaller than the central area of the diffraction disc. The confocal principle leads
          to improved axial resolution by suppression of light from out-of-focus planes. In order to utilize this modality,
          a Confocal Scanner is used to form an Image of an extended Specimen region by controlling the direction of an outgoing
          Laser beam, the position of the Specimen or the location of the illuminated and detected spots simultaneously. Refer
          to https://www.iso.org/standard/69820.html for further details and measurement methods.
        annotations:
          xsd_element: ConfocalScannerGroup
      AcoustoOpticalDevice:
        range: AcoustoOpticalDevice
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This is a device that performs spatial, temporal, and spectral modulations of light on the basis of acousto-optic
          (AO) diffraction. AO diffraction is a phenomenon whereby an acoustic wave propagating in an optically transparent
          medium, produces a periodic modulation of the index of refraction of the medium via the elasto-optical effect and
          might therefore diffract portions of an incident light into one or more directions.
        annotations:
          xsd_element: AcoustoOpticalDeviceGroup
      ElectroOpticalDevice:
        range: ElectroOpticalDevice
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This is is a device which can be used for controlling the power (→ intensity modulators), phase (→ phase
          modulators) or polarization of light with an electrical control signal. It typically contains one or two Pockels
          cells, and possibly additional optical elements such as polarizers.
        annotations:
          xsd_element: ElectroOpticalDeviceGroup
      MicrolensArray:
        range: MicrolensArray
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: Micro-lens arrays contain multiple micro-lenses forming a one- or two-dimensional array on a supporting
          substrate.
      IntensityCalibrationTool:
        range: IntensityCalibrationTool
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A tool, such as the Meta-Max calibration toold developed by the 4D Nucleome Imaging Standards Working
          Group, used to perform an intensity calibration procedure.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
          xsdfu_manytomany: 'true'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: InstrumentID
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        required: true
        annotations:
          Tier: '1'
      CustomProperties:
        description: Source metadata values the model does not model, kept so no metadata is lost.
        range: Property
        multivalued: true
        inlined_as_list: true
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: MicroscopyEssentials
      Tier: '1'
      xsdfu_plural: Instruments
  Image:
    description: This element describes the actual Image that was acquired and its meta-data. The elements that are references
      (ending in Ref or Settings) refer to elements defined outside of the Image element. Ref elements are simple links, while
      Settings elements are links with additional values. If any of the required Image attributes or elements are missing,
      its guaranteed to be an invalid document.
    mixins:
    - ImageExtension
    attributes:
      Instrument:
        inlined: false
        annotations:
          xsd_element: InstrumentRef
        required: true
        description: This empty element refers to the Instrument that was utilized to acquire this Image.
        range: Instrument
      Experiment:
        inlined: false
        annotations:
          xsd_element: ExperimentRef
          Tier: '1'
        required: true
        description: This empty element refers to the Experiment during which this Image was acquired.
        range: Experiment
      Experimenter:
        inlined: false
        annotations:
          xsd_element: ExperimenterRef
        multivalued: true
        description: This empty element refers to Experimenter that performed this experiment.
        range: Experimenter
      Sample:
        inlined: false
        annotations:
          xsd_element: SampleRef
          Tier: '1'
        multivalued: true
        required: true
        description: This empty element refers to the Sample that was imaged in this Image Acquisition.
        range: Software
      ExperimenterGroup:
        inlined: false
        annotations:
          xsd_element: ExperimenterGroupRef
        multivalued: true
        description: This empty element refers to the ExperimenterGroup that owns this Image.
        range: ExperimenterGroup
      ROI:
        inlined: false
        annotations:
          xsd_element: ROIRef
          Tier: '2'
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This empty element refers to any predefined four dimensional ROI (Region of Interest) that is associated
          with this Image.
        range: ROI
      StageInsert:
        inlined: false
        annotations:
          xsd_element: StageInsertRef
        multivalued: true
        description: This empty element refers to the optional Stage Insert device that was used for the Acquisition of this
          Image.
        range: StageInsert
      FocusStabilizationDevice:
        inlined: false
        annotations:
          xsd_element: FocusStabilizationDeviceRef
          Tier: '1'
        multivalued: true
        description: This empty element refers to the optional Focus Stabilization device that was used for the Acquisition
          of this Image.
        range: FocusStabilizationDevice
      AcquisitionSoftware:
        inlined: false
        annotations:
          xsd_element: AcquisitionSoftwareRef
        multivalued: true
        required: true
        description: This empty element refers to the Software that was used to drive the Microscope during the Image Acquisition.
        range: Software
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: This element holds a free text multi-line optional description for this component.
      ImagingEnvironment:
        range: ImagingEnvironment
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the environment in which the biological sample was maintained during the Acquisition
          of this Image.
      MicroscopeStandSettings:
        range: MicroscopeStandSettings
        inlined: true
        required: true
        description: This element refers to the Microscope Stand used to acquire this Image and it holds the Settings that
          were applied to the Microscope Stand during this Acquisition.
      MicroscopeTableSettings:
        range: MicroscopeTableSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element refers to the MicroscopeTable used to support the Microscope used to acquire this Image
          and holds the settings that were applied to the Microscope during this Acquisition.
      ObjectiveSettings:
        range: ObjectiveSettings
        inlined: true
        required: true
        description: This element holds the Setting applied to the Objective used during the Acquisition of this Image as
          well as a reference (the ID attribute) to the Objective in question.
      StageLabel:
        range: StageLabel
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: The StageLabel is used to specify the Name and Position for a Stage position in the Microscope's reference
          frame.
      SamplePositioningSettings:
        range: SamplePositioningSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element holds the Setting applied to a Sample Positioning Device used  during the Acquisiton of
          this experimental Image as well as a reference (the ID attribute) to the Sample Positioning Device in question.
      OpticalCalibration:
        range: OpticalCalibration
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This describes the procedure that was used for Optical Calibration and the resulting Calibration measurements.
      DetectorCalibration:
        range: DetectorCalibration
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a procedure used to measures the performance of the Dectector used to to Acquire
          this experimental Image.
      Pixels:
        range: Pixels
        inlined: true
        required: true
        description: The Pixels element is going to be removed in the future, but it is still required. This is just notice
          that the contents of Pixels will be moved up to Image in a future release. This is because there has only been 1
          Pixels object in each Image for some time. The concept of multiple Pixels sets for one Image failed to take off.
          It is therefore redundant. The Image will be unreadable if any of the required Pixel attributes are missing. The
          Pixels themselves can be stored within the OME-XML compressed by Plane, and encoded in Base64. Or the Pixels may
          be stored in TIFF format. The Pixels element should contain a list of BinData or TiffData, each containing a single
          Plane of pixels. These Pixels elements, when read in document order, must produce a 5-D Pixel array of the size
          specified in this element, and in the dimension order specified by 'DimensionOrder'. All of the values in the Pixels
          object when present should match the same value stored in any associated TIFF format (e.g. SizeX should be the same).
          Where there is a mismatch our readers will take the value from the TIFF structure as overriding the value in the
          OME-XML. This is simply a pragmatic decision as it increases the likelihood of reading data from a slightly incorrect
          file.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '2'
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: ImageID
        description: A unique identifier for this Image.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A user assigned name for this Image.
        required: true
        annotations:
          Tier: '1'
      AcquisitionDate:
        range: datetime
        description: The Date in which this Image was Acquired.
        annotations:
          Tier: '1'
          range_source: 'OME 2016-06 ome.xsd (xsd:dateTime): the sources give date and time (user)'
          xsd_range: date
      CustomProperties:
        description: Source metadata values the model does not model, kept so no metadata is lost.
        range: Property
        multivalued: true
        inlined_as_list: true
      SourceFile:
        description: The files this Image's metadata was read from.
        range: SourceFile
        multivalued: true
        inlined_as_list: true
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Image
      Tier: '1'
      xsdfu_plural: Images
  Pixels:
    description: The Pixels element is going to be removed in the future, but it is still required. This is just notice that
      the contents of Pixels will be moved up to Image in a future release. This is because there has only been 1 Pixels object
      in each Image for some time. The concept of multiple Pixels sets for one Image failed to take off. It is therefore redundant.
      The Image will be unreadable if any of the required Pixel attributes are missing. The Pixels themselves can be stored
      within the OME-XML compressed by Plane, and encoded in Base64. Or the Pixels may be stored in TIFF format. The Pixels
      element should contain a list of BinData or TiffData, each containing a single Plane of pixels. These Pixels elements,
      when read in document order, must produce a 5-D Pixel array of the size specified in this element, and in the dimension
      order specified by 'DimensionOrder'. All of the values in the Pixels object when present should match the same value
      stored in any associated TIFF format (e.g. SizeX should be the same). Where there is a mismatch our readers will take
      the value from the TIFF structure as overriding the value in the OME-XML. This is simply a pragmatic decision as it
      increases the likelihood of reading data from a slightly incorrect file.
    mixins:
    - PixelsExtension
    attributes:
      Plane:
        range: Plane
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: Each Image has to have at least one Plane and one Channel. The Plane element holds the Microscope stage
          and Image timing data for a given Channel/z-section/timepoint. The total number of Plane elements for a given Image
          must equal to SizeZ x SizeC x SizeT.
      Channel:
        range: Channel
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: Each Image has to have at least one Plane and one Channel. The Channel element stores information about
          how the each Image Channel was acquired. The total number of Channel elements for a given Image must equal to SizeC.
      AdditionalDimensionMap:
        range: AdditionalDimensionMap
        inlined: true
        required: true
        description: This map defines any additional dimension beyond the canonical 5 dimensions XYZCT. It contains a number
          of elements for each Plane of data referring to this Additional Dimension.
      BinData:
        range: BinData
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: The contents of this element are base64-encoded. These are not CDATA sections, just a base64 stream.
        annotations:
          xsd_choice: Pixels_choice_4
      MetadataOnly:
        range: MetadataOnly
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This place holder means there is no pixel data in this file.
        annotations:
          xsd_choice: Pixels_choice_4
      NGFFData:
        range: NGFFData
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the location of the pixel data in a NGFF storage set.
        annotations:
          xsd_choice: Pixels_choice_4
      TiffData:
        range: TiffData
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This field describes the location of the pixel data in a tiff file.
        annotations:
          xsd_choice: Pixels_choice_4
      ID:
        range: PixelsID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      DimensionOrder:
        range: PixelsDimensionOrder
        description: This field records the order in which the individual Planes of data are interleaved in the Image.
        required: true
        annotations:
          Tier: '1'
      SizeX:
        range: PositiveInt
        description: This field records the X size of the Pixel data array.
        required: true
        annotations:
          Tier: '1'
      SizeY:
        range: PositiveInt
        description: This field records the Y size of the Pixel data array.
        required: true
        annotations:
          Tier: '1'
      SizeZ:
        range: PositiveInt
        description: This field records the number of Z-Planes acquired for this Image.
        required: true
        annotations:
          Tier: '1'
      SizeC:
        range: PositiveInt
        description: This field records the number of Channels used in this Image
        required: true
        annotations:
          Tier: '1'
      SizeT:
        range: PositiveInt
        description: This field records the number of Timepoints (often referred to as Frames) used in this Image.
        required: true
        annotations:
          Tier: '1'
      PhysicalSizeX:
        range: PositiveFloat
        description: This field records the real world Physical Width represented by a Pixel in this Image. This measure is
          often referred to as X Pixel Size.
        required: true
        annotations:
          Tier: '1'
      PhysicalSizeXUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '1'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the physical size of a pixel - default:microns[µm].
      PhysicalSizeY:
        range: PositiveFloat
        description: This field records the real world Physical Height represented by a Pixel in this Image. This measure
          is often referred to as Y Pixel Size.
        required: true
        annotations:
          Tier: '1'
      PhysicalSizeYUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '1'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the physical size of a pixel - default:microns[µm].
      PhysicalSizeZ:
        range: PositiveFloat
        description: This field records the real world Physical distance between the individual Z-Planes recorded for this
          Image. This measure is sometimes referred to as Z Pixel or Voxel Size.
        annotations:
          Tier: '1'
      PhysicalSizeZUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '1'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the physical size of a pixel - default:microns[µm].
      TimeIncrement:
        range: PositiveFloat
        description: In cases in which a time series is acquired with a global timing specification setting, this field describes
          the time between each sequential plane (or frame) in the series (i.e., from the start of time point 1 to the start
          of time point 2). Examples include, a video stream or a multi-dimensional Acquisition routine. Note that, this field
          is not intended to substitute the Timestamp attribute recorded in Plane. Also note that in case this field is not
          relevant e.g. a time lapse Acquisition with irregular increments, the value -1 should be used to indicate that only
          the Timestamps (in the Plane element) are valid.
        annotations:
          Tier: '1'
      TimeIncrementUnit:
        range: UnitsTime
        ifabsent: string(s)
        annotations:
          Tier: '1'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the TimeIncrement - default:seconds[s].
      PixelType:
        range: PixelType
        description: This field records the data type used to represent the Pixel Intensity in the Image.
        required: true
        annotations:
          Tier: '2'
      Interleaved:
        range: boolean
        description: 'This field records the order in which the Channels are arranged within the data block: True if Channels
          are stored RGBRGBRGB...; False if Channels are stored RRR...GGG...BBB…'
        annotations:
          Tier: '2'
      SignificantBits:
        range: PositiveInt
        description: This field records the number of bits within the type storing each Pixel value that are significant.
          e.g.,. you can store 12-bit data within a 16-bit type. This does not reduce the storage requirements but can be
          a useful indicator when processing or viewing the Image data.
        annotations:
          Tier: '3'
      BigEndian:
        range: boolean
        description: This field is True if the pixels data was written in BigEndian order. If this value is present, it should
          match the value used in BinData or TiffData. If it is not, a reader should be used that honors the value used in
          the BinData or TiffData. This value is useful for MetadataOnly files and is to allow for future storage solutions.
        annotations:
          Tier: '3'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Image
      Tier: '1'
      xsdfu_plural: Pixels
  Plane:
    description: Each Image has to have at least one Plane and one Channel. The Plane element holds the Microscope stage and
      Image timing data for a given Channel/z-section/timepoint. The total number of Plane elements for a given Image must
      equal to SizeZ x SizeC x SizeT.
    attributes:
      HashSHA1:
        range: Hex40
        description: This optional element is a hash of the Plane's Image data. It is a choice between all the supported hash
          types. Currently the only method supported is SHA1
        annotations:
          Tier: '3'
          xsd_choice: Plane_choice_1
      MechanicalCalibration:
        range: MechanicalCalibration
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This describes the procedures that were used for mechanical calibration and the resulting calibration
          results.
      TheAdditionalDimension:
        inlined: false
        annotations:
          xsd_element: TheAdditionalDimensionRef
        multivalued: true
        description: This empty element refers to the Additional Dimension Element to which this Plane (or Chunk of Image
          data) corresponds.
        range: TheAdditionalDimension
      PlaneTransformationMatrix:
        range: PlaneTransformationMatrix
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: 'This element describes a 4x4 matrix relating the position of this Plane typically with respect to other
          Planes within this Image or collection of Images (or alternatively to the Microscope''s reference frame). This can
          correct for translations, rotations, scale differences, or other affine distortions between Planes from the same
          set or between Image Datasets. An example is when multiple cameras are used for e.g. to acquire different Channels
          for the same Image. See: https://www.openmicroscopy.org/community/viewtopic.php?p=17433.'
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        multivalued: true
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: PlaneID
        description: A unique identifier for this Plane.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      TheZ:
        range: NonNegativeInt
        description: This field records the Z-section to which this Plane corresponds. This is numbered from 0.
        required: true
        annotations:
          Tier: '1'
      TheT:
        range: NonNegativeInt
        description: This field records th Timepoint to which this Plane corresponds. This is numbered from 0.
        required: true
        annotations:
          Tier: '1'
      TheC:
        range: NonNegativeInt
        description: This field records th Channel to which this Plane corresponds. This is numbered from 0.
        required: true
        annotations:
          Tier: '1'
      Timestamp:
        range: float
        description: This field records the time at which this Plane was acquired as recorded from the beginning of Image
          Acquisition.
        required: true
        annotations:
          Tier: '1'
      TimestampUnit:
        range: UnitsTime
        ifabsent: string(s)
        annotations:
          Tier: '1'
          description_source: derived from Plane.Timestamp
        description: The unit of Timestamp.
      ExposureTime:
        range: float
        description: This field records the duration of the Exposure utilized to acquire this Plane.
        annotations:
          Tier: '1'
      ExposureTimeUnit:
        range: UnitsTime
        ifabsent: string(ms)
        annotations:
          Tier: '1'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the ExposureTime - default:seconds[s].
      PixelDwellTime:
        range: float
        description: This value typically refers to the settings applied to the Confocal Scanner during Acquisition, and it
          assumes that Pixel Dwell Time was set uniformly throughout the Plane. The Pixel Dwell Time represents the time this
          Confocal Scanner was set to dwell upon each pixel during the acquisition of this Plane (e.g. 1.58 µsec/pixel). The
          higher the Pixel Dwell Time the slower is the scan speed, the higher the sensitivity but also the potential photobleaching.
        annotations:
          Tier: '1'
      PixelDwellTimeUnit:
        range: UnitsTime
        annotations:
          Tier: '1'
          description_source: derived from Plane.PixelDwellTime
        description: The unit of PixelDwellTime.
      PositionX:
        range: float
        description: This field records the X position of the Plane within the Microscope's reference frame. This value can
          typically be obtained by recording the Sample Positioning Device and Stage Insert coordinates.
        annotations:
          Tier: '2'
      PositionXUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the X stage position - default:[reference frame].
      PositionY:
        range: float
        description: This field records the Y position of the Plane within the Microscope's reference frame. This value can
          typically be obtained by recording the Sample Positioning Device and Stage Insert coordinates.
        annotations:
          Tier: '2'
      PositionYUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the Y stage position - default:[reference frame].
      PositionZ:
        range: float
        description: This field records the Z position of the Plane within the Microscope's reference frame. This value can
          typically be obtained by recording the Sample Positioning Device and Stage Insert coordinates.
        annotations:
          Tier: '2'
      PositionZUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the Z stage position - default:[reference frame].
      PlaneXOffset:
        range: float
        description: This field records the X offset (expressed in Pixels) that specifies the position of this Plane's center
          with respect to the center of the full frame.
        annotations:
          Tier: '3'
      PlaneYOffset:
        range: float
        description: This field records the Y offset (expressed in Pixels) that specifies the position of this Plane's center
          with respect to the center of the full frame.
        annotations:
          Tier: '3'
      PlaneZOffset:
        range: float
        description: This field describes the Z-offset imposed by the Focal Positioning device.
        annotations:
          Tier: '3'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Image
      Tier: '1'
      xsdfu_plural: Planes
  Channel:
    description: Each Image has to have at least one Plane and one Channel. The Channel element stores information about how
      the each Image Channel was acquired. The total number of Channel elements for a given Image must equal to SizeC.
    attributes:
      Fluorophore:
        range: Fluorophore
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element describes the Fluorophore whose Emission is used to produce this Channel. [plain text string].
      LightPath:
        range: LightPath
        inlined: true
        required: true
        description: This element holds a description of the Light Path associated with the Acquisition of this Channel.
      ExcitationCalibration:
        range: ExcitationCalibration
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the procedure used to measure and calibrate the Wavelength and Irradiance of the
          Excitation Light Source used to Acquire this experimental Image and the resulting calibration measurements.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: ChannelID
        description: A unique identifier for this Channel.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A Name for this Channel that is suitable for presentation to the user.
        required: true
        annotations:
          Tier: '1'
      IlluminationType:
        range: ImagingMethodList
        description: This field describes the Light Microscopy Illumination method performed in this case. Allowable terms
          were obtained from the Biological Imaging Methods Ontology (Fbbi; https://www.ebi.ac.uk/ols/ontologies/fbbi) Light
          Microscopy term (http://purl.obolibrary.org/obo/FBbi_00000345).
        required: true
        annotations:
          Tier: '1'
      IlluminationTypeTermAcession:
        range: uri
        description: This field records the Accession ID for the term used to describe the Illumination Type. A sub-classes
          of Light Microscopy term (http://purl.obolibrary.org/obo/FBbi_00000345) is recommended.
        annotations:
          Tier: '1'
      ContrastMethod:
        range: ChannelContrastMethod
        description: This field describes the technique used to achieve contrast for this Channel.
        required: true
        annotations:
          Tier: '1'
      Color:
        range: Color
        description: 'This field records the Color used to render this Channel - encoded as RGBA. The default value is -1
          corresponding #FFFFFFFF, so solid white (it is a signed 32 bit value).'
        ifabsent: string(-1)
        annotations:
          Tier: '1'
      SamplesPerPixel:
        range: PositiveInt
        description: This field is prevalently used for RGB Images and records the number of samples the detector takes to
          form each pixel value. [units:none]
        annotations:
          Tier: '3'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Image
      Tier: '1'
      xsdfu_plural: Channels
  BinData:
    description: The contents of this element are base64-encoded. These are not CDATA sections, just a base64 stream.
    attributes:
      Value:
        range: base64Binary
        annotations:
          xsd_text_content: true
      Compression:
        range: BinDataCompression
        description: Specifies the compression scheme used to encode the data.
        ifabsent: string(none)
      BigEndian:
        range: boolean
        description: This is true if the binary data was written in BigEndian order. This is dependent on the system architecture
          of the machine that wrote the pixels. True for essentially all modern CPUs other than Intel and Alpha. All Binary
          data must be written in the same endian order.
        required: true
      Length:
        range: NonNegativeLong
        description: Character count attribute for the BinData field. This is the length of the base-64 encoded block. It
          allows easy skipping of the block when parsing the file. [unit:bytes]
        required: true
    annotations:
      Extension: Core
      Domain: ImageAcquistionSettings
      Category: Data
      Tier: '1'
      xsdfu_plural: BinDataBlocks
  MetadataOnly:
    description: This place holder means there is no pixel data in this file.
    annotations:
      Extension: Core
      Domain: ImageAcquistionSettings
      Category: Data
      Tier: '1'
      xsdfu_plural: MetadataOnlyMarkers
  TiffData:
    description: This field describes the location of the pixel data in a tiff file.
    attributes:
      UUID:
        range: TiffDataUUID
        inlined: true
        description: 'This must be used when the IFDs are located in another file. Note: It is permissible for this to be
          self referential.'
      IFD:
        range: NonNegativeInt
        description: Gives the IFD(s) for which this element is applicable. Indexed from 0. Default is 0 (the first IFD).
          [units:none]
        ifabsent: string(0)
      FirstZ:
        range: NonNegativeInt
        description: Gives the Z position of the Image Plane at the specified IFD. Indexed from 0. Default is 0 (the first
          Z position). [units:none]
        ifabsent: string(0)
      FirstT:
        range: NonNegativeInt
        description: Gives the T position of the Image Plane at the specified IFD. Indexed from 0. Default is 0 (the first
          T position). [units:none]
        ifabsent: string(0)
      FirstC:
        range: NonNegativeInt
        description: Gives the C position of the Image Plane at the specified IFD. Indexed from 0. Default is 0 (the first
          C position). [units:none]
        ifabsent: string(0)
      PlaneCount:
        range: NonNegativeInt
        description: Gives the number of IFDs affected. Dimension order of IFDs is given by the enclosing Pixels element's
          DimensionOrder attribute. Default is the number of IFDs in the TIFF file, unless an IFD is specified, in which case
          the default is 1. [units:none]
    annotations:
      Extension: Core
      Domain: ImageAcquistionSettings
      Category: Data
      Tier: '1'
      xsdfu_plural: TiffDataBlocks
  TiffDataUUID:
    description: 'This must be used when the IFDs are located in another file. Note: It is permissible for this to be self
      referential.'
    attributes:
      Value:
        range: UniversallyUniqueIdentifier
        annotations:
          xsd_text_content: true
      FileName:
        range: string
        description: 'This can be used when the IFDs are located in another file. The / (forward slash) is used as the path
          separator. A relative path is recommended. However an absolute path can be specified. Default is to use the file
          the ome-xml data has been pulled from. Note: It is permissible for this to be self referential. The file image1.tiff
          may contain ome-xml data that has FilePath="image1.tiff" or "./image1.tiff"'
  Rights:
    description: The rights holder of this data and the rights held.
    attributes:
      RightsHolder:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: The rights holder for this data. [plain-text multi-line string] e.g..... "Copyright (C) 2002 - 2016 Open
          Microscopy Environment"
      RightsHeld:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: The rights held by the rights holder. [plain-text multi-line string] e.g..... "All rights reserved" or
          "Creative Commons Attribution 3.0 Unported License"
    annotations:
      xsdfu_plural: Rights
  InvertedMicroscopeStand:
    description: This is a Microscope in which the object is observed from beneath the stage.
    is_a: MicroscopeStand
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: MicroscopeStand
      Tier: '1'
      Model_Settings: MicroscopeStandSettings
      xsdfu_plural: InvertedMicroscopeStands
  UprightMicroscopeStand:
    description: This is a Microscope in which the object is observed from above the stage.
    is_a: MicroscopeStand
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: MicroscopeStand
      Tier: '1'
      Model_Settings: MicroscopeStandSettings
      xsdfu_plural: UprightMicroscopeStands
  Arc:
    description: An Arc lamp is a discharge lamp that produces light by an electric arc (also called a voltaic arc), which
      is typically generated between metal electrodes and travels through an inert gas in a glass bulb. The inert gas can
      be Mercury (He), Xenon (Xe), or a mixture of the two. The choice of the gas is important because its nature determines
      the spectral behavior of the lamp. Refer to Type for more informations about this aspect.
    exact_mappings:
    - ome:ArcLightSource
    is_a: LightSource
    attributes:
      IlluminationWavelengthRange:
        range: IlluminationWavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a range of Wavelengths at which this Light Source emits, according to the Manufacturer.
          Multiple of this element may be used.
      Type:
        range: ArcType
        description: This field records the inert gas vapor contained in the Arc lamp bulb. The nature of the gas determines
          the spectral behavior of the lamp. At low pressure, Hg lamps emit a characteristic line spectrum, which becomes
          more uniform as the lamp heats up. On the other hand, Xe lamps emit light of high luminance, high color temperature,
          and an almost continuous spectrum distributed from the ultraviolet to the infrared.
        exact_mappings:
        - ome:type
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: LightSource
      Tier: '1'
      Split: '[Fluorescence_LightSource]'
      Model_Settings: LightSourceSettings
      xsdfu_plural: Arcs
    slot_usage:
      Role:
        range: FluorescenceLightSourceRole
  GenericExcitationSource:
    description: The GenericExcitationSource element is used to represent a light source as a collection of key/value pairs,
      stored in a Map. One of the other light source elements should always be used in preference to this if possible.
    exact_mappings:
    - ome:GenericExcitationSource
    is_a: LightSource
    attributes:
      IlluminationWavelengthRange:
        range: IlluminationWavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a range of Wavelengths at which this Light Source emits, according to the Manufacturer.
          Multiple of this element may be used.
      Map:
        range: Map
        inlined: true
        description: This is a Mapping of key/value pairs used to store customized metadata that describes this element.
        exact_mappings:
        - ome:map
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: ChildElement
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: LightSource
      Tier: '1'
      Split: '[Transmitted_LightSource; Fluorescence_LightSource]'
      Model_Settings: LightSourceSettings
      xsdfu_plural: GenericExcitationSources
  Filament:
    description: A Filament lamp is an incandescent Light Source with a wire filament (usually tungsten), which is heated
      by the passage of an electric current to such a high temperature that it glows with visible light (incandescence). The
      emitted spectrum is continuous, and it approximates that of a black-body radiator.
    exact_mappings:
    - ome:FilamentLightSource
    is_a: LightSource
    attributes:
      IlluminationWavelengthRange:
        range: IlluminationWavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a range of Wavelengths at which this Light Source emits, according to the Manufacturer.
          Multiple of this element may be used.
      Type:
        range: FilamentType
        description: This field records the type of Filament lamp Light Source. A Halogen lamp is a Filament lamp whose envelope
          contains halogen vapor, which reduces the loss of tungsten from the filament. This, in turn, allows to reach a high
          filament temperature and consequent higher luminance, higher color temperature, and longer operating life than a
          Standard Filament lamp of the same input power.
        exact_mappings:
        - ome:type
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: LightSource
      Tier: '1'
      Split: '[Transmitted_LightSource; Fluorescence_LightSource]'
      Model_Settings: LightSourceSettings
      xsdfu_plural: Filaments
  Laser:
    description: This element describes a Light Source, which emits coherent radiation at high spectral concentrations of
      radiance and minimal solid angles. This includes proper Light Amplification by Stimulated Emission of Radiation (LASER)
      sources that emit light through a process of optical amplification based on the stimulated emission of electromagnetic
      radiation. It also includes Optical Parametric Oscillator (OPO) sources that use a kind of LASER resonator but based
      on optical gain from parametric amplification in a nonlinear crystal rather than from stimulated emission.
    exact_mappings:
    - ome:LaserLightSource
    is_a: LightSource
    attributes:
      IlluminationWavelengthRange:
        range: IlluminationWavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a range of Wavelengths at which this Light Source emits, according to the Manufacturer.
          Multiple of this element may be used.
      AcoustoOpticalDevice:
        inlined: false
        annotations:
          xsd_element: AcoustoOpticalDeviceRef
        multivalued: true
        description: This empty element refers to an Acousto-Optical Device component used to modulate the Power of this Laser.
        range: AcoustoOpticalDevice
      Pump:
        inlined: false
        annotations:
          xsd_element: Pump
        description: In case the primary Laser is Pumped, this element describe a secondary Laser, positioned upstream of
          the primary Laser and used to pump it.
        exact_mappings:
        - ome:pump
        range: Laser
      Type:
        range: LaserType
        description: This field captures the general category of this Laser. Please note that Optical Parametric Oscillators
          (OPO) are listed here even though they are technically not a LASER. They produce optical gain not through stimulated
          emission but via parametric amplification in a non-linear crystal.
        exact_mappings:
        - ome:type
        annotations:
          Tier: '1'
      Tuneable:
        range: boolean
        description: This field records whether (True) or not (False) this Laser is Tunable to different Wavelengths
        exact_mappings:
        - ome:tuneable
        required: true
        annotations:
          Tier: '1'
      ModulationMechanism:
        range: LaserModulation
        description: This field captures the Modulation Mechanism used for this Laser.
        required: true
        annotations:
          Tier: '1'
      Pulse:
        range: boolean
        description: Whether this Laser emits light in the form of optical Pulses (i.e., light flashes; True) or as a Continuous
          Wave (CW; False).
        exact_mappings:
        - ome:pulse
        required: true
        annotations:
          Tier: '1'
      LaserClass:
        range: LaserClass
        description: This describes the safety Class this Laser belongs to. Laser Classes are defined based on their potential
          for causing injury to humans’ eyes and skin.
        annotations:
          Tier: '2'
      LaserMedium:
        range: LaserMedium
        description: This field captures the material out of which this Laser is constructed.
        exact_mappings:
        - ome:medium
        annotations:
          Tier: '3'
      IsPumped:
        range: boolean
        description: Whether (True) or not (False) this is a pumped Laser.
        required: true
        annotations:
          Tier: '2'
      IsPump:
        range: boolean
        description: Whether (True) or not (False) this laser serves as a Pump for a downstream laser.
        required: true
        annotations:
          Tier: '2'
      Position:
        range: integer
        minimum_value: 1
        description: This field captures the position of this Laser on a Multi Laser Engine.
        annotations:
          Tier: '3'
      RepetitionRate:
        range: float
        description: In the case this is a pulsed Laser (Pulse is True), this field (also known as Pulse Frequency) describes
          the frequency of laser pulses. The default unit is Hz.
        exact_mappings:
        - ome:repetition_rate
        annotations:
          Tier: '3'
      RepetitionRateUnit:
        range: UnitsFrequency
        ifabsent: string(Hz)
        annotations:
          Tier: '3'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the RepetitionRate - default:hertz[Hz].
        exact_mappings:
        - ome:repetition_unit
      PulseDuration:
        range: float
        description: In the case this is a pulsed Laser (Pulse is True), this field describes the duration of each Laser pulse.
        annotations:
          Tier: '3'
      PulseDurationUnit:
        range: UnitsTime
        ifabsent: string(ms)
        annotations:
          Tier: '3'
          description_source: derived from Laser.PulseDuration
        description: The unit of PulseDuration.
      FrequencyMultiplication:
        range: float
        description: This field captures the optical frequency multiplication factor that may be specified for this Laser.
        exact_mappings:
        - ome:frequency_multiplication
        annotations:
          Tier: '3'
      UsedAcoustoOpticalDevice:
        range: boolean
        description: This field records whether (True) or not (False) an AcoustoOptical Device was utilized during this Calibration
          Procedure.
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: LightSource
      Tier: '1'
      Split: '[Fluorescence_LightSource]'
      Model_Settings: LightSourceSettings
      xsdfu_plural: Lasers
    slot_usage:
      Role:
        range: FluorescenceLightSourceRole
  LightEmittingDiode:
    description: A Light Emitting Diode (LED) is a semiconductor light source that emits light when current flows through
      it. Electrons in the semiconductor recombine with electron holes, releasing energy in the form of photons. The color
      of the light (corresponding to the energy of the photons) is determined by the energy required for electrons to cross
      the band gap of the semiconductor. White light may be obtained by using multiple semiconductors or a layer of light-emitting
      phosphor on the semiconductor device.
    exact_mappings:
    - ome:LightEmittingDiodeLightSource
    is_a: LightSource
    attributes:
      LEDModule:
        range: LEDModule
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: A Light Emitting Diode (LED) Light Source is often composed of multiple modules each with its own wavelength
          characteristics. This element describes an individual LED module. Multiple of this elements may be used.
      Type:
        range: LightEmittingDiodeType
        description: This field captures the general category of this Light Emitting Diode.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: LightSource
      Tier: '1'
      Split: '[Transmitted_LightSource; Fluorescence_LightSource]'
      Model_Settings: LightSourceSettings
      xsdfu_plural: LightEmittingDiodes
  Objective:
    description: The Microscope's Objective lens consists of a lens, its mount, and any associated parts. It is the part of
      the imaging system, which forms a primary image of the object, either alone or in conjunction with a tube lens. The
      Objective typically consists of a compound lens consisting of along a common axis.
    exact_mappings:
    - ome:Objective
    is_a: ManufacturerSpec
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: ObjectiveID
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Magnification:
        range: float
        description: This field captures the Magnification of the Objective as specified by the Manufacturer - i.e., 60 represents
          a 60X lens.
        exact_mappings:
        - ome:nominal_magnification
        required: true
        annotations:
          Tier: '1'
      LensNA:
        range: float
        description: This field captures the nominal Numerical Aperture (NA) of this Objective as specified by the Manufactuer,
          expressed as a floating-point (real) number (e.g. 1.27 NA). NA is a number that was defined initially by Abbe to
          characterize Objectives and Condensers. NA can be calculated by the expression n sin alpha, where n is the Refractive
          Index of the medium between the Lens and the Sample, and alpha is half the Angular Aperture of the Lens. NA is a
          measure of how much of the illumination that leaves the specimen actually passes through the Lens. The larger the
          NA, the more information the lens can transmit. Expected range 0.02 - 1.5.
        exact_mappings:
        - ome:lens_na
        required: true
        annotations:
          Tier: '1'
      Correction:
        range: ObjectiveCorrection
        description: This field captures the type of optical correction (i.e. chromatic correction, or flatness correction,
          etc.) associated with this Objective.
        exact_mappings:
        - ome:correction
        required: true
        annotations:
          Tier: '1'
      ImmersionType:
        range: ImmersionTypeList
        description: According to ISO 10934-1:2002, an Immersion Liquid is a liquid (commonly immersion oil, water or glycerol)
          specified as suitable for use in the space between the front of an immersion lens and the object NOTE Because the
          immersion liquid is considered in the computing of corrections to be part of the lens, its refractive index and
          dispersion (or Abbe number) are critical. Please refer to ISO 8036-1 for more details on Immersion Oil. This field
          describes the general category of the Immersion Liquid this Objective is designed for, according to the Manufacturer.
          If the general category is not Air, the actual Immersion Liquid that was used during the Acquisition of a specific
          Image must be specified in Objective Settings.
        close_mappings:
        - ome:immersion
        required: true
        annotations:
          Tier: '1'
      InfinityCorrected:
        range: boolean
        description: This field records whether (True) or not (False) this Objective is infinity corrected. An Infinity-corrected
          Objective is corrected for an infinite sample to primary image distance and needs to be used with a Tube Lens of
          appropriate focal length to obtains its nominal magnification.
        required: true
        annotations:
          Tier: '1'
      ContrastModulation:
        range: ContrastModulationPlate
        description: This field specifies the presence in this Objective of a contrast modulation device, such as a Phase
          Ring (Ph1, Ph2, Ph3), a Hoffman modulator, a Varel modulator, or similar.
        required: true
        annotations:
          Tier: '1'
      DIC:
        range: boolean
        description: This field specifies whether (True) the Objective is designed for Differential Interference Contrast
          (DIC) or not (False). DIC is a contrast modality due to double-beam interference in which two waves that fall on
          the object Plane or Image Plane are separated laterally by a distance similar to the minimum resolvable distance.
        required: true
        annotations:
          Tier: '1'
      LightType:
        range: ObjectiveLightType
        description: This field specifies whether this Objective is designed for a special Light application (e.g., IR or
          UV).
        ifabsent: string(Visible)
        annotations:
          Tier: '1'
      DippingMedium:
        range: DippingType
        description: In case the Immersion Type for this Objective is designated as Dipping, this field captures the type
          of Dipping Medium this Objective is compatible with. Examples include, water-based (biological buffers, culture
          media, other water-based solutions) organic-based [FocusClear (CLARITY); CUBIC-1, CUBIC-2, CUBIC-R1, CUBIC-R2; 2,2-thiodiethanol
          (TDE); ethyl cinnamate; Benzyl Benzoate and BB-PEG (PEGASOS); Benzyl Alcohol, Benzyl Benzoate (BABB); dibenzyl ether
          (DBE); 100% Ethanol].
        annotations:
          Tier: '2'
      WorkingDistance:
        range: float
        description: This field reports the Working Distance of this Objective under normal operating conditions. The Working
          Distance is the distance (in air, or in the specified immersion liquid) between the front of an Objective and the
          surface of the cover glass or of the specimen if uncovered.
        exact_mappings:
        - ome:working_distance
        required: true
        annotations:
          Tier: '2'
      WorkingDistanceUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '2'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units of the working distance - default:microns[µm].
        exact_mappings:
        - ome:working_distance_unit
      CorrectionCollar:
        range: boolean
        description: This field records whether (True) or not (False) the Objective was fitted with a Correction Collar. When
          using high NA dry Objectives (NA 0.8 or greater), cover glass thickness variations of only a few micrometers, immersion
          medium, and temperature changes result in dramatic image degradation due to aberration. To compensate for these
          errors, the more highly corrected Objectives are equipped with a Correction Collar mechanism, which is provided
          to adjust the central lens group position to compensate for deviations from correct optical path length due to changes
          in Cover Glass Thickness, the nature of the Immersion Liquid, different Numerical Apertures, and Temperature.
        required: true
        annotations:
          Tier: '2'
      CorrectionCollarType:
        range: CorrectionCollarTypeList
        description: This field records the type of Correction Collar with which this Objective is fitted. In case the Objective
          has more than one Correction Collar please enter "Multi" and provide more details in Description.
        annotations:
          Tier: '2'
      PhaseContrastDesignation:
        range: PhaseContrastDesignationType
        description: 'If the Objective is designed for Phase, this field specifies the Phase Contrast type designation (see:
          https://www.microscopyu.com/techniques/phase-contrast/phase-contrast-Microscope-configuration).'
        annotations:
          Tier: '2'
      CalibratedMagnification:
        range: float
        description: This field captures the Magnification of the Objective as measured via a calibration process- i.e., '59.987'
          for a 60x lens.
        exact_mappings:
        - ome:calibrated_magnification
        annotations:
          Tier: '2'
      Iris:
        range: boolean
        description: This field records whether (True) or not (False) the Objective was fitted with an Iris. Manufacturers
          offer high NA Objectives, which are equipped with an internal Iris Diaphragm that increases image contrast during
          digital imaging to compensate for image flare artifacts due to light emitted from areas outside the focal plane.
          Opening or closing the Iris Diaphragm determines the size of the Objective rear aperture yielding a variable NA
          range between 0.5 and the Objective's upper limit.
        exact_mappings:
        - ome:iris
        annotations:
          Tier: '2'
      ObjectiveViewField:
        range: float
        description: 'This field records the maximal diameter of the view field allowed by this Objective, expressed in mm,
          and measured at the intermediate Image Plane. NB: The field of view is influenced by the magnification and diameter
          of the ocular (eyepiece) field diaphragm, but also by the limits imposed by the design of the Objective.'
        required: true
        annotations:
          Tier: '3'
      ImageDistance:
        range: float
        description: This field records the distance in air between the rear principal Plane of this Objective and the primary
          Image Plane.
        required: true
        annotations:
          Tier: '3'
      ImageDistanceUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from Objective.ImageDistance
        description: The unit of ImageDistance.
      FrontFocalLength:
        range: float
        description: This field records the distance (f) measured along the optical axis from the front principal Plane of
          this Lens to the front focal Plane (F).
        annotations:
          Tier: '3'
      FrontFocalLengthUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from Objective.FrontFocalLength
        description: The unit of FrontFocalLength.
      BackFocalLength:
        range: float
        description: This field records the distance (f') measured along the optical axis from the rear principal Plane of
          this Lens to the rear focal Plane (F').
        annotations:
          Tier: '3'
      BackFocalLengthUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from Objective.BackFocalLength
        description: The unit of BackFocalLength.
      ParfocalizingDistance:
        range: float
        description: This field records the distance between the mounting Plane of this Objective and the specimen Plane.
        annotations:
          Tier: '3'
      ParfocalizingDistanceUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from Objective.ParfocalizingDistance
        description: The unit of ParfocalizingDistance.
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: Magnification
      Tier: '1'
      Model_Settings: ObjectiveSettings
      xsdfu_plural: Objectives
  ExcitationFilter:
    description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
      direction, and/or intensity of the radiation which it transmits or reflects. This element refers to an Excitation Filter
      whose purpose is to selectively attenuate the Light that is utilized to Excite the Sample depending on Wavelength. This
      element can be associated with an optional Filter Holder.
    is_a: Filter
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: FluorescenceLightPath
      Tier: '1'
      xsdfu_plural: ExcitationFilters
  EmissionFilter:
    description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
      direction, and/or intensity of the radiation which it transmits or reflects. This element refers to an Emission Filter
      whose purpose is to selectively attenuate the Fluorescent Light that is emitted by the Sample depending on Wavelength.
      This element can be associated with an optional Filter Holder.
    is_a: Filter
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: FluorescenceLightPath
      Tier: '1'
      xsdfu_plural: EmissionFilters
  StandardDichroic:
    description: A Dichroic Mirror (also often referred to as Dichroic Beamsplitter or simply as Dichroic) is a Mirror that
      spectrally separate light by transmitting and reflecting light as a function of wavelength. In the context of fluorescence
      microscopy, they are typically used to reflect the excitation light, but transmit the emitted fluorescence. Dichroic
      Mirrors can be categorized in different manners. However, the most important criteria for choosing a Dichoric Mirror
      are the Transmittance and the Reflectance Wavelength ranges. This element describes a Dichroic positioned in the standard
      Light Path for one or more Channels available for this Instrument.
    is_a: Dichroic
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: FluorescenceLightPath
      Tier: '1'
      Model_Settings: MirroringDeviceSettings
      xsdfu_plural: StandardDichroics
  GenericDetector:
    description: This element is used to represent a Generic Detector as a collection of Key/Value pairs, which are stored
      in a Map. One of the other detector elements should always be used in preference to this if possible.
    is_a: Detector
    attributes:
      Map:
        range: Map
        inlined: true
        required: true
        description: This is a Mapping of Key/Value pairs used to store customized metadata that describes this element.
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: ChildElement
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: Detector
      Tier: '1'
      Model_Settings: GenericDetectorSettings
      xsdfu_plural: GenericDetectors
  TransmittanceRange:
    description: This element records the Range (also known as Band) of Wavelengths that are transmitted by this optical component.
      It also records the maximum amount of light transmitted. Multiple of these elements can be used.
    exact_mappings:
    - ome:TransmittanceRange
    attributes:
      Wavelength:
        range: PositiveFloat
        description: This field records the key Wavelength] that characterizes this Transmittance Range (also known as Transmission
          band). In the case of Bandpass, Bandstop, Multipass or Notch Filters, Wavelength often refers to the Central Wavelength
          of each of the transmission band(s); alternatively, in case of a Longpass or a Shortpass Filters, Wavelength refers
          to the CutOn Wavelength (i.e., below which there is less than 50% transmittance) or the CutOff Wavelengths (i.e.,
          above which there is less than 50% transmittance) respectively. In the case of Dichroics, Wavelength most commonly
          refers to the Edge Wavelength which might be either the CutOn or the CutOff Wavelength depending on individual cases.
        required: true
        annotations:
          Tier: '1'
      FWHMBandwidth:
        range: PositiveFloat
        description: This field records the width of this Transmittance Range (also known as Transmission band). Specifically,
          the Full Width at Half Maximum (FWHM) represents the bandwidth of the Wavelength spectrum curve measured between
          those points whose transmission amplitude is 50% of the maximum. In case bandwidth is not available, such as in
          the case of a LongPass, Notch or ShortPass configuration, please enter 000.
        required: true
        annotations:
          Tier: '1'
      WavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '1'
          description_source: derived from TransmittanceRange.Wavelength
        description: The unit of Wavelength.
      Transmittance:
        range: PercentFraction
        description: This field records the maximum amount of light this optical component is capable of transmitting in this
          Wavelength Range, at the peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        exact_mappings:
        - ome:transmittance
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '1'
      xsdfu_plural: TransmittanceRanges
  FilterSet:
    description: This element represents a FilterSet that was used for the acquisition of this Channel. A Filter Set is typically
      composed of one Excitation Filter, one Emission Filter and a Dichroic. They might either be pre-assembled by the Manufacturer
      and purchased as a whole or they can be custom assembled on site depending on the needs of the user.
    exact_mappings:
    - ome:FilterSet
    attributes:
      ExcitationFilter:
        inlined: false
        annotations:
          xsd_element: ExcitationFilterRef
        description: This field refers to an available Excitation Filter, which is part of this Filter Cube.
        exact_mappings:
        - ome:excitation_filters
        range: Filter
      StandardDichroic:
        inlined: false
        annotations:
          xsd_element: StandardDichroicRef
          Tier: '1'
        description: This refers to an available dichroic mirror, which is part of this filter set.
        close_mappings:
        - ome:dichroic
        range: MirroringDevice
      EmissionFilter:
        inlined: false
        annotations:
          xsd_element: EmissionFilterRef
        description: This field refers to an available Emission Filter, which is part of this Filter Cube.
        exact_mappings:
        - ome:emission_filters
        range: Filter
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: FilterSetID
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A user-defined Name for this component.
        annotations:
          Tier: '1'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: LightPath
      Tier: '1'
      xsdfu_plural: FilterSets
  ObjectiveSettings:
    description: This element holds the Setting applied to the Objective used during the Acquisition of this Image as well
      as a reference (the ID attribute) to the Objective in question.
    exact_mappings:
    - ome:ObjectiveSettings
    is_a: Settings
    attributes:
      ImmersionLiquid:
        range: ImmersionLiquid
        inlined: true
        description: 'This element refers to the Immersion Liquid that was used with this Objective during the Acquisition
          of this Image. According to ISO 10934-1:2002, an Immersion Liquid is a liquid (commonly immersion oil, water, glycerol
          or any media in which the Specimen is submerged during acquisition in case a Cover Glass is not used) specified
          as suitable for use in the space between the front of an Objective lens and the Cover Glass or the Object itself
          (i.e., such as is the case for Dipping Objectives). Refer to ISO 8036-1 for more details on Immersion Oil. Please
          NOTE: Because the Immersion Liquid is considered in the computing of corrections to be part of the lens, its refractive
          index and dispersion (or Abbe number) are critical. Also please NOTE: In case a Cover Glass is not used during Acquisition
          the Immersion Liquid is most often referred to as Dipping Medium. Examples of Dipping Media include, water-based
          solutions (biological buffers, culture media, other water-based solutions) and organic-based [FocusClear (CLARITY);
          CUBIC-1, CUBIC-2, CUBIC-R1, CUBIC-R2; 2,2-thiodiethanol (TDE); ethyl cinnamate; Benzyl Benzoate and BB-PEG (PEGASOS);
          Benzyl Alcohol, Benzyl Benzoate (BABB); dibenzyl ether (DBE); Ethanol].'
      ID:
        description: This is the Unique Identifier of the Objective used in this case.
        exact_mappings:
        - ome:id
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: Objective
      CorrectionCollarPosition:
        range: string
        description: The Correction Collar typically consists of an adjustable ring on the Objective whose position can be
          modified. This field records the position of the collar during the Acquisition of this Image. Each correction collar
          has an arbitrary scale or it might be scale-less and instead have fixed positions with qualitative designations
          (i.e., Oil, Water in case in which the Objective might be corrected for Immersion Liquid).
        exact_mappings:
        - ome:correction_collar
        annotations:
          Tier: '2'
      NumericalApertureSetting:
        range: string
        description: 'In case the Numerical Aperture (NA) of this Objective is variable (i.e., as for example in case of Objectives
          that can be used with or without Cover Glass or Objectives that can be dipped in different media), this field capture
          the NA setting that was employed for Image Acquisition. NOTE: please note that often NA regulation in these types
          of Objectives occurs via a rotating collar whose exact position is difficult to measure and reproduce across different
          Experiments.'
        annotations:
          Tier: '2'
      MeasuredRefractiveIndex:
        range: float
        description: The field records the Temperature dependent measured Refractive Index of the Immersion Liquid (or Dipping
          Medium) utilized in this case.
        annotations:
          Tier: '2'
      Temperature:
        range: float
        description: This field captures the Temperature of the Objective if different from the ImagingEnvironment/Temperature.
        annotations:
          Tier: '2'
      TemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '2'
          description_source: derived from ObjectiveSettings.Temperature
        description: The unit of Temperature.
      IrisAperture:
        range: float
        description: This field records the aperture of the Iris diaphragm, which determines the size of the objective rear
          aperture yielding a variable numerical aperture range between 0.5 and the objective's upper limit.
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
      Model_Hardware: Objective
      xsdfu_plural: ObjectiveSettingsCombinations
  StageLabel:
    description: The StageLabel is used to specify the Name and Position for a Stage position in the Microscope's reference
      frame.
    attributes:
      Name:
        range: string
        description: A User-defined Name for this Stage Label.
        required: true
        annotations:
          Tier: '2'
      X:
        range: float
        description: The X position of this StageLabel.
        annotations:
          Tier: '2'
      XUnits:
        range: UnitsLength
        annotations:
          Tier: '2'
      Y:
        range: float
        description: The Y position of this StageLabel.
        annotations:
          Tier: '2'
      YUnits:
        range: UnitsLength
        annotations:
          Tier: '2'
      Z:
        range: float
        description: The Z position of this StageLabel.
        annotations:
          Tier: '2'
      ZUnits:
        range: UnitsLength
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '2'
  LightSourceSettings:
    description: This element holds the Setting applied to a Light Source used in the Light Path during the acquisition of
      this Channel as well as a reference to the LightSource (the ID attribute) in question.
    exact_mappings:
    - ome:LightSourceSettings
    is_a: Settings
    attributes:
      ID:
        description: A Unique Identifier for this component.
        exact_mappings:
        - ome:id
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: LightSource
      IlluminationPowerSettings:
        range: float
        description: This field records the nominal Illumination Power (also known as Power Output or Illumination Intensity)
          that was set for the Acquisition of this Image or was reported by the Image Acquisition Software, as advertised
          by the Manufacturer. Depending on the system this might be reported as a % value.
        required: true
        annotations:
          Tier: '1'
      lluminationPowerSettingsUnit:
        range: UnitsPower
        ifabsent: string(mW)
        annotations:
          Tier: '1'
      Attenuation:
        range: PercentFraction
        description: This field records the actual Attenuation of the excitation light power that was applied during the Acquisition
          of this Channel, expressed as a fractional value from 0.0 to 1.0.
        exact_mappings:
        - ome:attenuation
        annotations:
          Tier: '2'
      AttenuationMethod:
        range: string
        description: This field records the Method that was used to Attenuate the Laser beam during the acquisition of this
          Image.
        annotations:
          Tier: '3'
      UsedAcoustoOpticalDevice:
        range: boolean
        description: In case a Laser was used for this Image Acquisition, this field records whether (True) or not (False)
          an AcoustoOptical Device was employed for intensity modulation.
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
      xsdfu_plural: LightSourceSettingCombinations
  ImagingEnvironment:
    description: This element describes the environment in which the biological sample was maintained during the Acquisition
      of this Image.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: This element holds a free text multi-line optional description for this component.
      Map:
        range: Map
        inlined: true
        description: This is a Mapping of Key/Value pairs.
        annotations:
          Tier: '3'
      ID:
        range: EnvironmentalControlDeviceID
        description: This is the Unique Identifier of the Environmental Control Device used in this case.
        identifier: true
        annotations:
          Tier: '1'
      Temperature:
        range: string
        description: The field records the Temperature at which this Image Acquisition was performed. Allowed values include
          a number or the phrase "Room Temperature".
        required: true
        annotations:
          Tier: '1'
      TemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '1'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units the Temperature is in - default:Celsius[°C].
      CO2Percent:
        range: string
        description: The field records the Carbon Dioxide concentration (expressed as a % value) at which this Image Acquisition
          was performed. Allowed values include a number or the phrase "Ambient Conditions".
        required: true
        annotations:
          Tier: '1'
      Humidity:
        range: string
        description: The field records the Humidity (expressed as a % value) at which this Image Acquisition was performed.
          Allowed values include a number or the phrase "Ambient Humidity".
        required: true
        annotations:
          Tier: '1'
      AirPressure:
        range: float
        description: The field records the AirPressure the Acquisition of this Image was performed at.
        annotations:
          Tier: '2'
      AirPressureUnit:
        range: UnitsPressure
        ifabsent: string(mbar)
        annotations:
          Tier: '2'
          description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
        description: The units the AirPressure is in - default:millibars[mbar].
      O2Percent:
        range: PercentFraction
        description: This field records the Oxygen concentration around the sample [units:none] during the Acquisition of
          this Image. Expressed as a percentage fraction as a value from 0.0 to 1.0.
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: SampleConditions
      Tier: '1'
      xsdfu_plural: ImagingEnvironmentCombinations
  GenericDetectorSettings:
    description: This element refers to the Generic Detector that was used to Acquire this Channel and it holds the Settings
      that were applied to the Detector during this Acquisition.
    is_a: DetectorSettings
    annotations:
      Extension: Core
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  External:
    description: Describes a file location. Can optionally specify a portion of a file using Offset and a ReadLength. If Offset
      and ReadLength are specified in conjuction with Compression, then they point into the uncompressed file.
    attributes:
      href:
        range: uri
        description: file location
        required: true
      SHA1:
        range: Hex40
        description: The digest of the file specified in href.
        required: true
      Compression:
        range: ExternalCompression
        description: Specifies the compression scheme used to encode the data.
        ifabsent: string(none)
    annotations:
      xsdfu_plural: Externals
  BinaryFile:
    description: Describes a binary file.
    attributes:
      External:
        range: External
        inlined: true
        description: Describes a file location. Can optionally specify a portion of a file using Offset and a ReadLength.
          If Offset and ReadLength are specified in conjuction with Compression, then they point into the uncompressed file.
        annotations:
          xsd_choice: BinaryFile_choice_1
      BinData:
        range: BinData
        inlined: true
        description: The contents of this element are base64-encoded. These are not CDATA sections, just a base64 stream.
        annotations:
          xsd_choice: BinaryFile_choice_1
      FileName:
        range: string
        required: true
      Size:
        range: NonNegativeLong
        description: Size of the uncompressed file. [unit:bytes]
        required: true
      MIMEType:
        range: string
    annotations:
      xsdfu_plural: BinaryFiles
  StructuredAnnotations:
    description: An unordered collection of annotation attached to objects in the OME data model.
    attributes:
      XMLAnnotation:
        range: XMLAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: An general xml annotation. The contents of this is not processed as OME XML but should still be well-formed
          XML.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      FileAnnotation:
        range: FileAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: An annotation that consists of a file object.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      ListAnnotation:
        range: ListAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This annotation is a grouping object. It uses the sequence of annotation refs from the base Annotation
          to form the list.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      LongAnnotation:
        range: LongAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A simple numerical annotation of type xsd:long.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      DoubleAnnotation:
        range: DoubleAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A simple numerical annotation of type xsd:double.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      CommentAnnotation:
        range: CommentAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: An annotation that consists of a simple multi-line comment.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      BooleanAnnotation:
        range: BooleanAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A simple boolean annotation of type xsd:boolean.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      TimestampAnnotation:
        range: TimestampAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A date/time annotation of type xsd:dateTime.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      TagAnnotation:
        range: TagAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A tag annotation (represents a tag or a tagset)
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      TermAnnotation:
        range: TermAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: An annotation that consists of an ontology term.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
      MapAnnotation:
        range: MapAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: A Map Annotation. The contents of this is a list of Key/Value pairs.
        annotations:
          xsd_choice: StructuredAnnotations_choice_1
  XMLAnnotation:
    description: An general xml annotation. The contents of this is not processed as OME XML but should still be well-formed
      XML.
    is_a: TextAnnotation
    attributes:
      Value:
        range: XMLAnnotationValue
        inlined: true
        required: true
    annotations:
      xsdfu_plural: XMLAnnotations
  XMLAnnotationValue:
    attributes:
      Value:
        range: string
        annotations:
          xsd_any: lax
  ListAnnotation:
    description: This annotation is a grouping object. It uses the sequence of annotation refs from the base Annotation to
      form the list.
    is_a: Annotation
    annotations:
      xsdfu_plural: ListAnnotations
  CommentAnnotation:
    description: An annotation that consists of a simple multi-line comment.
    is_a: TextAnnotation
    attributes:
      Value:
        range: string
        required: true
        description: This element contains the actual content of this annotation. [multi-line string]
        annotations:
          Tier: '2'
    annotations:
      Tier: '2'
      xsdfu_plural: CommentAnnotations
  LongAnnotation:
    description: A simple numerical annotation of type xsd:long.
    is_a: NumericAnnotation
    attributes:
      Value:
        range: integer
        required: true
    annotations:
      xsdfu_plural: LongAnnotations
  DoubleAnnotation:
    description: A simple numerical annotation of type xsd:double.
    is_a: NumericAnnotation
    attributes:
      Value:
        range: double
        required: true
    annotations:
      xsdfu_plural: DoubleAnnotations
  BooleanAnnotation:
    description: A simple boolean annotation of type xsd:boolean.
    is_a: BasicAnnotation
    attributes:
      Value:
        range: boolean
        required: true
    annotations:
      xsdfu_plural: BooleanAnnotations
  TimestampAnnotation:
    description: A date/time annotation of type xsd:dateTime.
    is_a: BasicAnnotation
    attributes:
      Value:
        range: datetime
        required: true
    annotations:
      xsdfu_plural: TimestampAnnotations
  TagAnnotation:
    description: A tag annotation (represents a tag or a tagset)
    is_a: TextAnnotation
    attributes:
      Value:
        range: string
        required: true
    annotations:
      xsdfu_plural: TagAnnotations
  TermAnnotation:
    description: An annotation that consists of an ontology term.
    is_a: BasicAnnotation
    attributes:
      Value:
        range: string
        required: true
    annotations:
      xsdfu_plural: TermAnnotations
  MapAnnotation:
    description: A Map Annotation. The contents of this is a list of Key/Value pairs.
    is_a: Annotation
    attributes:
      Value:
        range: Map
        inlined: true
        required: true
        description: This is a Mapping of Key/Value pairs.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecification
      Category: ChildElement
      Tier: '3'
      xsdfu_plural: MapAnnotations
  Rectangle:
    description: A simple rectangle object. If rotation is required apply a transformation at the Shape level.
    is_a: Shape
    attributes:
      X:
        range: float
        description: The X value of the left edge or the rectangle. [units pixels]
        required: true
      Y:
        range: float
        description: The y value of the top edge or the rectangle. [units pixels]
        required: true
      Width:
        range: float
        description: The width of the rectangle. [units pixels]
        required: true
      Height:
        range: float
        description: The height of the rectangle. [units pixels]
        required: true
    annotations:
      xsdfu_plural: Rectangles
  Mask:
    description: The Mask ROI shape is a link to a BinData object that is a BIT mask drawn on top of the Image as an ROI.
      It is applied at the same scale, Pixel to Pixel, as the Image the ROI is applied to, unless a transform is applied at
      the shape level.
    is_a: Shape
    attributes:
      BinData:
        range: BinData
        inlined: true
        required: true
        description: The contents of this element are base64-encoded. These are not CDATA sections, just a base64 stream.
      X:
        range: float
        description: The X coordinate of the left side of the Image. [units pixels]
        required: true
      Y:
        range: float
        description: The Y coordinate of the top side of the Image. [units pixels]
        required: true
      Width:
        range: float
        description: The width of the mask. [units pixels]
        required: true
      Height:
        range: float
        description: The height of the mask. [units pixels]
        required: true
    annotations:
      xsdfu_plural: Masks
  Point:
    is_a: Shape
    attributes:
      X:
        range: float
        description: The X coordinate of the point. [units pixels]
        required: true
      Y:
        range: float
        description: The Y coordinate of the point. [units pixels]
        required: true
    annotations:
      xsdfu_plural: Points
  Ellipse:
    description: A simple ellipse object. If rotation is required apply a transformation at the Shape level.
    is_a: Shape
    attributes:
      X:
        range: float
        description: The X coordinate of the center of the ellipse. [units pixels]
        required: true
      Y:
        range: float
        description: The Y coordinate of the center of the ellipse. [units pixels]
        required: true
      RadiusX:
        range: float
        description: The horizontal radius of the ellipse. [units pixels]
        required: true
      RadiusY:
        range: float
        description: The vertical radius of the ellipse. [units pixels]
        required: true
    annotations:
      xsdfu_plural: Ellipses
  Line:
    description: A straight line defined by it's end points.
    is_a: Shape
    attributes:
      X1:
        range: float
        description: The X coordinate of the start of the line. [units pixels]
        required: true
      Y1:
        range: float
        description: The Y coordinate of the start of the line. [units pixels]
        required: true
      X2:
        range: float
        description: The X coordinate of the end of the line. [units pixels]
        required: true
      Y2:
        range: float
        description: The Y coordinate of the end of the line. [units pixels]
        required: true
      MarkerStart:
        range: Marker
      MarkerEnd:
        range: Marker
    annotations:
      xsdfu_plural: Lines
  Polyline:
    description: 'The Polyline defines open shapes formed of straight lines. Note: Polyline uses counterclockwise winding
      (this is the default OpenGL behavior)'
    is_a: Shape
    attributes:
      Points:
        range: string
        description: The points of the polyline are defined as a list of comma separated x,y coordinates seperated by spaces
          like "x1,y1 x2,y2 x3,y3" e.g....................... "0,0 1,2 3,5"
        required: true
      MarkerStart:
        range: Marker
      MarkerEnd:
        range: Marker
    annotations:
      xsdfu_plural: Polylines
  Polygon:
    description: 'The Polygon defines closed shapes formed of straight lines. Note: Polygon uses counterclockwise winding
      (this is the default OpenGL behavior)'
    is_a: Shape
    attributes:
      Points:
        range: string
        description: The points of the Polygon are defined as a list of comma separated x,y coordinates seperated by spaces
          like "x1,y1 x2,y2 x3,y3" e.g....................... "0,0 1,2 3,5"
        required: true
    annotations:
      xsdfu_plural: Polygons
  Label:
    description: The text label. Any transformation should be applied at the shape level.
    is_a: Shape
    attributes:
      X:
        range: float
        description: This defines the X coordinate of the current text position of the first character in the string. [units
          pixels]
        required: true
      Y:
        range: float
        description: This defines the Y coordinate of the current text position of the first character in the string. [units
          pixels]
        required: true
    annotations:
      xsdfu_plural: Labels
  Reagent:
    description: Reagent is used to describe a chemical or some other physical experimental parameter.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A long description for the reagent.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: ReagentID
        required: true
        identifier: true
      Name:
        range: string
        description: A short name for the reagent.
      ReagentIdentifier:
        range: string
        description: This is a reference to an external (to OME) representation of the Reagent. It serves as a foreign key
          into an external database. - It is sometimes referred to as ExternalIdentifier.
    annotations:
      xsdfu_plural: Reagents
  PlateAcquisition:
    description: PlateAcquisition is used to describe a single Acquisition run for a plate. This object is used to record
      the set of images acquired in a single Acquisition run. The Images for this run are linked to PlateAcquisition through
      WellSample.
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: A description for the PlateAcquisition.
      WellSample:
        inlined: false
        annotations:
          xsd_element: WellSampleRef
        multivalued: true
        description: The WellSampleRef element is a reference to a WellSample element.
        range: WellSample
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: PlateAcquisitionID
        required: true
        identifier: true
      Name:
        range: string
      EndTime:
        range: datetime
        description: Time when the last Image of this Acquisition was collected
      StartTime:
        range: datetime
        description: Time when the first Image of this Acquisition was collected
      MaximumFieldCount:
        range: PositiveInt
        description: The maximum number of fields (well samples) in any well in this PlateAcquisition. This is only used to
          speed up user interaction by stopping the reading of every well sample.
    annotations:
      xsdfu_plural: PlateAcquisitions
  Well:
    description: A Well is a component of the Well/Plate/Screen construct to describe screening applications. A Well has a
      number of WellSample elements that link to the Images collected in this well. The ReagentRef links any Reagents that
      were used in this Well. A well is part of only one Plate. The origin for the row and column identifiers is the top left
      corner of the plate starting at zero. i.e The top left well of a plate is index (0,0)
    attributes:
      WellSample:
        range: WellSample
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: WellSample is an individual Image that has been captured within a Well.
        annotations:
          xsdfu_ordered: 'true'
      Reagent:
        inlined: false
        annotations:
          xsd_element: ReagentRef
        range: Reagent
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          xsdfu_manytomany: 'true'
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: WellID
        required: true
        identifier: true
      Column:
        range: NonNegativeInt
        description: This is the column index of the well, the origin is the top left corner of the plate with the first column
          of cells being column zero. i.e top left is (0,0) The combination of Row, Column has to be unique for each well
          in a plate.
        required: true
      Row:
        range: NonNegativeInt
        description: This is the row index of the well, the origin is the top left corner of the plate with the first row
          of wells being row zero. i.e top left is (0,0) The combination of Row, Column has to be unique for each well in
          a plate.
        required: true
      ExternalDescription:
        range: string
        description: A description of the externally defined identifier for this plate.
      ExternalIdentifier:
        range: string
        description: The ExternalIdentifier attribute may contain a reference to an external database.
      Type:
        range: string
        description: A human readable identifier for the screening status. e.g....................... empty, positive control,
          negative control, control, experimental, etc.
      Color:
        range: Color
        description: 'A marker color used to highlight the well - encoded as RGBA The default value "-1" is #FFFFFFFF so solid
          white (it is a signed 32 bit value) NOTE: Prior to the 2012-06 schema the default value was incorrect and produced
          a transparent red not solid white.'
        ifabsent: string(-1)
    annotations:
      xsdfu_plural: Wells
  WellSample:
    description: WellSample is an individual Image that has been captured within a Well.
    attributes:
      Image:
        inlined: false
        annotations:
          xsd_element: ImageRef
          xsdfu_injected: 'true'
        description: This is the main link to the core Image element
        range: Image
      ID:
        range: WellSampleID
        required: true
        identifier: true
      PositionX:
        range: float
        description: The X position of the field (Image) within the well relative to the well origin defined on the Plate.
          Units are set by PositionXUnit.
      PositionXUnit:
        range: UnitsLength
        description: The units of the position in X - default:reference frame.
        ifabsent: string(reference frame)
      PositionY:
        range: float
        description: The Y position of the field (Image) within the well relative to the well origin defined on the Plate.
          Units are set by PositionYUnit.
      PositionYUnit:
        range: UnitsLength
        description: The units of the position in Y - default:reference frame.
        ifabsent: string(reference frame)
      Timepoint:
        range: datetime
        description: The time-point at which the Image started to be collected
      Index:
        range: NonNegativeInt
        description: This records the order of the well samples. Each index should be unique for a given plate but they do
          not have to be sequential, there may be gaps if part of the dataset is missing. In the user interface the displayed
          value of the index will be calculated modulo the number of PlateAcquisitions for the plate.
        required: true
    annotations:
      xsdfu_plural: WellSamples
  Sample:
    description: This field captures a description of the sample that was imaged in this experiment.
    attributes:
      MountingMedium:
        range: MountingMedium
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element refers to the Mounting Medium that was used during the acquisition of this Image. According
          to ISO 10934-1:2002, a Mounting Medium is a liquid, synthetic resin or other medium in which this Specimen is placed
          during Image Acquisition. NOTE For fixed Samples observed by transmitted-light microscopy, this Medium is transparent,
          colourless and of specified refractive index, enclosed between the slide and the cover glass. For reflected-light
          microscopy, the mounting medium is normally a resin with which the Sample is impregnated so that a polished section
          may be made. For live Samples, the Medium is typically the tissue culture growth substrate.
      CoverGlass:
        range: CoverGlass
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a rectangular or circular piece of thin glass used to cover a microscopical preparation.
      SampleHolder:
        range: SampleHolder
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes the device (often referred to as Sample Carrier, Container or Vessel) on which
          the specimen was mounted for microscopical examination. It typically is flat and it could be made of glass or plastic.
          Examples include Microscope slides, Petri dishes, and multi-well plates.
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: This element holds a free text multi-line optional description for this component.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        multivalued: true
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A unique identifier for this Sample.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A user assigned Name for this Sample.
        required: true
        annotations:
          Tier: '1'
      BiologicalOrigin:
        range: boolean
        description: This field captures whether (True) or not (False) this Sample is of Biological Origin.
        required: true
        annotations:
          Tier: '1'
      SampleType:
        range: SampleType
        description: If of Biological Origin, this field records a term that describes the general category of this Sample.
        required: true
        annotations:
          Tier: '1'
      LiveSample:
        range: boolean
        description: This field captures whether (True) or not (False) this Sample was living during Image Acquisition.
        required: true
        annotations:
          Tier: '1'
      Organism:
        range: string
        description: 'If this sample is of biological origin, this field records the biological organisn this sample derives
          from. A biological is a biological entity that consists of one or more cells and is capable of genomic replication
          (independently or not). The use terms from NCBITaxon (http://purl.obolibrary.org/obo/NCBITaxon_1) is recommended.
          Note: if the sample is not of biological origin please enter none.'
        required: true
        annotations:
          Tier: '1'
      OrganismTermAccession:
        range: uri
        description: This field records the Accession ID for the term used to describe the Organism. The use of the NCBITaxon
          ontology (http://purl.obolibrary.org/obo/NCBITaxon_1) is recommended.
        annotations:
          Tier: '1'
      OrganismPart:
        range: string
        description: If applicable, this field records the part of organism's anatomy or substance arising from an organism
          from which the biomaterial was derived, excludes cells. E.g. tissue, organ, system, sperm, blood or body location
          (arm). The use of a sub-class of the 'Organism Part' (http://www.ebi.ac.uk/efo/EFO_0000635) term from the Experimental
          Factor Ontology (EFO; http://www.ebi.ac.uk/efo/) is recommended.
        annotations:
          Tier: '1'
      OrganismPartTermAccession:
        range: uri
        description: This field records the Accession ID for the term used to describe the Organism. A sub-classe of the EFO:0000635
          (http://www.ebi.ac.uk/efo/EFO_0000635) term from the Experimental Factor Ontology (EFO; http://www.ebi.ac.uk/efo/)
          is recommended.
        annotations:
          Tier: '1'
      SamplePreparationMethod:
        range: string
        description: This field records the method that was used to prepare this sample. The use of a sub-class of the 'Sample
          Preparation Method' (http://purl.obolibrary.org/obo/FBbi_00000001) term from the Biological Imaging Methods Ontology
          (FBbi; https://www.ebi.ac.uk/ols/ontologies/fbbi) is recommended.
        annotations:
          Tier: '1'
      SamplePreparationMethodTermAccession:
        range: uri
        description: This field records the the Accession ID for the term used to describe method that was used to prepare
          this sample. A subclass of the Fbbi:00000001 (http://purl.obolibrary.org/obo/FBbi_00000001) term from the Biological
          Imaging Methods Ontology (FBbi; https://www.ebi.ac.uk/ols/ontologies/fbbi) is recommended.
        annotations:
          Tier: '1'
      MetrologySample:
        range: boolean
        description: This field captures whether (True) or not (False) this is a Metrology Sample (i.e., a Sample that is
          used specifcially to calibrate and assess the performance of the Instrument utilized for this experimental Image
          Acquisition.
        required: true
        annotations:
          Tier: '2'
      FacingTheObjective:
        range: FacingTheObjectiveChoice
        description: This field captures whether the CoverGlass, the SampleHolder, or neither (None), faced the Objective
          during Acquisition of this Image.
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: Samples
  SampleHolder:
    description: This element describes the device (often referred to as Sample Carrier, Container or Vessel) on which the
      specimen was mounted for microscopical examination. It typically is flat and it could be made of glass or plastic. Examples
      include Microscope slides, Petri dishes, and multi-well plates.
    is_a: ManufacturerSpec
    attributes:
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Type:
        range: string
        description: This field records the Type of this Sample Holder. Options include, microscope slide, Petri dish, tissue
          culture plate, micro-well plate, etc. (e.g. 35 mm MatTek Glass Bottom Dish).
        required: true
        annotations:
          Tier: '1'
    annotations:
      Extension: Basic
      Domain: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: SampleHolders
  CoverGlass:
    description: This element describes a rectangular or circular piece of thin glass used to cover a microscopical preparation.
    is_a: ManufacturerSpec
    attributes:
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Coating:
        range: string
        description: This field reports a description for any Coating that was layered on the Cover Glass, either by the Manufacturer
          or after purchase (e.g., Poly-L-Lysine, Collagen).
        required: true
        annotations:
          Tier: '1'
      CoverGlassNo:
        range: CoverGlassNr
        description: 'This fields reports the numerical designation that describes the expected thickness of this Coverslip
          (e.g., #1.5) and the relative expected thickness range expressed in mm.'
        required: true
        annotations:
          Tier: '1'
      Thickness:
        range: float
        description: This fields reports the measured thickness of this Coverslip expressed in mm.
        annotations:
          Tier: '1'
    annotations:
      Extension: Basic
      Domain: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: CoverGlasses
  ImmersionLiquid:
    description: 'This element refers to the Immersion Liquid that was used with this Objective during the Acquisition of
      this Image. According to ISO 10934-1:2002, an Immersion Liquid is a liquid (commonly immersion oil, water, glycerol
      or any media in which the Specimen is submerged during acquisition in case a Cover Glass is not used) specified as suitable
      for use in the space between the front of an Objective lens and the Cover Glass or the Object itself (i.e., such as
      is the case for Dipping Objectives). Refer to ISO 8036-1 for more details on Immersion Oil. Please NOTE: Because the
      Immersion Liquid is considered in the computing of corrections to be part of the lens, its refractive index and dispersion
      (or Abbe number) are critical. Also please NOTE: In case a Cover Glass is not used during Acquisition the Immersion
      Liquid is most often referred to as Dipping Medium. Examples of Dipping Media include, water-based solutions (biological
      buffers, culture media, other water-based solutions) and organic-based [FocusClear (CLARITY); CUBIC-1, CUBIC-2, CUBIC-R1,
      CUBIC-R2; 2,2-thiodiethanol (TDE); ethyl cinnamate; Benzyl Benzoate and BB-PEG (PEGASOS); Benzyl Alcohol, Benzyl Benzoate
      (BABB); dibenzyl ether (DBE); Ethanol].'
    is_a: ManufacturerSpec
    attributes:
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Type:
        range: ImmersionLiquidType
        description: This field records the general category to which this Immersion Liquid belongs.
        annotations:
          Tier: '1'
      RefractiveIndex:
        range: float
        description: This field reocrds the nominal Refractive Index of this Immersion Liquid, as specified by the Manufacturer.
        annotations:
          Tier: '2'
      Viscosity:
        range: float
        description: This field records the nominal Viscosity of this Immersion Liquid as specified by the Manufacturer.
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: ImmersionLiquids
  MountingMedium:
    description: This element refers to the Mounting Medium that was used during the acquisition of this Image. According
      to ISO 10934-1:2002, a Mounting Medium is a liquid, synthetic resin or other medium in which this Specimen is placed
      during Image Acquisition. NOTE For fixed Samples observed by transmitted-light microscopy, this Medium is transparent,
      colourless and of specified refractive index, enclosed between the slide and the cover glass. For reflected-light microscopy,
      the mounting medium is normally a resin with which the Sample is impregnated so that a polished section may be made.
      For live Samples, the Medium is typically the tissue culture growth substrate.
    is_a: ManufacturerSpec
    attributes:
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Type:
        range: MountingMediumType
        description: This field records the general category to which this Mounting Medium belongs.
        required: true
        annotations:
          Tier: '2'
      RefractiveIndex:
        range: float
        description: This field reocrds the nominal Refractive Index of this Mounting Medium, as specified by the Manufacturer.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: MountingMediums
  Fluorophore:
    description: This element describes the Fluorophore whose Emission is used to produce this Channel. [plain text string].
    is_a: ManufacturerSpec
    attributes:
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: This field records a descriptive term that designates this Fluorophore as specified by the Manufacturer.
          For example, it might be the name of a specific Fluorescence Protein variant, or the name used by the Manufactuer
          for an organic dye.
        annotations:
          Tier: '1'
      Type:
        range: FluorescentLabelType
        description: This field records a term that describes the general category of the Fluorescent Label used in this case.
        annotations:
          Tier: '1'
      ExcitationWavelength:
        range: PositiveFloat
        description: This field records the Excitation Wavelength used for this Channel.
        annotations:
          Tier: '1'
      ExcitationWavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '1'
          description_source: derived from Fluorophore.ExcitationWavelength
        description: The unit of ExcitationWavelength.
      EmissionWavelength:
        range: PositiveFloat
        description: This field records the Emission Wavelength used for this Channel.
        annotations:
          Tier: '1'
      EmissionWavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '1'
          description_source: derived from Fluorophore.EmissionWavelength
        description: The unit of EmissionWavelength.
      Concentration:
        range: float
        description: If applicable (e.g., in the case of direct incubation of the sample  with a specific label such as DAPI
          or Mitotracker Red), this field records the Concentration of this Fluorophore that was used to stain the Sample
          and that was imaged in this Channel.
        annotations:
          Tier: '1'
      ConcentrationUnit:
        range: UnitsConcentration
        annotations:
          Tier: '1'
          description_source: derived from Fluorophore.Concentration
        description: The unit of Concentration.
      FBBaseID:
        range: string
        description: In case the Fluorophore is a Fluorescent Protein, this field records its FPBaseID (FPBase.org).
        annotations:
          Tier: '1'
      PrimaryPublicationID:
        range: string
        description: This field captures the a Unique Identifier for the Primary Publication describing this Fluorescent Label.
          Examples include, Digital Object Identifier (DOI), PubMed Central Identifier (PMCID), ArXiv.org ID etc.
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: Experimental
      Category: SamplePreparation
      Tier: '1'
      xsdfu_plural: Fluorophores
  AcquisitionSoftware:
    description: This element represents a commercial, or open-source Software, script, macro, plugin or module utilized for
      driving this Instrument during Image Acquisition.
    is_a: Software
    annotations:
      Extension: Basic
      Domain: MicroscopeSpecifications
      Category: Software
      Tier: '1'
      xsdfu_plural: AcquisitionSoftware tools
  SoftwareModule:
    description: This element represents a commercial, or open-source Software, script, macro, plugin or module utilized for
      any Image Acquisition, Image Analysis or Quality Control task.
    is_a: Software
    annotations:
      Extension: Basic
      Domain: MicroscopeSpecifications
      Category: Software
      Tier: '1'
      xsdfu_plural: SoftwareModules
  MicroscopeTable:
    description: This element describes the Table used to support this Instrument during Image Acquisition.
    is_a: ManufacturerSpec
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '2'
      MultipleMicroscopes:
        range: boolean
        description: This field records whether (True) or not (False) multiple Microscopes share this Microscope Table. This
          is relevant because multiple Microscopes using the same table might affect stability and vibrations during Image
          Acquisition.
        annotations:
          Tier: '2'
      Type:
        range: MicroscopeTableType
        description: This field describes the type of this Microscope Table.
        required: true
        annotations:
          Tier: '2'
      TableWidth:
        range: float
        description: The Width of this Microscope Table.
        annotations:
          Tier: '3'
      TableWidthUnit:
        range: UnitsLength
        ifabsent: string(cm)
        annotations:
          Tier: '3'
          description_source: derived from MicroscopeTable.TableWidth
        description: The unit of TableWidth.
      TableDepth:
        range: float
        description: The Depth of this Microscope Table.
        annotations:
          Tier: '3'
      TableDepthUnit:
        range: UnitsLength
        ifabsent: string(cm)
        annotations:
          Tier: '3'
          description_source: derived from MicroscopeTable.TableDepth
        description: The unit of TableDepth.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: MicroscopyAccessories
      Tier: '2'
      Model_Settings: MicroscopeTableSettings
      xsdfu_plural: MicroscopeTables
  EnvironmentalControlDevice:
    description: This element describes an Environmental Control Device available for this Instrument to maintain a controlled
      Imaging Environment during Imaging Environment.
    is_a: ManufacturerSpec
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      TemperatureControl:
        range: EnvironmentalControlMethod
        description: This field captures whether this Environmental Control Device provides Temperature control and what type
          of control it provides. If no Temperature control is provided please enter "None".
        required: true
        annotations:
          Tier: '1'
      HumidityControl:
        range: HumidityControlMethod
        description: This field captures whether this Environmental Control Device provides Humidity control and what type
          of control it provides. If no Humidity control is provided please enter None.
        required: true
        annotations:
          Tier: '1'
      CO2Control:
        range: CO2ControlMethod
        description: This field captures whether this Environmental Control Device provides CO2 control and what type of control
          it provides. If no CO2 control is provided please enter None.
        required: true
        annotations:
          Tier: '2'
      O2Control:
        range: boolean
        description: This field captures whether (True) or not (False) this Environmental Control Device provides vibration
          control.
        required: true
        annotations:
          Tier: '2'
      VibrationControl:
        range: boolean
        description: This field captures whether (True) or not (False) this Environmental Control Device provides O2 control.
        annotations:
          Tier: '2'
      StandCompatibility:
        range: EnvironmentalStandCompatibility
        description: This field captures what Microscope Stand type this Environmental Control Chamber is compatible with.
        required: true
        annotations:
          Tier: '2'
      Perfusion:
        range: boolean
        description: This field caputers whether (True) or not (False) this Environmental Control Device supports sample Perfusion.
        required: true
        annotations:
          Tier: '2'
      LidMaterial:
        range: string
        description: In case this Environmental Control Device consists of a Sample Holder Chamber, this field captures the
          Material that constitutes the Lid of the Chamber.
        annotations:
          Tier: '2'
      MaxTemperature:
        range: float
        description: This field captures the Maximum Temperature that can be stably maintained by this Environmental Control
          Device.
        required: true
        annotations:
          Tier: '3'
      MaxTemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '3'
          description_source: derived from EnvironmentalControlDevice.MaxTemperature
        description: The unit of MaxTemperature.
      MinTemberature:
        range: float
        description: This field captures the Minimum Temperature that can be stably maintained by this Environmental Control
          Device.
        required: true
        annotations:
          Tier: '3'
      MinTemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '3'
      TemperatureAccuracy:
        range: float
        description: This field captures the Temperature control Accuracy provided by this Environmental Control Device.
        annotations:
          Tier: '3'
      TemperatureAccuracyUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '3'
          description_source: derived from EnvironmentalControlDevice.TemperatureAccuracy
        description: The unit of TemperatureAccuracy.
      TTL:
        range: boolean
        description: This field captures whether (True) or not (False) this Environmental Control Device can be controlled
          by a TTL signal.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: MicroscopyAccessories
      Tier: '1'
      Model_Settings: ImagingEnvironment
      xsdfu_plural: EnvironmentalControlDevices
  StageInsert:
    description: This element describes an optional Stage Insert mounted on the Stage.
    is_a: ManufacturerSpec
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        required: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: StageInsertID
        description: A Unique Identifier for this component.
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '2'
      SampleHolderType:
        range: SampleHolderType
        description: This field describes the type of Specimen Holder this Stage Insert is designed to hold.
        required: true
        annotations:
          Tier: '2'
      TemperatureControlled:
        range: boolean
        description: This field records whether this Stage Insert is Temperature Controlled (True), or not (False).
        required: true
        annotations:
          Tier: '2'
      NumberOfSlots:
        range: integer
        minimum_value: 1
        description: This field describes the number of Specimen Holder slots on this Stage Insert.
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: SamplePositioning.Stage
      Tier: '1'
      xsdfu_plural: StageInserts
  Z-Drive:
    description: This element describes a Focusing Device designed to electronically control a moving a mechanical part of
      the Microscope such as the Stage (see Stage-APE), or the Microscope Stand itself (e.g. most dissecting Microscopes).
      An example of such devices is the MFC-2000 Z-Axis Drive and Controller (http://www.asiimaging.com/controllers/mfc-2000-z-axis-drive-and-controller/#tab-id-4).
    is_a: SamplePositioning
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: SamplePositioning.Focusing
      Tier: '2'
      Model_Settings: SamplePositioningSettings
      xsdfu_plural: Z-Drives
  TurretObjectiveFocusing:
    description: A Focusing mechanism is used to obtain maximum sharpness in an Image by changing the distance between a Sample
      and the optical system forming the Image. In most cases, a Z-axis Focusing mechanism moves the Objective along the optical
      axis. This element describes a Focusing Device associated with a rotating Objective Turret associated with this Instrument.
      This type of device is often operated using a rack and pinion mechanism.
    is_a: FocusingDevice
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: SamplePositioning.Focusing
      Tier: '1'
      Model_Settings: SamplePositioningSettings
      xsdfu_plural: TurretObjectiveFocusingDevices
  IndividualObjectiveFocusing:
    description: A Focusing mechanism is used to obtain maximum sharpness in an Image by changing the distance between a Sample
      and the optical system forming the Image. In most cases, a Z-axis Focusing mechanism moves the Objective along the optical
      axis. This element describes an optional objective nano-Focusing Device associated with this Instrument. These devices
      might be driven using piezoelectric mechanisms or linear motor actuators associated with crossed roller guideways. They
      typically achieve higher precision, accuracy, and speed than traditional Focusing Devices.
    is_a: FocusingDevice
    attributes:
      PiezoElectric:
        range: boolean
        description: This field describes whether this device is Piezoelectric driven (True) or not (False).
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: SamplePositioning.Focusing
      Tier: '1'
      Model_Settings: SamplePositioningSettings
      xsdfu_plural: IndividualObjectiveFocusingDevices
  MechanicalStage:
    description: This element describes a Stage fitted with ball-screw drives or rack mechanisms (sometimes equipped with
      precision calibration) to primarily assist in the translational movement of the Sample in the X and Y directions. A
      Mechanical Stage may be built into the Microscope Stand or it may consist of a removable insert. It may be manually
      operated, or it might be driven by linear electrodynamic motors, such as for example, in computer-controlled digital
      Microscopes. In some rare cases, a Mechanical Stage might also be used for Focusing (Z-axis movement), i.e., in simple
      surveying Microscopes.
    is_a: Stage
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: SamplePositioning.Stage
      Tier: '1'
      Model_Settings: SamplePositioningSettings
      xsdfu_plural: MechanicalStages
  PiezoElectricStage:
    description: This describes an optional piezoelectric-driven sample nano-positioning device associated with this Instrument.
      These devices typically achieve higher precision, accuracy and speed with respect to traditional Mechanical Stages.
    is_a: Stage
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: SamplePositioning.Stage
      Tier: '1'
      Model_Settings: SamplePositioningSettings
      xsdfu_plural: PiezoElectricStages
  FocusStabilizationDevice:
    description: This element describes an optional focus stabilization device (also known as, Auto Focus) that may be used
      for bringing an object automatically into focus for this instrument. Such devices can be controlled either via an imaging
      software and/or by a hardware device that detects and adjusts the objective or sample positions.
    is_a: ManufacturerSpec
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '1'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: FocusStabilizationID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Mechanism:
        range: FocusStabilizationMechanism
        description: This field refers to the mechanism employed by this Focus Stabilization Device. Software (also referred
          to as Image) based methods rely on the acquisition of a Z-series of images followed by image analysis to determine
          the best focal position based primarily on contrast comparisons. Hardware based methods rely on an external light
          beam (typically infrared) that is reflected off the coverslip and whose reflection is measured to determine and
          correct the focal offset of the sample.
        required: true
        annotations:
          Tier: '1'
      Algorithm:
        range: string
        description: In case this Focus Stabilization Device is Software Based, this field refers to the name of the Algorithm
          used to maintain Focus.
        annotations:
          Tier: '1'
      TwoStep:
        range: boolean
        description: This field records whether this Focus Stabilization Device utilizes a 2-step progressive procedure (True)
          or not (False).
        annotations:
          Tier: '1'
      Wavelength:
        range: float
        description: This field refers to the Wavelength of the beam that is relevant for this Focus Stabilization Device.
          For example this might represent the Wavelength of the beam that is reflected against the Coverglass to obtain a
          measurement of the focal offset of the sample at a given time during Acquisition.
        annotations:
          Tier: '1'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: SamplePositioning.Focusing
      Tier: '1'
      xsdfu_plural: FocusStabilizationDevices
  MultiLaserEngine:
    description: This element describes a Light Source device that contains multiple Lasers built into a single box. This
      element contains Reference(s) to individual Laser components built separately and assembled as part of this device.
    is_a: LightSource
    attributes:
      Laser:
        inlined: false
        annotations:
          xsd_element: LaserRef
        multivalued: true
        required: true
        description: This empty element refers to an existing Laser component.
        range: Laser
      SingleMode:
        range: boolean
        description: Whether the output mode of this Multi Laser Engine is single-mode (True) or multi-mode (False).
        annotations:
          Tier: '2'
      NumberOfLasers:
        range: integer
        description: This field records the number of Laser lines associated with this Multi Laser Engine.
        annotations:
          Tier: '2'
      OutputPortNumber:
        range: integer
        description: This field records the number of Light Guide ports used as output by this Multi Laser Engine.
        annotations:
          Tier: '3'
      MultiportSwitchTime:
        range: float
        description: This field records the time it takes for this Multi Laser Engine to switch between Laser lines.
        annotations:
          Tier: '3'
      MultiportSwitchTimeUnit:
        range: UnitsTime
        ifabsent: string(ms)
        description: The unit of MultiportSwitchTime.
        annotations:
          description_source: derived from MultiLaserEngine.MultiportSwitchTime
    annotations:
      Extension: Advanced
      Domain: MicroscopeHardwareSpecifications
      Category: LightSource
      Tier: '2'
      Split: '[Fluorescence_LightSource]'
      Model_Settings: LightSourceSettings
      xsdfu_plural: MultiLaserEngineDevices
    slot_usage:
      Role:
        range: FluorescenceLightSourceRole
  FreeBeam:
    description: A Free Beam coupling between the Light Source and the Microscope Stand consists of either a direct mount
      or an optical path that directs light across free space to the back of the Microscope Stand.
    is_a: LightSourceCoupling
    attributes:
      DirectMount:
        range: boolean
        description: Whether light traveling via this Light Source Coupling device from the Light Source to the Microscope
          Stand travels via a direct mount attached to the Microscope Stand (True), or across an optical path through the
          air (False).
        required: true
        annotations:
          Tier: '2'
      MountType:
        range: string
        description: In case the DirectMount field is True, this field records the type of Direct Mount utilized to couple
          the Light Source to this Microscope Stand.
        required: true
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: LightSourceCoupling
      Tier: '2'
      xsdfu_plural: FreeBeamDevices
  LightGuide:
    description: A Light Guide coupling between the Light Source and the Microscope Stand generally consists of a casing enclosing
      a medium (i.e., typically fiber optic) capable of transferring light from the illuminator to the back of the Microscope
      Stand.
    is_a: LightSourceCoupling
    attributes:
      WavelengthRange:
        range: WavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a range of Wavelengths this component is designed for, according to the Manufacturer.
          Multiple of this element may be used.
        annotations:
          Extension: Basic
          Domain: MicroscopeHardwareSpecifications
          Category: ChildElement
          Tier: '3'
      Type:
        range: LightGuideType
        description: This field records the general category of Light Guide used in this case.
        required: true
        annotations:
          Tier: '2'
      RefractiveIndex:
        range: float
        description: This field records the Refractive Index of the material used to construct this Light Guide.
        annotations:
          Tier: '3'
      NumericalAperture:
        range: float
        description: The Numerical Aperture (NA) of this device expressed as a floating-point (real) number. NA can be calculated
          from the Angular Aperture (alpha) using the following formula, NA = n(sin alpha), and is a measure of how much of
          the incident light actually passes through this device. The larger the angular aperture, the more information this
          device can transmit. Expected range 0.02 - 1.5.
        required: true
        annotations:
          Tier: '3'
      AcceptanceAngle:
        range: float
        description: The angle within which the light beam produced by a Light Source may be coupled with the bound modes
          of this Light Guide.
        annotations:
          Tier: '3'
      AcceptanceAngleUnit:
        range: UnitsAngle
        ifabsent: string(deg)
        annotations:
          Tier: '3'
          description_source: derived from LightGuide.AcceptanceAngle
        description: The unit of AcceptanceAngle.
      Geometry:
        range: LightGuideGeometry
        description: This field records the cross-section shape of this Light Guide.
        annotations:
          Tier: '3'
      MaterialName:
        range: LightGuideMaterialName
        description: This field records the chemical composition or the non-proprietary trade designation of the material
          used to construct this Light Guide.
        annotations:
          Tier: '3'
      SingleMode:
        range: boolean
        description: This field records whether (True) this Light Guide is single-mode. If not (False), then the guide is
          assumend to be multi-modal.
        annotations:
          Tier: '3'
      WaveguideMode:
        range: LightGuideWaveguideMode
        description: This field records the transverse mode (or superposition of such modes) that are being imposed by this
          light guide onto the light wave traversing it. These modes generally follow different propagation constants.
        annotations:
          Tier: '3'
      Diameter:
        range: float
        description: This fields records the outer diameter of this Light Guide.
        annotations:
          Tier: '3'
      DiameterUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from LightGuide.Diameter
        description: The unit of Diameter.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: LightSourceCoupling
      Tier: '2'
      xsdfu_plural: LightGuideDevices
  BeamCollimator:
    description: Beam Collimators are Lens Systems that transform a strongly diverging light beam into a collimated beam,
      i.e., a beam where light propagates essentially only in one direction, and the beam divergence is weak. Beam Collimators
      typically contain some kind of Focusing Lens, or sometimes a curved Mirror, and usually some opto-mechanics for stable
      mounting and possibly adjustment. Beam Expanders can be custom built or they are also available as pre-assembled optical
      devices.
    is_a: OpticalAssembly
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticalAssembly
      Tier: '2'
      xsdfu_plural: BeamCollimatorDevices
  BeamExpander:
    description: Beam Expanders are Lens Systems whose role is to increase the diameter of a collimated input beam to a larger
      collimated output beam. Beam Expanders typically are afocal systems in which object rays enter and exit parallel to
      the optical axis. As such a Beam Expander does not have a focal length. In most cases, Beam Expanders are realized as
      optical telescopes consisting of two lenses. Beam Expanders can be custom built or they are also available as pre-assembled
      optical devices.
    is_a: OpticalAssembly
    attributes:
      Configuration:
        range: BeamExpanderConfiguration
        description: This field captures the Configuration of this Beam Expander.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticalAssembly
      Tier: '2'
      xsdfu_plural: BeamExpanderDevices
  Condenser:
    description: Condensers are Lens Systems located above the Light Source and under the sample in an Upright Microscope,
      and above the stage and below the Light Source in an Inverted Microscope. They act to gather light from the Light Source
      and concentrate it into a cone of light that illuminates the specimen. They typically include a Turret system and Diaphragms.
      The aperture and angle of the light cone must be adjusted (via the size of the Diaphragm) for each different Objective.
    is_a: OpticalAssembly
    attributes:
      Correction:
        range: CondenserCorrection
        description: This field captures any type of Aberration (i.e., failure of an optical system to produce a perfect image)
          this Condenser is design to correct.
        annotations:
          Tier: '1'
      Type:
        range: CondenserCategory
        description: 'This field captures the general category this Condenser belongs to according to ISO 10934-1:2002. Specifically,
          this category refers to the type of Correction or Contrast Enhancement Method this Condenser is designed to achieve.
          According to ISO 10934-1:2002, options include: 1) Abbe, this is a condenser of simple design introduced by Abbe,
          in which there is only limited correction for spherical aberration and none for chromatic aberration. 2) Achromatic-aplanatic,
          this is a in which chromatic aberrations and spherical aberrations have been reduced. 3) Cardioid, this is a dark
          field condenser for transmitted light illumination that has spherical aberration and coma (i.e., aberration in which
          the image of an off-axis point object is deformed so that the image is shaped like a comet) correction. 4) Dark-field,
          this is a dark-ground condenser designed for dark-field microscopy, which for reflected-light microscopy might be
          located within the mount of the objective. 5) Pancratic, this is a condenser containing a variable “zoom” (pancratic)
          lens which allows the size of the illuminated field at the object to be varied while the illuminated field diaphragm
          remains of constant size. 6) Phase-contrast, this is condenser designed for phasecontrast microscopy. 6) Universal,
          this is a condenser designed for multiple contrast methods such as bright field, dark field, phase contrast, differential
          interference contrast, polarized light and modulation contrast.'
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticalAssembly
      Tier: '1'
      xsdfu_plural: Condensers
  MicroscopeTube:
    description: Illumination Tubes are Lens systems, which might be embedded within the Microscope Stand and therefore not
      immediately accessible. They are essential for infinity-correction and should be regarded as integral parts of the Objective
      Lens System when magnification and correction are considered.
    is_a: OpticalAssembly
    attributes:
      Type:
        range: MicroscopeTubeType
        description: This field captures the category of this Tube.
        required: true
        annotations:
          Tier: '2'
      MechanicalLength:
        range: float
        description: For Objectives corrected for a finite primary Image distance, this is the length of the Tube in its simplest
          form, and it corresponds to the distance in air between the Objective and the Camera port. It commonly has a value
          of 160 mm (ISO 9345-1). For infinity-corrected objectives, the mechanical tube length is hypothetically considered
          to be infinite.
        annotations:
          Tier: '3'
      MechanicalLengthUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from MicroscopeTube.MechanicalLength
        description: The unit of MechanicalLength.
      OpticalLength:
        range: float
        description: This is the distance between the back focal Plane of the Objective and the primary Image Plane. This
          distance is relevant only when using finite primary Image distance Objectives.
        annotations:
          Tier: '3'
      OpticalLengthUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from MicroscopeTube.OpticalLength
        description: The unit of OpticalLength.
      Factor:
        range: float
        description: Factor (q) by which the lateral Magnification at the primary Image is changed by an intermediate Lens
          or Lens System inserted between the Objective and the primary Image.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticalAssembly
      Tier: '2'
      xsdfu_plural: MicroscopeTubes
  FilterCube:
    description: A Filter Cube is a removable cube-shaped unit that containing the filters and mirror used in epi-fluorescence
      microscopy to separate fluorescence excitation and emission light. It usually holds a matched set of fluorescence filters,
      which might include an Excitation filter and Emission filter but always includes a Dichroic mirror. A Filter Cube might
      be pre-assebled by the Manufacturer and pruchased as a whole or it might be custom assembled on site depending on the
      needs of the user.
    is_a: OpticsHolder
    attributes:
      ExcitationFilter:
        inlined: false
        annotations:
          xsd_element: ExcitationFilterRef
        description: This field refers to an available Excitation Filter, which is part of this Filter Cube.
        range: Filter
      StandardDichroic:
        inlined: false
        annotations:
          xsd_element: StandardDichroicRef
          Tier: '1'
        description: This field refers to an available Dichroic Mirror, which is part of this Filter Cube.
        range: MirroringDevice
      EmissionFilter:
        inlined: false
        annotations:
          xsd_element: EmissionFilterRef
        description: This field refers to an available Emission Filter, which is part of this Filter Cube.
        range: Filter
      OpticsHolderPosition:
        range: string
        description: When relevant, this field records the position of this Filter Cube in a Optics Holder.
        annotations:
          Tier: '2'
    annotations:
      Extension: Core
      Domain: MicroscopeHardwareSpecifications
      Category: FluorescenceLightPath
      Tier: '1'
  FilterCubeTurret:
    description: This element represents a circular holder for multiple Filter Cubes.
    is_a: OpticsHolder
    attributes:
      FilterCube:
        inlined: false
        annotations:
          xsd_element: FilterCubeRef
        multivalued: true
        required: true
        maximum_cardinality: 6
        description: This field refers to an available FilterCube, which is housed in this Optics Holder.
        range: FilterCube
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '1'
  ExcitationFilterWheel:
    description: This element represents a circular holder for multiple individual Excitation Filters.
    is_a: FilterWheel
    attributes:
      ExcitationFilter:
        inlined: false
        annotations:
          xsd_element: ExcitationFilterRef
        multivalued: true
        required: true
        description: This field refers to an available Excitation Filter, which is part of this Filter Cube.
        range: Filter
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '1'
  DichroicFilterWheel:
    description: This element represents a circular holder for multiple individual Dichroics.
    is_a: FilterWheel
    attributes:
      StandardDichroic:
        inlined: false
        annotations:
          xsd_element: StandardDichroicRef
        multivalued: true
        description: This field refers to an available Dichroic Mirror, which is part of this Filter Cube.
        range: MirroringDevice
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '1'
  EmissionFilterWheel:
    description: This element represents a circular holder for multiple individual Emission Filters.
    is_a: FilterWheel
    attributes:
      EmissionFilter:
        inlined: false
        annotations:
          xsd_element: EmissionFilterRef
        multivalued: true
        description: This field refers to an available Emission Filter, which is part of this Filter Cube.
        range: Filter
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '1'
  ExcitationFilterSlider:
    description: This element represents a linear holder for multiple individual Excitation Filters.
    is_a: FilterSlider
    attributes:
      ExcitationFilter:
        inlined: false
        annotations:
          xsd_element: ExcitationFilterRef
        multivalued: true
        required: true
        description: This field refers to an available Excitation Filter, which is part of this Filter Cube.
        range: Filter
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '1'
  DichroicFilterSlider:
    description: This element represents a linear holder for multiple individual Dichroics.
    is_a: FilterSlider
    attributes:
      StandardDichroic:
        inlined: false
        annotations:
          xsd_element: StandardDichroicRef
        multivalued: true
        required: true
        description: This field refers to an available Dichroic Mirror, which is part of this Filter Cube.
        range: MirroringDevice
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '1'
  EmissionFilterSlider:
    description: This element represents a linear holder for multiple individual Emission Filters.
    is_a: FilterSlider
    attributes:
      EmissionFilter:
        inlined: false
        annotations:
          xsd_element: EmissionFilterRef
        multivalued: true
        required: true
        description: This field refers to an available Emission Filter, which is part of this Filter Cube.
        range: Filter
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '1'
  OpticsTurret:
    description: This element represents a circular holder for multiple optical elements.
    is_a: OpticsHolder
    attributes:
      Lens:
        inlined: false
        annotations:
          xsd_element: LensRef
        multivalued: true
        description: This refers to an available Lens, which is part of this Optical Assembly.
        range: Lens
      MirroringDevice:
        inlined: false
        annotations:
          xsd_element: MirroringDeviceRef
        multivalued: true
        description: This refers to an available Mirroring Device, which is part of this Optical Assembly.
        range: MirroringDevice
      Aperture:
        inlined: false
        annotations:
          xsd_element: ApertureRef
        multivalued: true
        description: This refers to an available Optical Aperture, which is part of this Optical Assembly.
        range: OpticalAperture
      Filter:
        inlined: false
        annotations:
          xsd_element: FilterRef
        multivalued: true
        description: This empty element refers to any Generic or Neutral Density Filter component placed in this Light Path.
        range: Filter
      Prism:
        inlined: false
        annotations:
          xsd_element: PrismRef
        multivalued: true
        description: This refers to an available Prism, which is part of this Optical Assembly.
        range: Prism
      PolarizationOptics:
        inlined: false
        annotations:
          xsd_element: PolarizationOpticsRef
        multivalued: true
        description: This refers to an available Polarization Optics, which is part of this Optical Assembly.
        range: PolarizationOptics
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: OpticsHolder
      Tier: '2'
  DarkFieldStop:
    description: This element refers to a central circular stop (i.e., opaque disk) usually used in dark-field microscopy
      and placed in the front focal Plane of a Condenser to occlude all the direct light which would fall within the aperture
      of the objective.
    is_a: OpticalAperture
    attributes:
      CenterStopDiameter:
        range: float
        description: This field captures the physical diameter of the central disk of this Dark Field Stop.
        annotations:
          Tier: '3'
      CenterStopDiameterUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from DarkFieldStop.CenterStopDiameter
        description: The unit of CenterStopDiameter.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '2'
  PhaseRing:
    description: This element (also called Phase Annulus) refers to an annular (ring-like) slit used to produce contrast modulation
      following Zernike, in which the Image contrast of a phase object is enhanced by altering the phase and amplitude of
      the direct light with respect to those of the diffracted light. This illuminating aperture Diaphragm is placed in the
      front focal Plane of the Condenser and acts in conjunction with an appropriate phase plate, usually in the form of an
      annulus, placed in the back focal Plane of the objective (or in a succeeding Plane conjugate with this).
    is_a: OpticalAperture
    attributes:
      PhaseNumber:
        range: PhaseRingNumber
        description: This field captures the Phase Number used to identify the size of the annular slit of this Phase Ring.
          The Phase Number must match the Phase Plate found within a Phase-contrast capable Objective lens.
        required: true
        annotations:
          Tier: '1'
      CenterStopDiameter:
        range: float
        description: This filed records the physical diameter of the center-stop (i.e. opaque disk) of this Phase Ring.
        annotations:
          Tier: '3'
      CenterStopDiameterUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from PhaseRing.CenterStopDiameter
        description: The unit of CenterStopDiameter.
      SlitWidth:
        range: PositiveFloat
        description: This field records the physical width of the annular slit of this Phase Ring.
        annotations:
          Tier: '3'
      SlitWidthUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '3'
          description_source: derived from PhaseRing.SlitWidth
        description: The unit of SlitWidth.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '1'
  HoffmanPlate:
    description: This element represents a Plate that contains an off-axis slit aperture positioned in the front focal plane
      of the Condenser. It is used alongside a Hoffman contrast modulator (i.e., optical amplitude spatial filter) present
      in the back focal plane of the objective or in a succeeding conjugate plane to produce contrast modulation as described
      by Hoffman (i.e., Hoffman Contrast Modulation, HMC). Hoffman modulation contrast is not hampered by the use of birefringent
      materials (such as plastic Petri dishes) in the optical pathway, so the technique is more useful for examining specimens
      in containers constructed with polymeric materials.
    is_a: OpticalAperture
    attributes:
      Design:
        range: HoffmanPlateSlitDesign
        description: This field captures the design of the slit of this Hoffman Plate.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '2'
  IrisDiaphragm:
    description: This element represents a Diaphragm, positioned trasversally to the optical axis bounded by multiple leaves,
      usually metal, arranged so as to provide an opening of variable size, which is adjustable by means of a mechanical control.
    is_a: OpticalAperture
    attributes:
      MaxApertureDiameter:
        range: float
        description: This field records the Maximum physical Diameter of the Aperture of this Iris Diaphragm.
        annotations:
          Tier: '2'
      MaxApertureDiameterUnit:
        range: UnitsLength
        ifabsent: string(mm)
        annotations:
          Tier: '2'
          description_source: derived from IrisDiaphragm.MaxApertureDiameter
        description: The unit of MaxApertureDiameter.
      Shape:
        range: IrisShape
        description: This field captures the Shape of the aperture of this Iris Diaphragm.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '2'
  VarelRing:
    description: This element represents a stop (i.e., opaque structure) shaped like a ring sector, which is used on the illumination
      side, to permit unilateral inclined illumination. It was developed to work in combination with Phase Objectives to yield
      contrast even when light passes through birefringent materials, such as plastic Petri dishes.
    is_a: OpticalAperture
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '2'
  Shutter:
    description: This element describes a Shutter available for this Instrument. Shutters are devices that open and close,
      and they may be mechanically or electro-mechanically controlled. Shutters are typically used to control the Light that
      raches the sample (i.e., to limit phototoxicity and photobleaching especially in case of live specimens), or the Detecrtor
      at any one time. They can also be used for Excitation or Emission Wavelength selection.
    is_a: OpticalAperture
    attributes:
      ResponseTime:
        range: float
        description: This field (also known as Speed) records the time it takes for this Shutter to completely open and close,
          according to the Manufacturer.
        annotations:
          Tier: '1'
      ResponseTimeUnit:
        range: UnitsTime
        annotations:
          Tier: '1'
          description_source: derived from Shutter.ResponseTime
        description: The unit of ResponseTime.
      Function:
        range: ShutterFunction
        description: This field records whether this Shutter is used for the control of illumination (especially relevant
          for live imaging), the selection of Excitation or Emission wavelenghts or the control of the Light that reaches
          the Detector.
        annotations:
          Tier: '2'
      OperatingFrequency:
        range: float
        description: This field records the Frequency of Operation of this Shutter, according to the Manufactuers.
        annotations:
          Tier: '2'
      OperatingFrequencyUnit:
        range: UnitsFrequency
        annotations:
          Tier: '2'
          description_source: derived from Shutter.OperatingFrequency
        description: The unit of OperatingFrequency.
      Motorized:
        range: boolean
        description: This field describes whether this device is Motor (True) or Manually (False) operated.
        annotations:
          Tier: '2'
      MaxApertureDiameter:
        range: float
        description: This field records the Maximum physical Diameter of the Aperture of this Shutter.
        annotations:
          Tier: '2'
      MaxApertureDiameterUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from Shutter.MaxApertureDiameter
        description: The unit of MaxApertureDiameter.
      Multimode:
        range: boolean
        description: 'This field records whether (True) multiple operation modes are available for this Shutter or not (False).
          Typical operation modes are are: Fast, Soft and Neutral Density. The Fast mode provides the quickest open and close
          action sequence for which the shutter is capable. The Soft mode gradually opens and closes the shutter to reduce
          vibration. Control of light intensity without affecting wavelength is accommodated by a Neutral Density shutter
          mode (for more details see https://www.microscopyu.com/applications/live-cell-imaging/the-automatic-microscope).'
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '1'
      Model_Settings: ShutterSettings
  NeutralDensityFilter:
    description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
      direction, and/or intensity of the radiation which it transmits or reflects. This element refers to an optical Filter
      whose purpose is to attenuate the intensity of the transmitted Light independent of the Wavelength.
    is_a: Filter
    attributes:
      NDType:
        range: NDTYPE
        description: This field refers to the general category of this Neutral Density Filter. Neutral Density Filters come
          in two general types. Those made of darkened glass that absorb light and those coated with a metal film that reflect
          light.
        required: true
        annotations:
          Tier: '2'
      OpticalDensity:
        range: float
        description: This field measures the absolute value of the logarithm of base 10 of the power transmission factor.
          For example, an optical density of 3 means an attenuation of optical powers by the factor 10^3 = 1000.
        required: true
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Filter
      Tier: '1'
  GenericFilter:
    description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
      direction, and/or intensity of the radiation which it transmits or reflects. This element refers to a Generic Filter
      positioned along the Light Path in addition to the canonical fluorescence Excitation and the Emission Filters.
    is_a: Filter
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Filter
      Tier: '1'
  GenericDichroic:
    description: A Dichroic Mirror (also often referred to as Dichroic Beamsplitter or simply as Dichroic) is a Mirror that
      spectrally separate light by transmitting and reflecting light as a function of wavelength. In the context of fluorescence
      microscopy, they are typically used to reflect the excitation light, but transmit the emitted fluorescence. Dichroic
      Mirrors can be categorized in different manners. However, the most important criteria for choosing a Dichoric Mirror
      are the Transmittance and the Reflectance Wavelength ranges. This element describes an additional Generic Dichroic positioned
      in the Ligth Path for one or more Channel available for this Instrument.
    is_a: Dichroic
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: MirroringDevice
      Tier: '1'
      Model_Settings: MirroringDeviceSettings
      xsdfu_plural: Dichroics
  BeamSplitter:
    description: This element describes a Mirror that reflects part of the light, regardless of wavelength.
    is_a: MirroringDevice
    attributes:
      ReflectanceProfileFile:
        range: ReflectanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Reflectance profile of
          this optical component.
      Transmittance:
        range: float
        description: The field records the maximum amount of light this Beamsplitteris capable of transmitting at the peak
          Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        required: true
        annotations:
          Tier: '2'
      TransmittanceProfileFileElement:
        range: TransmittanceProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element represents a file in .csv or other suitable formats containing the Transmittance profile
          of this optical component.
        annotations:
          xsd_element: TransmittanceProfileFile
      TransmittanceProfileFile:
        range: uri
        description: This field records the location of a file in .csv or other suitable formats containing the Transmittance
          profile of this optical component.
        annotations:
          Tier: '3'
      TransmissionAngle:
        range: float
        description: The angle at which light is transmitted by this Beamsplitter.
        annotations:
          Tier: '3'
      TransmissionAngleUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from BeamSplitter.TransmissionAngle
        description: The unit of TransmissionAngle.
      Reflectance:
        range: float
        description: The field records the maximum amount of light this Beamsplitteris capable of reflecting at the peak Wavelength.
          It is represented as a fractional value from 0.0 to 1.0.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: MirroringDevice
      Tier: '2'
      Model_Settings: MirroringDeviceSettings
  ReflectingMirror:
    description: This element describes a total reflection Mirror.
    is_a: MirroringDevice
    attributes:
      ReflectanceProfileFile:
        range: ReflectanceProfileFile
        inlined: true
        required: true
        description: This element represents a file in .csv or other suitable formats containing the Reflectance profile of
          this optical component.
      Reflectance:
        range: float
        description: The field records the maximum amount of light this Mirror is capable of reflecting at the peak Wavelength.
          It is represented as a fractional value from 0.0 to 1.0.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: MirroringDevice
      Tier: '2'
      Model_Settings: MirroringDeviceSettings
  MagnificationChanger:
    description: A Magnification Changer (also known as Optovar because one of the first magnification changing devices was
      developed by Zeiss and given this proprietary Name) provides additional magnification that can be beneficial when a
      desired field of view is required for the imaging sensor. Magnification Changers are placed before the Tube Lens within
      the infinity space of the optical system. Typical magnification increments are 1.25x, 1.6x, and 2x.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '1'
  GenericLens:
    description: This element refers to any additional Generic Lens positioned in the Light Path for a given Channel.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '2'
  BeamExpanderLens:
    description: A Beam Expander Lens is a Lens designed to work in combination with other optical components to form a Beam
      Expander device. As such, its role is to increase the diameter of a collimated input beam to a larger collimated output
      beam.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '2'
  BeamCollimatorLens:
    description: A Beam Collimator Lens is a Lens designed to work in combination with other optical components to form a
      Beam Collimator device. As such, its role is to transform a strongly diverging light beam into a collimated beam, i.e.,
      a beam where light propagates mainly only in one direction, and the beam divergence is weak.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '2'
  CondenserLens:
    description: A Condenser Lens renders a divergent beam from a point source into a parallel or converging beam to illuminate
      an object. It acts to gather light from the Light Source and concentrate it into a cone of light that illuminates the
      specimen. The aperture and angle of the light cone must be adjusted (via the size of the diaphragm) for each different
      objective Lens with different numerical apertures. Conserser Lenses are typically housed within a specific component
      of the Microscope called the Condenser.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '1'
  CouplingLens:
    description: This element refers to a Lens positioned at the mount connecting the Light Source Coupling device and the
      Microscope Stand.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '2'
  RelayLens:
    description: A Relay Lens is often used in combination with other Lenses for transferring an Image into a different optical
      plane. A typical example of Relay Lens is the Lens positioned at the mount connecting a Detector with the Microscope
      Stand.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '1'
  TubeLens:
    description: A Tube Lens is an intermediate Lens, located within the Microscope's Illumination Tube, which is designed
      to operate as an essential component of infinity-corrected Objectives, and which should be regarded as an integral part
      of the Objective lens system when magnification and correction are considered. In some Microscope Tubes, Lenses might
      be located within the Microscope Stand and might not be immediately accessible.
    is_a: Lens
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '2'
  PolarizationOptics:
    description: This element describes a Polarization device positioned in the Ligth Path for this Instrument. A Polarization
      device is an optical filter rotatable through 360° that lets light waves of a specific polarization pass through while
      blocking light waves of other polarizations. This element can be associated with an optional Optics Turret.
    is_a: ManufacturerSpec
    attributes:
      WavelengthRange:
        range: ComponentWavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the Range of Wavelengths this device is designed for, according to the Manufacturer.
          Multiple of this element may be used.
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: ChildElement
          Tier: '3'
          xsdfu_plural: WavelengthRanges
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: PolarizationOpticsID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      Function:
        range: PolarizationOpticsFunction
        description: This field records whether this Polarization Optics is used to generate (Polarizer) or to analyze (Analyzer)
          polarized light.
        required: true
        annotations:
          Tier: '1'
      CrossPolarizer:
        range: boolean
        description: This field records whether (True) or not (False) this Polarization Optics is a combination of an Analyzer
          and a Polarizer positioned orthogonal to each other.
        required: true
        annotations:
          Tier: '2'
      DIC:
        range: boolean
        description: This field records whether (True) or not (False) this PolarizationOptics is used for Differential Interference
          Contrast (DIC) microscopy.
        required: true
        annotations:
          Tier: '2'
      BeamSplitter:
        range: boolean
        description: This field records whether (True) or not (False) this is PolarizationOptics has a beam splitter function.
        annotations:
          Tier: '2'
      FaradayIsolator:
        range: boolean
        description: This field records whether (True) or not (False) this PolarizationOptics is a Fraday Isolator. A Faraday
          Isolator is an optical component which allows light to pass through in only ONE direction and therefore protects
          laser systems against back reflection. It uses the Faraday magneto-optical effect to turn the polarization of light
          between various polarizers.
        annotations:
          Tier: '2'
      Construction:
        range: PolarizationOpticsConstruction
        description: This field records the modality with which this PolarizationOptics is constructed.
        annotations:
          Tier: '2'
      Retardation:
        range: PolarizationOpticsRetardation
        description: This field records the Phase shift that exists between the polarized light component projected along
          the fast axis and the part projected along the slow axis.
        annotations:
          Tier: '2'
      Fabrication:
        range: PolarizationOpticsFabrication
        description: This field records the way in with which this PolarizationOptics is fabricated.
        annotations:
          Tier: '3'
      MaterialName:
        range: OpticalMaterialName
        description: This field records the chemical composition or designation of the Material this Polarization Optics is
          made of.
        annotations:
          Tier: '3'
      GlassCode:
        range: string
        description: If available, this field records the international Glass Code of the material that constitutes this Lens.
          The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying
          the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken
          at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three
          digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass
          Code of 517642.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: AdditionalOptics
      Tier: '1'
  Prism:
    description: This element describes a Prism positioned in the Light Path for one or more Channels available for this Instrument.
      A Prism is a block of glass or other transparent material with at least two intersecting flat, polished surfaces, used
      to disperse light or deviate it through an angle. A Prism can be viewed as an ensemble of different rigidly mounted
      Mirrors, with each face having a permanent orientation with respect to others. A Prism can be employed to deflect or
      deviate a light beam, rotate or invert an Image, separate polarization states, or disperse light into its component
      Wavelengths. An Instrument may have several Prisms with different functionality such as Polarizing, Reflecting, or Refracting
      (or Dispersing). Polarizing Prisms are birefringent crystals that divide incident non-polarized light into separate
      components polarized orthogonally to each other. Reflecting Prisms are useful for redirecting light beams by total internal
      reflection. Refracting (or Dispersing) Prisms can be employed to bend and separate light into its component colors.
      This element can be associated with an optional Optics Turret.
    is_a: ManufacturerSpec
    attributes:
      WavelengthRange:
        range: ComponentWavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the Range of Wavelengths this device is designed for, according to the Manufacturer.
          Multiple of this element may be used.
        annotations:
          Domain: MicroscopeHardwareSpecifications
          Category: ChildElement
          Tier: '3'
          xsdfu_plural: WavelengthRanges
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: PrismID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '1'
      DIC:
        range: DICPrismType
        description: This field records whether this Prism is used for Differential Interference Contrast (DIC) microscopy
          and, if so, what DIC-compatible type it is (i.e., deSenarmont, Nomarski or Wollaston).
        annotations:
          Tier: '1'
      Function:
        range: PrismFunction
        description: This field records the function of this Prism. Beam-shaping (i.e., Anamorphic) Prism pairs are used for
          reshaping the profile of a laser beam. For example, the elliptical beam from a laser diode can be transformed into
          a beam with circular cross-section, by magnifying the elliptical beam in one dimension. They can also be used to
          convert a circular beam into an elliptical beam. Dispersing prisms can be employed to bend and separate light into
          its component wavelengths. Polarizing prisms (i.e., Glan–Thompson, Nomarski, Wollaston) are birefringent crystals,
          which divide incident non-polarized light into separate components polarized orthogonally to each other. Reflecting
          prisms are useful for redirecting (i.e., flip, invert, rotate, etc.) light beams by total internal reflection or
          for dividing them into two or more separate beams (i.e., beam-splitting) one.
        required: true
        annotations:
          Tier: '2'
      Condenser:
        range: boolean
        description: This field records whether this Prism is within the Condenser (True) or the Objective (False).
        required: true
        annotations:
          Tier: '2'
      OilObjective:
        range: boolean
        description: This field records whether this Prism is designed to work with oil Objectives (True) or not (False).
        required: true
        annotations:
          Tier: '2'
      Compound:
        range: boolean
        description: This field records whether this Prism is a Compound Prism (i.e., a set of multiple triangular prism elements
          placed in contact, and often cemented together to form a solid assembly; True) or a Simple Prism (False).
        annotations:
          Tier: '2'
      RefractiveIndex:
        range: float
        description: This field records the Refractive Index of the material this Prism is made of, as specified by the Manufacturer.
        annotations:
          Tier: '3'
      Reflectance:
        range: float
        description: This field records the maximum amount of light this Prism is capable of transmitting at peak Wavelength.
          It is represented as a fractional value from 0.0 to 1.0.
        required: true
        annotations:
          Tier: '3'
      AngleOfIncidence:
        range: float
        description: This field records the Angle Of Incidence (AOI) is the angle between a beam of light incident on the
          Prism surface and the line perpendicular to the surface at the point of incidence, called the normal.
        annotations:
          Tier: '3'
      AngleOfIncidenceUnit:
        range: UnitsAngle
        ifabsent: string(deg)
        annotations:
          Tier: '3'
          description_source: derived from Prism.AngleOfIncidence
        description: The unit of AngleOfIncidence.
      DeviationAngle:
        range: float
        description: 'This field records the Deviation Angle of this Prism. A beam passing through an object like a prism
          is deflected twice: once entering, and again when exiting. The sum of these two deflections is called the deviation
          angle and is measured with respect to the incident ray.'
        annotations:
          Tier: '3'
      DevianceAngleUnit:
        range: UnitsAngle
        ifabsent: string(deg)
        annotations:
          Tier: '3'
      PrismAngle:
        range: float
        description: This field records the Angle between two surfaces of this Prism.
        annotations:
          Tier: '3'
      PrismAngleUnit:
        range: UnitsAngle
        ifabsent: string(deg)
        annotations:
          Tier: '3'
          description_source: derived from Prism.PrismAngle
        description: The unit of PrismAngle.
      Design:
        range: PrismDesign
        description: This field records the shape of the Prism with specific reference to the angles defined by its faces.
        annotations:
          Tier: '3'
      AbbeNumber:
        range: float
        description: This field records the Abbe number of this Prism. The Abbe Number is a measure of the material's dispersion
          (variation of Refractive Index versus Wavelength), with high values indicating low dispersion.
        annotations:
          Tier: '3'
      MaterialName:
        range: OpticalMaterialName
        description: This field records the chemical composition or designation of the Material this Prism is made of.
        annotations:
          Tier: '3'
      GlassCode:
        range: string
        description: If available, this field records the international Glass Code of the material that constitutes this Prism.
          The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying
          the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken
          at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three
          digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass
          Code of 517642.
        annotations:
          Tier: '3'
      Density:
        range: float
        description: This field records the Density of the material this Prism is made of.
        annotations:
          Tier: '3'
      DensityUnit:
        range: UnitsDensity
        annotations:
          Tier: '3'
          description_source: derived from Prism.Density
        description: The unit of Density.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: AdditionalOptics
      Tier: '1'
      Model_Settings: PrismSettings
  CCD:
    description: This element represents a Charged Coupled Device Camera.
    is_a: Camera
    attributes:
      Type:
        range: CCDType
        description: This field records the Type of CCD camera used in this case.
        annotations:
          Tier: '1'
      CCDArchitecture:
        range: CCDArchitecture
        description: This field captures the Architecture of this CCD Camera and its associated Transfer Mode.
        annotations:
          Tier: '2'
      RegisterWellCapacity:
        range: integer
        description: This field records the maximum amount of charge each read-out register well can hold, measured in electron
          counts.
        annotations:
          Tier: '3'
      RegisterWellCapacityUnit:
        range: UnitsElectricCharge
        ifabsent: string(e-)
        annotations:
          Tier: '3'
          description_source: derived from CCD.RegisterWellCapacity
        description: The unit of RegisterWellCapacity.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.Camera
      Tier: '1'
      Model_Settings: CameraSettings
  AnalogVideo:
    description: This element represents a device used to capture Analog Videos.
    is_a: Camera
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.Camera
      Tier: '1'
      Model_Settings: CameraSettings
  CMOS:
    description: This field records a complementary metal–oxide–semiconductor camera
    is_a: Camera
    attributes:
      Type:
        range: CMOSType
        description: This field records the Type of CMOS Camera used.
        annotations:
          Tier: '1'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.Camera
      Tier: '1'
      Model_Settings: CameraSettings
  IntensifiedCamera:
    description: This field records an intensified Camera.
    is_a: Camera
    attributes:
      SensorType:
        range: SensorType
        description: This field records the Type of Sensor used in this case.
        required: true
        annotations:
          Tier: '2'
      IntensifierType:
        range: IntensifierType
        description: This field records the Type of Intensifier used for this Camera.
        required: true
        annotations:
          Tier: '2'
      RegisterWellCapacity:
        range: integer
        description: This field records the maximum amount of charge each read-out register well can hold, measured in electron
          counts.
        annotations:
          Tier: '3'
      RegisterWellCapacityUnit:
        range: UnitsElectricCharge
        ifabsent: string(e-)
        annotations:
          Tier: '3'
          description_source: derived from IntensifiedCamera.RegisterWellCapacity
        description: The unit of RegisterWellCapacity.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.Camera
      Tier: '1'
      Model_Settings: CameraSettings
  PhotoMultiplierTube:
    description: A Photomultiplier Tube (PMT) is a photoemissive device in which the absorption of a photon results in the
      emission of an electron and it is used for the detection of very weak signals. These Detectors work by amplifying the
      electrons generated by a photocathode exposed to a photon flux. The higher the supplied voltage (PMTVoltage setting),
      the greater the amplification of the current (PMTGain setting) and thus sensitivity, but also the higher the noise in
      the acquired image. The amplifier offset (PMTOffset setting) defines black level setting of the image. A PMT has no
      inherent spatial information of the image.
    is_a: PointDetector
    attributes:
      CollectionEfficiency:
        range: PercentFraction
        description: This field measures the probability that photoelectrons will land on the effective area of the first
          dynode of the photomultiplier stage. While there might be dispersion at the second and later dynodes, this tends
          to have less of an effect on the total collection efficiency as the number of emitted electrons increases greatly.
        required: true
        annotations:
          Tier: '2'
      Multianode:
        range: boolean
        description: This field records whether (True) or not (False) this is Photo Multiplier Tube is composed of an array
          of multiple
        required: true
        annotations:
          Tier: '2'
      MultianodeChannelNr:
        range: integer
        description: In case this Detector is a Multianode composed of an array of multiple Photomultiplier Tubes, this field
          records the number of Channels it consists of.
        annotations:
          Tier: '3'
      MultianodeArrangement:
        range: MultianodeArrangement
        description: In case this Detector is a Multianode composed of an array of multiple Photomultiplier Tubes, this field
          records the arrangement of the individual Photomultiplier Tubes.
        annotations:
          Tier: '3'
      HeadOn:
        range: boolean
        description: This is True if the Photocathode is positioned at either end of the vacuum tube. This is False if the
          photocathode element is located on the side of the vacuum tube (side-on geometry).
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.PointDetector
      Tier: '1'
      Model_Settings: PointDetectorSettings
  PhotoDiode:
    description: This element represents a Photovoltaic Detector. Most photodiodes used in confocal microscopes are Avalanche
      Photodiode (APD) which because of the amplification gain have good sensitivities and less dark current.
    is_a: PointDetector
    attributes:
      Avalanche:
        range: boolean
        description: This field records whether (True) or not (False) this is an Avalanche Photodiode.
        annotations:
          Tier: '2'
      PINJunction:
        range: boolean
        description: This field records whether this photodiode is based on a Positive-Intermediate-Negative (PIN) or a Positive-Negative
          (PN) architecture.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.PointDetector
      Tier: '1'
      Model_Settings: PointDetectorSettings
  HybridPhotoDetector:
    description: This element represents a hybrid Photomultiplier and Avalanche Photodiode (APD).
    is_a: PointDetector
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.PointDetector
      Tier: '1'
      Model_Settings: PointDetectorSettings
  LEDModule:
    description: A Light Emitting Diode (LED) Light Source is often composed of multiple modules each with its own wavelength
      characteristics. This element describes an individual LED module. Multiple of this elements may be used.
    is_a: IlluminationWavelengthRange
    attributes:
      ProjectionAngle:
        range: float
        description: This field records the angle at which this LED Module projects the light beam.
        annotations:
          Tier: '3'
      ProjectionAngleUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from LEDModule.ProjectionAngle
        description: The unit of ProjectionAngle.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '1'
      xsdfu_plural: LEDModules
  IlluminationWavelengthRange:
    description: This element records a range of Wavelengths at which this Light Source emits, according to the Manufacturer.
      Multiple of this element may be used.
    is_a: WavelengthRange
    attributes:
      IlluminationPower:
        range: float
        description: This field records the nominal Illumination Power (also known as Power Output or Illumination Intensity)
          emitted at Peak Wavelength by this Light Source, as advertised by the Manufacturer.
        required: true
        annotations:
          Tier: '1'
      IlluminationPowerUnit:
        range: UnitsPower
        ifabsent: string(mW)
        annotations:
          Tier: '1'
          description_source: derived from IlluminationWavelengthRange.IlluminationPower
        description: The unit of IlluminationPower.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '1'
      xsdfu_plural: IlluminationWavelengthRanges
  WavelengthRange:
    description: This element records a range of Wavelengths this component is designed for, according to the Manufacturer.
      Multiple of this element may be used.
    attributes:
      WavelengthProfileFile:
        range: WavelengthProfileFile
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element consists of a file containing the Wavelength profile of this hardware component.
      PeakWavelength:
        range: float
        description: This field records the nominal Wavelength associated with the peak response rate of this device.
        required: true
        annotations:
          Tier: '2'
      PeakWavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from WavelengthRange.PeakWavelength
        description: The unit of PeakWavelength.
      CutOn:
        range: PositiveFloat
        description: CutOn is the Wavelength below which the response rate is below 50%. In case a CutOn Wavelength is not
          available, such as in the case of a ShortPass or Notch configuration, please enter 000.
        annotations:
          Tier: '2'
      CutOnUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from WavelengthRange.CutOn
        description: The unit of CutOn.
      CutOff:
        range: PositiveFloat
        description: CutOff is the Wavelength above which the response rate is below 50%. In case a CutOff Wavelength is not
          available, such as in the case of a LongPass configuration, please enter 000.
        annotations:
          Tier: '2'
      CutOffUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from WavelengthRange.CutOff
        description: The unit of CutOff.
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '2'
      xsdfu_plural: WavelengthRanges
    slots:
    - ObjectType
  ReflectanceRange:
    description: This element records the Range (also known as Band) of Wavelengths that are reflected by this optical componewnt.
      It also records the maximum amount of light reflected. Multiple of these elements can be used.
    attributes:
      Wavelength:
        range: PositiveFloat
        description: This field records the key Wavelength that characterizes this Reflectance Range (also known as Reflection
          band). In most cases, Wavelength refers to the CutOn Wavelength (i.e., below which there is less than 50% transmittance)
          but it might also refer to the CutOff wavelength (i.e., above which there is less than 50% transmittance) or the
          Center Wavelength of the Reflectance Band.
        required: true
        annotations:
          Tier: '3'
      FWHMBandwidth:
        range: PositiveFloat
        description: This field records the width of this Reflectance Range (also known as Reflection band). Specifically,
          the Full Width at Half Maximum (FWHM) represents the bandwidth of the Wavelength spectrum curve measured between
          those points whose transmission amplitude is 50% of the maximum. In case bandwidth is not available, such as in
          the case of a LongPass, Notch or ShortPass configuration, please enter 000.
        required: true
        annotations:
          Tier: '3'
      WavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '3'
          description_source: derived from ReflectanceRange.Wavelength
        description: The unit of Wavelength.
      Reflectance:
        range: PercentFraction
        description: This field records the maximum amount of light this optical component is capable of reflecting in this
          Wavelength Range, at the peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '3'
      xsdfu_plural: ReflectanceRanges
  TransmissionWavelengthRangeSettings:
    description: This element records the range of Transmission Wavelengths that were set for this optical component during
      the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements can
      be used.
    is_a: WavelengthRangeSettingsType
    attributes:
      Transmittance:
        range: PercentFraction
        description: This field records the maximum amount of light this optical component is capable of transmitting in this
          Wavelength Range, at the peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: ChildElement
      Tier: '1'
      xsdfu_plural: TransmissionWavelengthRangeSettings
  ReflectionWavelengthRangeSettings:
    description: This element records the range of Reflection Wavelengths that were set for this optical component during
      the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements can
      be used.
    is_a: WavelengthRangeSettingsType
    attributes:
      Reflectance:
        range: PercentFraction
        description: This field records the maximum amount of light this optical component is capable of reflecting in this
          Wavelength Range, at the peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: ChildElement
      Tier: '3'
      xsdfu_plural: ReflectionWavelengthRangeSettings
  TransmittanceProfileFile:
    description: This element represents a file in .csv or other suitable formats containing the Transmittance profile of
      this optical component.
    is_a: FileAnnotation
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '3'
  ReflectanceProfileFile:
    description: This element represents a file in .csv or other suitable formats containing the Reflectance profile of this
      optical component.
    is_a: FileAnnotation
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '3'
  WavelengthProfileFile:
    description: This element consists of a file containing the Wavelength profile of this hardware component.
    is_a: FileAnnotation
    annotations:
      Extension: Basic
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '3'
  AdditionalVendorInformation:
    description: This element is intendended to be used as a last-resort solution to capture vendor-specific Additional Information
      about this hardware component, which cannot be described using either available model elements (Classes or Attributes)
      or the Map Annotation feature of the schema. The use of this feature should not be intended as a way to hide information
      that the Imaging Community has designated as essential to ensure rigor and reproducibility. In case this feature is
      used, the Vendor is fully responsible for this information, including but not limited to, making sure this information
      is appropriately recorded and kept up to date.
    attributes:
      VendorBinData:
        range: VendorBinData
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: The contents of this element are base64-encoded. These are not CDATA sections, just base64 streams.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this model element.
        required: true
        identifier: true
        annotations:
          Tier: '3'
      VendorName:
        range: string
        description: The Name of the Vendor responsible for this Information.
        required: true
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: VendorSpecifications
      Category: VendorInformation
      Tier: '3'
  VendorBinData:
    description: The contents of this element are base64-encoded. These are not CDATA sections, just base64 streams.
    attributes:
      Value:
        range: base64Binary
        annotations:
          xsd_text_content: true
      Compression:
        range: VendorBinDataCompression
        description: Specifies the compression scheme used to encode the data.
        ifabsent: string(none)
        annotations:
          Tier: '3'
      BigEndian:
        range: boolean
        description: This is true if the binary data was written in BigEndian order. This is dependent on the system architecture
          of the machine that wrote the pixels. True for essentially all modern CPUs other than Intel and Alpha. All Binary
          data must be written in the same endian order.
        required: true
        annotations:
          Tier: '3'
      Length:
        range: NonNegativeLong
        description: Character count attribute for the BinData field. This is the length of the base-64 encoded block. It
          allows easy skipping of the block when parsing the file. [unit:bytes]
        required: true
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: VendorSpecifications
      Category: VendorInformation
      Tier: '3'
  AdditionalDimensionMap:
    description: This map defines any additional dimension beyond the canonical 5 dimensions XYZCT. It contains a number of
      elements for each Plane of data referring to this Additional Dimension.
    attributes:
      TheAdditionalDimension:
        range: TheAdditionalDimension
        inlined: true
        required: true
        description: This element refers to each individual Plane of data pertaining to a given Additional Dimension.
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        required: true
        description: This element holds a free text multi-line optional description for this component.
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        required: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Name:
        range: Denomination
        description: A user assigned Name for this component.
        annotations:
          Tier: '2'
      Size:
        range: integer
        description: This field captures the number of sample points recorded along this dimension.
        required: true
        annotations:
          Tier: '2'
      Type:
        range: AdditionalDimensionType
        description: This field describes the Type of this Additional Dimension.
        required: true
        annotations:
          Tier: '2'
      TypeDescription:
        range: string
        description: This is a description of the Type used to indicate to an application or user how the data should be interpreted.
        annotations:
          Tier: '2'
      Order:
        range: integer
        description: This field describes the order in which the individual Planes of data referring to this dimension are
          interleaved in the Image past the canonical 5 dimension XYZCT. The number should be zero based, e.g., 0, 1, 2 etc.
        required: true
        annotations:
          Tier: '2'
      PresetStepIncrement:
        range: float
        description: This field records the preset size of Step Increment between Planes of data along this dimension. The
          Increment is numbered from 0, with default value of 1. Setting a value for this attribute to -1 indicates non-uniform
          sampling along this Additional Dimension. In this case the actual Step Increment value associated with each Plane
          along this Additional Dimension will have to be stored in TheIncrementStamp attribute of TheAdditionalDimension.
        annotations:
          Tier: '2'
      Unit:
        range: string
        description: This field records the Unit used for the metric recorded along this dimension
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: ImageAcquistionSettings
      Category: ImageDimensions
      Tier: '2'
  TheAdditionalDimension:
    description: This element refers to each individual Plane of data pertaining to a given Additional Dimension.
    attributes:
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      TheAdditionalDimensionIndex:
        range: PositiveInt
        description: This field records the Index of this specific Plane within a vector of Additional Dimension data.
        required: true
        annotations:
          Tier: '2'
      TheIncrementStamp:
        range: float
        description: This field records the actual Step Increment value associated with each Plane of data along this Additional
          Dimension vector for this Image. While, this field is only required with non-uniform sampling along this Additional
          Dimension (as indicated by a value of -1 stored in AdditionalDImension/@ActualStepIncrement), it is always allowed.
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: ImageDimensions
      Tier: '2'
  NGFFData:
    description: This element describes the location of the pixel data in a NGFF storage set.
    annotations:
      Extension: Basic
      Domain: ImageAcquistionSettings
      Category: Data
      Tier: '1'
  PlaneTransformationMatrix:
    description: 'This element describes a 4x4 matrix relating the position of this Plane typically with respect to other
      Planes within this Image or collection of Images (or alternatively to the Microscope''s reference frame). This can correct
      for translations, rotations, scale differences, or other affine distortions between Planes from the same set or between
      Image Datasets. An example is when multiple cameras are used for e.g. to acquire different Channels for the same Image.
      See: https://www.openmicroscopy.org/community/viewtopic.php?p=17433.'
    attributes:
      Row:
        range: rowType
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: ImageDimensions
      Tier: '3'
  MicroscopeStandSettings:
    description: This element refers to the Microscope Stand used to acquire this Image and it holds the Settings that were
      applied to the Microscope Stand during this Acquisition.
    is_a: Settings
    attributes:
      ID:
        description: This is the Unique Identifier of the Microscope used in this case.
        inlined: false
        annotations:
          Tier: '2'
        range: MicroscopeStand
      TotalEffectiveMagnification:
        range: float
        description: This fields records the Total Effective Magnification used in this case. This number can be obtained
          by multiplying Magnification Changer:Magnification times the Objective:NominalMagnification or even better the Objective:CalibratedMagnification
          if available.
        annotations:
          Tier: '2'
      FieldOfView:
        range: float
        description: The Field of View defines the area of the specimen that is viewable via the eyepiece. This field caputers
          the measures size of the Field of View.
        annotations:
          Tier: '3'
      FieldOfViewUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from MicroscopeStandSettings.FieldOfView
        description: The unit of FieldOfView.
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '2'
  MicroscopeTableSettings:
    description: This element refers to the MicroscopeTable used to support the Microscope used to acquire this Image and
      holds the settings that were applied to the Microscope during this Acquisition.
    is_a: Settings
    attributes:
      ID:
        description: This is the Unique Identifier of the Microscope Table used in this case.
        required: true
        inlined: false
        annotations:
          Tier: '2'
        range: MicroscopeTable
      Floating:
        range: boolean
        description: This field recods whether the Microscope Table was Floating (True) or not (False) during the acquistion
          of this Image.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '2'
  SamplePositioningSettings:
    description: This element holds the Setting applied to a Sample Positioning Device used  during the Acquisiton of this
      experimental Image as well as a reference (the ID attribute) to the Sample Positioning Device in question.
    is_a: Settings
    attributes:
      ID:
        description: This is the Unique Identifier of the Sample Positioning Device used in this case.
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: SamplePositioning
      XYVelocitySetting:
        range: float
        description: This field describes the XY Velocity that was set for this Sample Positioning Device during the Acquisition
          of this experimental Image.
        annotations:
          Tier: '1'
      XYVelocitySettingUnit:
        range: UnitsVelocity
        annotations:
          Tier: '1'
          description_source: derived from SamplePositioningSettings.XYVelocitySetting
        description: The unit of XYVelocitySetting.
      ZVelocitySetting:
        range: float
        description: This field describes the Z-axis Velocity that was set for this Sample Positioning Device during the Acquisition
          of this experimental Image.
        annotations:
          Tier: '1'
      ZVelocitySettingUnit:
        range: UnitsVelocity
        annotations:
          Tier: '1'
          description_source: derived from SamplePositioningSettings.ZVelocitySetting
        description: The unit of ZVelocitySetting.
      XYReproducibilitySettings:
        range: float
        description: This field describes the XY Precision that was set for this Sample Positioning Device during the Acquisition
          of this experimental Image. This metric refers to the capacity this Device of maintaining a given XY Position over
          time as specified by the Manufacturer. This metric is generally referred to as Reproducibility and it might also
          be referred to as Lateral Drift. This metric is particularly relevant for Stereology systems and for the calibration
          of Sample Positioning devices.
        annotations:
          Tier: '1'
      XYReproducibilitySettingsUnit:
        range: UnitsLength
        annotations:
          Tier: '1'
          description_source: derived from SamplePositioningSettings.XYReproducibilitySettings
        description: The unit of XYReproducibilitySettings.
      ZReproducibilitySettings:
        range: float
        description: This field describes the Z-Axis Precision that was set for this Sample Positioning Device during the
          Acquisition of this experimental Image. This metric refers to the capacity this Device of maintaining a given Z-axis
          Position over time as specified by the Manufacturer. This metric is generally referred to as Reproducibility and
          it might also be referred to as Focal Drift. This metric is particularly relevant for Stereology systems and for
          the calibration of Sample Positioning devices.
        annotations:
          Tier: '1'
      ZReproducibilitySettingsUnit:
        range: UnitsLength
        annotations:
          Tier: '1'
          description_source: derived from SamplePositioningSettings.ZReproducibilitySettings
        description: The unit of ZReproducibilitySettings.
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  LensSettings:
    description: This element holds the Setting applied to a Lens used in the Light Path during the acquisition of this Channel
      as well as a reference (the ID attribute) to the Lens in question.
    is_a: Settings
    attributes:
      ID:
        description: This is the Unique Identifier of the device used in this case.
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: Lens
      Function:
        range: string
        description: This field records the purpose for which this Additinal Lens was used during the Acquisition of this
          Channel.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
      xsdfu_plural: LensSettingsCombinations
  MirroringDeviceSettings:
    description: This element holds the Setting applied to a Mirror used in the Light Path during the acquisition of this
      Channel as well as a reference (the ID attribute) to the Mirror in question.
    is_a: Settings
    attributes:
      ID:
        description: This is the Unique Identifier of the device used in this case.
        required: true
        inlined: false
        annotations:
          Tier: '2'
        range: MirroringDevice
      ActualMountedAngle:
        range: float
        description: This field records the Angle at which this mirror was mounted during the Acqusition of this Channel with
          respect to the optical axis.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '2'
      xsdfu_plural: MirroringDeviceSettingsCombinations
  GenericOpticalApertureSettings:
    description: This element holds the Setting applied to a Generic Optical Aperture used during the Acquisition of this
      Channel as well as a reference (the ID attribute) to the Optical Aperture in question.
    is_a: OpticalApertureSettings
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  PrismSettings:
    description: This element holds the Setting applied to a Prism used in the Light Path during the acquisition of this Channel
      as well as a reference (the ID attribute) to the Prism in question.
    is_a: Settings
    attributes:
      TransmittanceProfileFie:
        range: FileAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a File in .csv or other suitable formats containing the Transmission Wavelength
          profile of this hardware component.
        annotations:
          Tier: '3'
      ReflectanceProfileFile:
        range: FileAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a File in .csv or other suitable formats containing the Reflection Wavelength profile
          of this hardware component.
        annotations:
          Tier: '3'
      TransmissionWavelengthRangeSettings:
        range: TransmissionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Transmission Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ReflectionWavelengthRangeSettings:
        range: ReflectionWavelengthRangeSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records the range of Reflection Wavelengths that were set for this optical component during
          the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
          can be used.
      ID:
        description: This is the Unique Identifier of the device used in this case.
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: Prism
      PositionSetting:
        range: PrismPositionSettingList
        description: This field refers to the Wollaston Prism position that was set during the Acquisition of this Image.
          The Position must match the Wollaston Prism Settings found at the base of the objective lens.
        annotations:
          Tier: '3'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
      xsdfu_plural: PrismSettingsCombinations
  ShutterSettings:
    description: This element holds the Setting applied to a Shutter used in the Light Path during the acquisition of this
      Channel as well as a reference (the ID attribute) to the Shutter in question.
    is_a: Settings
    attributes:
      ID:
        description: This is the Unique Identifier of the device used in this case.
        required: true
        inlined: false
        annotations:
          Tier: '1'
        range: OpticalAperture
      OpenDuringZMovement:
        range: boolean
        description: This field captures whether this Shutter was open (True) or closed (False) during Z-movement between
          successive Z-planes in this Image.
        required: true
        annotations:
          Tier: '1'
      ApertureDiameter:
        range: float
        description: This field records the actual physical Aperture Diameter that was used for this Shutter during the Acquisition
          of this Channel.
        annotations:
          Tier: '2'
      ApertureDiameterUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from ShutterSettings.ApertureDiameter
        description: The unit of ApertureDiameter.
      Mode:
        range: ShutterMode
        description: This field records the operation mode that was applied to this Shutter during the Acquisition of this
          Channel. The Fast mode provides the quickest open and close action sequence for which the shutter is capable. The
          Soft intensity without affecting wavelength is accommodated by a Neutral Density shutter mode (for more details
          see https://www.microscopyu.com/applications/live-cell-imaging/the-automatic-microscope).
        annotations:
          Tier: '2'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
      xsdfu_plural: ShutterSettingsCombinations
  PointDetectorSettings:
    description: This element refers to the Point Detector used to acquire this Channel and it holds the Settings that were
      applied to the Point Detector during this Acquisition.
    is_a: DetectorSettings
    attributes:
      Voltage:
        range: float
        description: This field refers to the Voltage settings applied to the Photomultiplier Tube (PMT) for the Acquisition
          of this Channel (e.g., voltage = 244). The higher the supplied Voltage, the greater the amplification of the current
          generated by the PMT. While this increases the sensitivity, it also increases the background in the resulting image.
        required: true
        annotations:
          Tier: '1'
      VoltageUnit:
        range: UnitsElectricPotential
        ifabsent: string(mV)
        annotations:
          Tier: '1'
          description_source: derived from PointDetectorSettings.Voltage
        description: The unit of Voltage.
      PhotonCounting:
        range: boolean
        description: This boolean indicates whether this Photomultiplier Tube was operated in photon-counting mode (True)
          or not (False), during the Acquisition of this Channel.
        annotations:
          Tier: '1'
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
      xsdfu_plural: PointDetectorSettingsCombinations
  CameraSettings:
    description: This element refers to the Camera used to acquire this Channel and it holds the Settings that were applied
      to the Camera during this Acquisition.
    is_a: DetectorSettings
    attributes:
      Binning:
        range: Binning
        description: This field represents the number of adjacent pixels whose electric charge is combined in the resulting
          Image (e.g. binning = 2x2). Generally, binning increases read-out rates, signal-to-noise ratio, and relative sensitivity,
          while it reduces the spatial resolution.
        required: true
        annotations:
          Tier: '1'
      PixelReadOutRate:
        range: float
        description: This represents the effective Pixel Readout Rate used for the Acquisition of this Channel. This value
          is defined as the inverse of the time required to digitize a single pixel (also referred to as serial conversion
          time). Pixel readout rate can be considered similar to a baud rate as it depends on the bytes per second that can
          be read from the detector and written on disk. Readout rates are usually given in pixels/second (e.g., 500 kilopixels/second).
        required: true
        annotations:
          Tier: '1'
      PixelReadOutRateUnit:
        range: UnitsFrequency
        ifabsent: string(Hz)
        annotations:
          Tier: '1'
          description_source: derived from CameraSettings.PixelReadOutRate
        description: The unit of PixelReadOutRate.
      SensorExposureMode:
        range: CMOSSensorExposureMode
        description: In case of a CMOS Camera and if selectable, this field reports the sensor Exposure modality used for
          the Acquisition of this Channel. In the Rolling Exposure mode adjacent rows of the array are exposed at slightly
          different times as the readout 'waves' sweep through each half of the sensor. In the Global Exposure mode (i.e.,
          'Snapshot' exposure mode) all pixels of the array are exposed simultaneously, thus enabling 'freeze frame' capture
          of fast moving or fast changing events. In this modality the CMOS Camera behaves like an interline CCD sensor.
        required: true
        annotations:
          Tier: '1'
      Integration:
        range: PositiveInt
        description: This field represents the number of sequential frames that have been averaged to obtain this image, to
          improve the overall signal-to-noise ratio.
        required: true
        annotations:
          Tier: '2'
      FrameRate:
        range: float
        description: Frame Rate is the inverse of the time needed for the CCD to acquire a single Frame (or Plane) and then
          completely read that image out. Frame Rate is typically expressed in frames per second (fps). Often, the Frame Rate
          can be approximately calculated from the total number of pixels and the readout rate, combined with the total exposure
          time. This field represents the effective Frame Rate used for the Acquisition of this Image.
        required: true
        annotations:
          Tier: '3'
      FrameRateUnit:
        range: UnitsFrequency
        ifabsent: string(fps)
        annotations:
          Tier: '3'
          description_source: derived from CameraSettings.FrameRate
        description: The unit of FrameRate.
      OperatingTemperature:
        range: float
        description: This field represents the effective temperature the sensor was kept at during the Acquisition of this
          image.
        annotations:
          Tier: '3'
      OperatingTemperatureUnit:
        range: UnitsTemperature
        ifabsent: string(°C)
        annotations:
          Tier: '3'
          description_source: derived from CameraSettings.OperatingTemperature
        description: The unit of OperatingTemperature.
    annotations:
      Extension: Basic
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
      xsdfu_plural: CameraSettingsCombinations
  MicrobeamManipulation:
    description: Defines a microbeam operation and the region of the image it was applied to. The LightSourceSettingsRef element
      is a reference to the LightSourceSettings that were used in this case, including a reference to the light source that
      was used for this micromanipulation experiment (e.g....................... a laser used for photobleaching).
    attributes:
      Experimenter:
        inlined: false
        annotations:
          xsd_element: ExperimenterRef
        multivalued: true
        description: This empty element refers to Experimenter that performed this experiment.
        range: Experimenter
      ROI:
        inlined: false
        annotations:
          xsd_element: ROIRef
          Tier: '2'
        multivalued: true
        required: true
        description: This empty element refers to the predefined four dimensional ROI (Region of Interest) that was used for
          this micromanipulation experiment.
        range: ROI
      LightSourceSettings:
        range: LightSourceSettings
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This holds a reference to the LightSource (i.e. the ID attribute) that was used in this case as well
          as the setting that were applied to in in this case.
        annotations:
          Tier: '2'
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
          Tier: '2'
        description: A description for the Microbeam Manipulation. [plain-text multi-line string]
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '2'
        multivalued: true
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: MicrobeamManipulationID
        description: A Unique Identifier for this MicrobeamManipulation hardware component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Type:
        range: MicrobeamManipulationType
        description: This field defines the type of micromanipulation performed.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Advanced+Confocal
      Domain: Experimental
      Category: BeamManipulation
      Tier: '2'
  TIRFHardwareModule:
    description: Total Internal Reflection Fluorescence (TIRF) microscopy is a modality in which fluorescence is excited in
      a thin layer by an evanescent wave produced by total internal reflection. This element describes a Hardware Module that
      is used to achieve TIRF microscopy.
    is_a: ManufacturerSpec
    attributes:
      Prism:
        inlined: false
        annotations:
          xsd_element: PrismRef
        multivalued: true
        description: This refers to an available Prism, which is part of this Optical Assembly.
        range: Prism
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        multivalued: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Method:
        range: TIRFMethod
        description: This field captures the approach used by this TIRF Hardware Module to produce TIRF illumination. In Objective-based
          TIRF, the excitation lightpath and the emission channel share the same optics, which provides high signals but might
          result in high background. In Prism-based TIRF excitation light enters the dovetail prism, reflects at the glass/water
          interface and escapes through the opposite facet without interferring with the emission channel . In Lightguide-based
          TIRF, excitation light enters the lightguide, reflects multiple times from its top and bottom surfaces to generate
          wide-area evanescent waves and escapes from the opposite side of the lightguide without interferring with the emission
          channel.
        required: true
        annotations:
          Tier: '1'
      RIng:
        range: boolean
        description: This field captures whether this TIRF Hardware Module employs Ring (also known as spinning-spot) TIRF
          (True) or Spot TIRF (False).
        required: true
        annotations:
          Tier: '1'
      Motorized:
        range: boolean
        description: This field captures whether this TIRF Hardware Module employs a Motorized device to set the TIRF Angle
          (True) or not (False).
        annotations:
          Tier: '2'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: SpecialModality
      Tier: '1'
      Model_Settings: TIRFSettings
  RasterScanner:
    description: A Raster Scanner is typically used for systematic periodic scanning (raster scanning) of the Laser beam or
      of the Specimen position, either in one or in two dimensions. Refer to https://www.iso.org/standard/69820.html for further
      details and measurement methods.
    is_a: ConfocalScanner
    attributes:
      Type:
        range: RasterScannerType
        description: This field records the type of this Raster Scanner. In a Galvanometer-mirror based system, two galvanometer
          scan mirrors (one for each axis) direct the laser beam to any XY position in the field of view. In a Resonant system
          laser positioning in the x-axis is provided by a special resonant scan mirror which oscillates at a fixed frequency.
        required: true
        annotations:
          Tier: '1'
      HorizontalScanningSpeed:
        range: float
        description: This field records the maximal Horizontal Scanning Speed of this device.
        annotations:
          Tier: '2'
      HorizontalScanningSpeedUnit:
        range: UnitsVelocity
        annotations:
          Tier: '2'
          description_source: derived from RasterScanner.HorizontalScanningSpeed
        description: The unit of HorizontalScanningSpeed.
      VerticalScanningSpeed:
        range: float
        description: This field records the maximal Vertical Scanning Speed of this device.
        annotations:
          Tier: '2'
      VerticalScanningSpeedUnit:
        range: UnitsVelocity
        annotations:
          Tier: '2'
          description_source: derived from RasterScanner.VerticalScanningSpeed
        description: The unit of VerticalScanningSpeed.
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Confocal
      Tier: '1'
      Model_Settings: ConfocalScannerSettings
  SpinningDisk:
    description: A Spinning disk confocal scanner is a device in which the scanning of the illuminated and detected spots
      is performed simultaneously using an opaque disk called a Nipkow disk, which has many ideally identical small holes
      arranged in Archimedean spirals. Refer to https://www.iso.org/standard/69820.html for further details and measurement
      methods.
    is_a: ConfocalScanner
    attributes:
      SingleDisk:
        range: boolean
        description: This records whether this Spinning Disk Confocal Scanner uses Single-Disk (True) or Dual-Disk (False)
          technology.
        annotations:
          Tier: '1'
      DiskSpeed:
        range: float
        description: This field records the maximal Disk rotation Speed of this device, according to the Manufactuer.
        annotations:
          Tier: '1'
      DiskSpeedUnit:
        range: UnitsVelocity
        annotations:
          Tier: '1'
          description_source: derived from SpinningDisk.DiskSpeed
        description: The unit of DiskSpeed.
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Confocal
      Tier: '1'
      Model_Settings: ConfocalScannerSettings
  AcoustoOpticalBeamSplitter:
    description: An AOBS is actually an AOTF used in an imaginative manner by Leica to replace the dichroic mirror usually
      used to separate the illumination and the detection paths in a confocal fluorescence Microscope. In practice the AOBS
      is programmed so that it leaves most of the incoming beam of light undeflected, and it only deflects light originating
      from specific laser lines. The AOBS allows the simultaneous deflection of multiple laser lines simultaneously towards
      the sample, while at the same time controlling the intensity of each line independently.
    is_a: AcoustoOpticalDevice
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Advanced
      Tier: '1'
      Model_Settings: AcoustoOpticalBeamSplitterSettings
  AcoustoOpticalDeflector:
    description: Acousto-optic deflectors are devices which can be used to deflect a laser beam in one direction by a variable
      angle, controlled by the frequency of an electrical signal. Essentially, such a device is an acousto-optic modulator
      which is operated with an electrical drive signal of constant power but a variable frequency. The direction of the diffracted
      beam is determined by a Bragg condition, which contains the sound wavelength and thus depends on the sound frequency.
    is_a: AcoustoOpticalDevice
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Advanced
      Tier: '1'
      Model_Settings: AcoustoOpticalDeflectorSettings
  AcoustoOpticalModulator:
    description: An acousto-optic modulator (AOM) is an electronically-tunable device which can be used for controlling the
      direction and/or intensity of a laser beam by an acoustically-induced diffraction grating in a crystal. It is based
      on the acousto-optic effect, i.e. the modification of the refractive index of some crystal or glass material by the
      oscillating mechanical strain of a sound wave (photoelastic effect).
    is_a: AcoustoOpticalDevice
    attributes:
      Type:
        range: AOMType
        description: This field describes the category of this device.
        annotations:
          Tier: '2'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Advanced
      Tier: '1'
      Model_Settings: AcoustoOpticalModulatorSettings
  AcoustoOpticalTuneableFilter:
    description: This is kind tuneable filter, whose optical filtering properties can be tuned by virtue of acousto-optical
      deflection. As such, different wavelengths exits the crystal at different angles depending on the applied radio wave
      frequency. In an optical system in which the input light beam strikes the crystal at a specific angle and can only re-enter
      the system at a specific angle, then one can choose the wavelength of the light diffracted at the output angle angle
      by varying the frequency of the acoustic wave.
    is_a: AcoustoOpticalDevice
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Advanced
      Tier: '1'
      Model_Settings: AcoustoOpticalTuneableFilterSettings
  DeformableMirror:
    description: A Deformable Mirror (DM) is a Mechano Electro-Optical Device that has a controllable spatially varying mirror
      surface to modulate the wavefront of a beam of light impinging on it. This type of device is typically used in adaptive
      optics.
    is_a: ElectroOpticalDevice
    attributes:
      Type:
        range: DeformableMirrorType
        description: This field records the type of this Deformable Mirror.
        required: true
        annotations:
          Tier: '2'
      Actuators:
        range: integer
        description: This field records the number of Actuators available for this device.
        annotations:
          Tier: '2'
      ActuatorPitch:
        range: float
        description: This field records the distance between the center of each Actuator in this device.
        annotations:
          Tier: '3'
      ActuatorPitchUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from DeformableMirror.ActuatorPitch
        description: The unit of ActuatorPitch.
      ActuatorStroke:
        range: float
        description: This field records the maximum possible Actuator displacement available for this device.
        annotations:
          Tier: '3'
      ActuatorStrokeUnit:
        range: UnitsLength
        annotations:
          Tier: '3'
          description_source: derived from DeformableMirror.ActuatorStroke
        description: The unit of ActuatorStroke.
      ResponseTime:
        range: float
        description: This field records the rate at which this Deformable Mirror can change patterns.
        annotations:
          Tier: '3'
      ResponseTimeUnit:
        range: string
        annotations:
          Tier: '3'
          description_source: derived from DeformableMirror.ResponseTime
        description: The unit of ResponseTime.
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: LightModulation
      Tier: '1'
      Model_Settings: DeformableMirrorSettings
  ElectroOpticalModulator:
    description: An Electro-Optical Modulator (EOM) is a device which can be used for controlling the power (→ intensity modulators),
      phase (→ phase modulators) or polarization of light with an electrical control signal.
    is_a: ElectroOpticalDevice
    attributes:
      PockelsCell:
        range: PockelsCell
        inlined: true
        required: true
        description: Pockels cells are the basic components of electro-optic modulators. A Pockels cell is a device consisting
          of an electro-optic crystal (with some electrodes attached to it) through which a light beam can propagate. The
          phase delay in the crystal (→ Pockels effect) can be modulated by applying a variable electric voltage. The Pockels
          cell thus acts as a voltage-controlled waveplate.
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: LightModulation
      Tier: '1'
      Model_Settings: ElectroOpticalModulatorSettings
  LiquidCrystalTuneableFilter:
    description: This element describes a liquid crystal tunable filter (LCTF) is an optical filter that uses electronically
      controlled liquid crystal (LC) elements to transmit a selectable wavelength of light and exclude others.
    is_a: ElectroOpticalDevice
    attributes:
      SelectableBandwidth:
        range: boolean
        description: This field indicates whether the bandwidth of this tuneable filter can be selected (True) or it is fixed
          (False).
        required: true
        annotations:
          Tier: '2'
      MaximumPower:
        range: float
        description: This field describes the maximum Power this device can tolerate (typically expressed in Joules).
        annotations:
          Tier: '3'
      MaximumPowerUnit:
        range: UnitsPower
        annotations:
          Tier: '3'
          description_source: derived from LiquidCrystalTuneableFilter.MaximumPower
        description: The unit of MaximumPower.
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: LightModulation
      Tier: '1'
      Model_Settings: LiquidCrystalTuneableFilterSettings
  SpatialLightModulator:
    description: A Spatial Light Modulator (SLM) is device that imposes a changeable spatially varying modulation on a beam
      of light. The modulation can be in Intensity or in Phase or both.
    is_a: ElectroOpticalDevice
    attributes:
      Type:
        range: SLMType
        description: This field records the category to which this Spatial Light Modulator belongs.
        annotations:
          Tier: '2'
      ArrayWidth:
        range: NonNegativeInt
        description: This field records the number of spatial elements (pixels) this Spatial Light Modulator contains in the
          X direction.
        annotations:
          Tier: '2'
      ArrayHeight:
        range: NonNegativeInt
        description: This field records the number of spatial elements (pixels) this Spatial Light Modulator contains in the
          Y direction.
        annotations:
          Tier: '2'
      ResponseTime:
        range: float
        description: This field records the rate at which this Spatial Light Modulator can change patterns.
        annotations:
          Tier: '3'
      ResponseTimeUnit:
        range: UnitsTime
        annotations:
          Tier: '3'
          description_source: derived from SpatialLightModulator.ResponseTime
        description: The unit of ResponseTime.
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: LightModulation
      Tier: '1'
      Model_Settings: SpatialLightModulatorSettings
  MicrolensArray:
    description: Micro-lens arrays contain multiple micro-lenses forming a one- or two-dimensional array on a supporting substrate.
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
        required: true
        description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
          a simple multi-line comment) describing this component.
        range: Annotation
      WavelengthRange:
        range: WavelengthRange
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element records a range of Wavelengths this component is designed for, according to the Manufacturer.
          Multiple of this element may be used.
      ID:
        range: ElectroOpticalDeviceID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '1'
      Name:
        range: Denomination
        description: A User-defined Name for this component.
        annotations:
          Tier: '2'
      LensletDiameter:
        range: float
        description: This field records the physical Dameter of the Lenslets that compose this Micro Lens Array.
        annotations:
          Tier: '2'
      LensletDiameterUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from MicrolensArray.LensletDiameter
        description: The unit of LensletDiameter.
      LensletPitch:
        range: float
        description: This field records the distance between Lenslets in this Micro Lens Array.
        annotations:
          Tier: '2'
      LensletPitchUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from MicrolensArray.LensletPitch
        description: The unit of LensletPitch.
      LensletArrangement:
        range: string
        description: This field records the arrangement of individual Lenslets on this Array.
        annotations:
          Tier: '2'
      LensletShape:
        range: LensletShape
        description: This field records the geometrical shape (e.g., round vs. square) of the individual Lenslets composing
          this Micro Lens Array.
        annotations:
          Tier: '2'
      LensletProfileShape:
        range: LensShapeType
        description: This field describes the shape of the profile (e.g., concave vs. convex) of the individual Lenslets that
          compose this Micro Lens Array.
        annotations:
          Tier: '2'
      Coating:
        range: string
        description: An optical Coating consists of one or more thin layers of material deposited on an optical component
          such as a Lens or Mirror, which alters the way in which the optic reflects and transmits light. This field records
          the thin-film material used to coat the non linear crystal and reduce surface reflection.
        annotations:
          Tier: '2'
      Reflectance:
        range: float
        description: This field records the maximum amount of light this Micro Lens Array is capable of reflecting. It is
          represented as a fractional value from 0.0 to 1.0.
        required: true
        annotations:
          Tier: '3'
      SustrateMaterial:
        range: OpticalMaterialName
        description: This field records the chemical composition or designation of the substrate of this Micro Lens Array.
          The substrate is typically composed of a glass material with low autofluorescence, such as UV-grade fused silica.
        annotations:
          Tier: '3'
      FrontFocalLength:
        range: float
        description: This field records the distance (f) measured along the optical axis from the front principal plane of
          this Micro Lens Array to the front focal plane (F).
        annotations:
          Tier: '3'
      BackFocalLength:
        range: float
        description: This field records the distance (f') measured along the optical axis from the rear principal plane of
          this Micro Lens Array to the rear focal plane (F').
        annotations:
          Tier: '3'
      OpticalDistanceUnit:
        range: UnitsLength
        description: Use this unit for both Focal Length fields.
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Lens
      Tier: '2'
  DiffractionGrating:
    description: A Diffraction Grating is an optical component with a periodic structure that splits and diffracts light into
      several beams travelling in different directions.
    is_a: OpticalAperture
    attributes:
      Period:
        range: float
        description: This field records the spacing between the centers of two adjacent slits (d).
        required: true
        annotations:
          Tier: '2'
      PeriodUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from DiffractionGrating.Period
        description: The unit of Period.
      SpatialFrequency:
        range: float
        description: This field records the number of slits (or lines) per unit length (1/d). Typically it is measured in
          terms of number of slits per millimiter.
        required: true
        annotations:
          Tier: '2'
      Transmittive:
        range: boolean
        description: This field records whether the periodic fine structure of this Diffraction Grating is Transmissive (True)
          and therefore refracts light, or is Reflective (False) and therefore reflects it.
        annotations:
          Tier: '2'
      ModulationMode:
        range: ModulationModeList
        description: This field indicates what aspect of the light beam is modulated by this device.
        annotations:
          Tier: '2'
      Ronchi:
        range: boolean
        description: This field records whether this Diffraction Grating has a square wave profile, as defined by Ronchi (True)
          or a sine wave profile (False).
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '1'
      Model_Settings: DiffractiveGratingSettings
  MaskingPlate:
    description: This element describes an opaque Masking Plate positioned in the light path to block specific components
      of the light beam.
    is_a: OpticalAperture
    attributes:
      Function:
        range: MaskingPlateFunction
        description: This field describes the Function of this Spatial Mask.
        required: true
        annotations:
          Tier: '2'
      Excitation:
        range: boolean
        description: This field records whether this Spatial Mask is placed in the Excitation (True) or the Emission (False)
          light path.
        required: true
        annotations:
          Tier: '2'
      ApertureSize:
        range: float
        description: This field captures the maximum physical Width of individual Apertures present in this Spatial Mask.
        required: true
        annotations:
          Tier: '2'
      ApertureSizeUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from MaskingPlate.ApertureSize
        description: The unit of ApertureSize.
      ApertureNr:
        range: integer
        description: This field captures the Number of individual apertures present in this Spatial Mask.
        required: true
        annotations:
          Tier: '2'
          xsd_name: ApertureNr.
      ApertureShape:
        range: string
        description: This field captures the Shape of individual apertures present in this Spatial Mask.
        annotations:
          Tier: '3'
      Material:
        range: string
        description: This field captures the Material with which this Spatial Mask is constructed.
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '1'
      Model_Settings: MaskingPlateSettings
  Pinhole:
    description: A pin-like aperture positioned axially to the Light Path, which can act as a spatial filter for a beam of
      light to clean up the output of lasers and / or to suppress out-of-focus light in a confocal Microscope. Specifically,
      in Confocal Microscopy, such Pinholes are diaphragm typically situated in a plane conjugate with the object, and they
      restrict the area in the object plane that is illuminated and/or from which light is collected.
    is_a: OpticalAperture
    attributes:
      MaxDiameter:
        range: float
        description: This field records the maximum physical diameter of this Pinhole.
        required: true
        annotations:
          Tier: '2'
      MaxDiameterUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from Pinhole.MaxDiameter
        description: The unit of MaxDiameter.
      Shape:
        range: PinholeShapeList
        description: This field records the Shape of this Pinhole.
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Aperture
      Tier: '1'
      Model_Settings: PinholeSettings
  WaveFrontSensor:
    description: A two dimensional sensor for measuring the location of the wavefront, typically used in Adaptive Optics.
    is_a: Camera
    attributes:
      Type:
        range: WFSType
        description: This field records the type of this Wavefront Sensor.
        annotations:
          Tier: '2'
      Accuracy:
        range: PercentFraction
        description: This field records the specified Wavefront Accuracy of this sensor at Peak Wavelength (expressed as a
          fraction of the Wavelength).
        annotations:
          Tier: '2'
      Sensitivity:
        range: PercentFraction
        description: This field records the specified Wavefront Sensitivity of this sensor at Peak Wavelength (expressed as
          a fraction of the Wvelength).
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: Detector.Camera
      Tier: '2'
      Model_Settings: CameraSettings
  PockelsCell:
    description: Pockels cells are the basic components of electro-optic modulators. A Pockels cell is a device consisting
      of an electro-optic crystal (with some electrodes attached to it) through which a light beam can propagate. The phase
      delay in the crystal (→ Pockels effect) can be modulated by applying a variable electric voltage. The Pockels cell thus
      acts as a voltage-controlled waveplate.
    attributes:
      HalfWaveVoltage:
        range: float
        description: This field record the Voltage required for inducing a phase change equivalent to a half an optical wavelength.
          In an amplitude modulator, the applied voltage has to be changed by this value in order to go from the operation
          point with minimum transmission to that with maximum transmission. The HalfWaveVoltage can be referred to as, Uπ,
          Uλ/2 or Vλ/2.
        required: true
        annotations:
          Tier: '2'
      HalfWaveVoltageUnit:
        range: UnitsElectricPotential
        required: true
        annotations:
          Tier: '2'
          description_source: derived from PockelsCell.HalfWaveVoltage
        description: The unit of HalfWaveVoltage.
      Material:
        range: PockelsCellMaterial
        description: This field describes the nonlinear crystal materials used to contruct this Pockels cell.
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: LightModulation
      Tier: '2'
  TIRFLightPath:
    description: A description of the Ligth Path utilized for this TIRF experiment.
    is_a: LightPath
    annotations:
      Extension: Advanced+Confocal
      Domain: MicroscopeHardwareSpecifications
      Category: ChildElement
      Tier: '2'
  TIRFSettings:
    description: Total Internal Reflection Fluorescence (TIRF) microscopy is a modality in which fluorescence is excited in
      a thin layer by an evanescent wave produced by total internal reflection. This element defines the TIRF conditions that
      were used for this Experiment.
    is_a: Settings
    attributes:
      TIRFHardwareModule:
        inlined: false
        annotations:
          xsd_element: TIRFHardwareModuleRef
        multivalued: true
        description: In case a specific TIRF Hardware Module was used for this TIRF experiment, this empty element refers
          to the TIRF Module that was used.
        range: TIRFHardwareModule
      TIRFLightPath:
        range: TIRFLightPath
        inlined: true
        description: A description of the Ligth Path utilized for this TIRF experiment.
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: This element holds a free text multi-line optional description for this component.
      ID:
        description: A Unique Identifier for this component.
        required: true
        annotations:
          Tier: '1'
        identifier: true
        range: LSID
      HILO:
        range: boolean
        description: This field capture whether (True) or not (False) TIRF illumination for this Experiment was set up at
          or below the critical angle (63˚; true TIRF) or with oblique illumination (i.e., Highly Inclined and Laminated Optical
          - HILO).
        annotations:
          Tier: '1'
      TIRFAngle:
        range: float
        description: This field captures the incidence Angle used in this case.
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  ConfocalScannerSettings:
    description: This element holds the Setting applied to a Confocal Scanner used during the Acquisiton of this Channel as
      well as a reference (the ID attribute) to the Confocal Scanner in question.
    is_a: Settings
    attributes:
      'ID ':
        range: ConfocalScannerID
        description: This is the Unique Identifier of the device used in this case.
        required: true
        annotations:
          Tier: '1'
      PresetPinholeSize:
        range: float
        description: In case this Confocal Scanner (i.e., Spinning disk, Swept-field, or other Multi-point scanners) has several
          fixed Pinhole Sizes to choose from, this field records the Pinhole Size that was set during the Acquisition of this
          Channel.
        required: true
        annotations:
          Tier: '1'
      PresetPinholeSizeUnit:
        range: UnitsLength
        annotations:
          Tier: '1'
          description_source: derived from ConfocalScannerSettings.PresetPinholeSize
        description: The unit of PresetPinholeSize.
      PinholeSpacing:
        range: float
        description: If applicable, this field records the Spacing between individual Pinholes that was set during the Acquisition
          of this Channel.
        annotations:
          Tier: '1'
      PinholeSpacingUnit:
        range: UnitsLength
        description: If applicable, this field records the Spacing between individual Pinholes that was set during the Acquisition
          of this Channel.
        annotations:
          Tier: '1'
      ScanDirectionality:
        range: ConfocalScanDirectionality
        description: This field records the ScanDirectionality that was set for this device during Acquisition. In Unidirectional
          scan mode, data are only acquired while the laser beam moves in one direction. In Bidirectional scan mode, one line
          is scanned in one direction, and the next line in the opposite direction. In other words, the return run, or flyback,
          of the laser beam is used for recording data as well, thus increasing the scanning frequency when using bidirectional
          scan mode. Refer to https://www.iso.org/standard/69820.html for further details and measurement methods.
        required: true
        annotations:
          Tier: '1'
      IntegrationNumber:
        range: PositiveInt
        description: Signal integration is generally utilized to improve the overall signal-to-noise ratio of the resulting
          Image. This field records the number of sequential Scanning Units (Line, Frame or Stack) that have been integrated
          for the Acquisition of this Channel.
        required: true
        annotations:
          Tier: '1'
      IntegrationUnit:
        range: ScanIntegrationMode
        description: Signal integration is generally utilized to improve the overall signal-to-noise ratio of the resulting
          Image. This field refers to the nature of the Scanning Units used as the basis of signal integration. Refer to https://www.iso.org/standard/69820.html
          for further details and measurement methods.
        required: true
        annotations:
          Tier: '1'
      IntegrationMethod:
        range: ScanIntegrationMethod
        description: Signal integration is generally utilized to improve the overall signal-to-noise ratio of the resulting
          Image. This field defines the signal Integration Method utilized for the Acquisition of this Channel.
        required: true
        annotations:
          Tier: '1'
      EffectiveZoom:
        range: float
        description: This field describes the Effective Zoom factor that was utilized for the acquisition of this Image (e.g.,
          zoom = 1.3). In confocal microscopy, it is possible to set a given hardware-based Zoom factor, aka "Confocal Zoom"
          or "Scan Zoom", by reducing the angle at which the scanning mirrors operate. As a result, the scanned area will
          be reduced in size, which (because the pixel areas associated with the scan are kept constant) will decrease the
          effective size of the portion of the sample that is projected on each pixel thus increasing the effective resolving
          power of the system. For example, with a 512x512 pixel area, and with a 40x objective, zoom 1 we result in a pixel
          size of 732nm, while zoom 10 will reduce the pixel size to 73nm).In confocal microscopy, it is possible to set a
          given hardware-based Zoom factor, aka "Confocal Zoom" or "Scan Zoom", by reducing the angle at which the scanning
          mirrors operate. As a result, the scanned area will be reduced in size, which (because the pixel areas associated
          with the scan are kept constant) will decrease the effective size of the portion of the sample that is projected
          on each pixel thus increasing the effective resolving power of the system. For example, with a 512x512 pixel area,
          and with a 40x objective, zoom 1 we result in a pixel size of 732nm, while zoom 10 will reduce the pixel size to
          73nm).
        required: true
        annotations:
          Tier: '1'
      ZoomAreaWidth:
        range: PositiveInt
        description: This field records the Width of the Zoom Area that was scanned during the Acquisition of this Channel,
          expressed in Pixels.
        annotations:
          Tier: '1'
      ZoomAreaHeight:
        range: PositiveInt
        description: This field records the Height of the Zoom Area that was scanned during the Acquisition of this Channel,
          expressed in Pixels.
        annotations:
          Tier: '1'
      Descanned:
        range: boolean
        description: This field indicates whether or not the Acquisition of this Image involved descanning.
        required: true
        annotations:
          Tier: '1'
      ScanFormat:
        range: ConfocalScanFormat
        description: This field defines the format of the scanned element utilized for this Acquisition. Refer to https://www.iso.org/standard/69820.html
          for further details and measurement methods.
        required: true
        annotations:
          Tier: '2'
      MultiChannelMode:
        range: ConfocalMultiChannelMode
        description: This field defines whether the the the Aquisiton of Multiple Channels for this Image happened in a Parallel
          (i.e., multiple channels acquired at the same time), or Sequentail (i.e., one channel after the other) manner.
        required: true
        annotations:
          Tier: '2'
      ScanTime:
        range: float
        description: This records the time in seconds required to acquire a given number of lines, frames or stacks including
          the time required for repositioning the scanning device to the starting point. Refer to https://www.iso.org/standard/69820.html
          for further details and measurement methods.
        required: true
        annotations:
          Tier: '2'
      ScanTimeUnit:
        range: UnitsTime
        required: true
        annotations:
          Tier: '2'
          description_source: derived from ConfocalScannerSettings.ScanTime
        description: The unit of ScanTime.
      ' ConfocalFieldNumber':
        range: float
        description: This field recors the Field Number of the Confocal scan optic is expressed as the objective magnification
          times the maximum diameter of the scanned field; [mm], obtained without shifting the position of the specimen and
          without stitching single images into a total larger image. Because images generally have a square format, the diameter
          of the scanned field is equals to the square root of 2 times the length of X dimension of the scanned field. Refer
          to https://www.iso.org/standard/69820.html for further details and measurement methods.
        annotations:
          Tier: '3'
      Rotation:
        range: float
        description: This field records the Rotation angle of the scan region.
        annotations:
          Tier: '3'
      RotationUnit:
        range: UnitsAngle
        annotations:
          Tier: '3'
          description_source: derived from ConfocalScannerSettings.Rotation
        description: The unit of Rotation.
      ScanningFrequency:
        range: PercentFraction
        description: This field records the Scanning Frequency is defined at the ratio between the Number of scanning element
          (Lines, Frames or Stacks) acquired and ScanTime. Refer to https://www.iso.org/standard/69820.html for further details
          and measurement methods.
        annotations:
          Tier: '3'
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  AcoustoOpticalTuneableFilterSettings:
    description: This element holds the Setting applied to an Acousto Optical Tunable Filter (AOTF) used during the Acquisition
