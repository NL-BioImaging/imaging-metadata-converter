id: https://github.com/NL-BioImaging/imaging-metadata-converter/models/imaging
name: imaging
title: Imaging metadata model
description: 'Microscopy imaging metadata, based on the LiMi (4DN-BINA-OME) model: converted from models/LiMi_XMLSchema.xsd
  (version 02.00, namespace http://www.NamespaceTest.org/Schemas/NBO/2020-11).'
version: 1.2.0
comments:
- 'Descriptions annotated with description_source "OME 2016-06 ome.xsd" are from the OME Data Model (Copyright (C) 2002 -
  2016 Open Microscopy Environment), licensed under CC BY 3.0: http://www.openmicroscopy.org/info/attribution'
- 'exact_mappings/close_mappings with the ome: prefix name the corresponding classes and fields of the OME LinkML schema (https://github.com/gouttegd/yamf-playground/blob/main/linkml/ome/ome.yaml).'
see_also:
- https://www.openmicroscopy.org/Schemas/Documentation/Generated/OME-2016-06/ome.html
- https://github.com/gouttegd/yamf-playground/blob/main/linkml/ome/ome.yaml
prefixes:
  linkml: https://w3id.org/linkml/
  imaging: https://github.com/NL-BioImaging/imaging-metadata-converter/models/imaging/
  ome: https://schemas.incenp.org/ome/v1/core/
default_prefix: imaging
default_range: string
imports:
- linkml:types
- imaging_units
- imaging_provenance
- imaging_extension
types:
  base64Binary:
    typeof: string
  AnnotationID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Annotation:\S+)|(Annotation:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ROIID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:\S+)|(\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ShapeID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Shape:\S+)|(Shape:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  PlateID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Plate:\S+)|(Plate:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ReagentID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Reagent:\S+)|(Reagent:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ScreenID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Screen:\S+)|(Screen:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  PlateAcquisitionID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:PlateAcquisition:\S+)|(PlateAcquisition:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  WellID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Well:\S+)|(Well:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  WellSampleID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:WellSample:\S+)|(WellSample:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  Denomination:
    typeof: string
    description: A user-defined designation [i.e. name] for this element.
  Hex40:
    typeof: string
    description: Binary contents coded in hexadecimal (20 characters long)
    annotations:
      xsd_length: '20'
  NonNegativeFloat:
    typeof: float
    description: A simple type that restricts the value to a float between >=0 and max 32-bit float {i.e. (2−2^-23) × 2^27
      ≈ 3.4 × 10^38}
    minimum_value: 0
  NonNegativeLong:
    typeof: integer
    description: A simple type that restricts the value to a long between 0 and 9223372036854775807 (inclusive).
    minimum_value: 0
  NonNegativeInt:
    typeof: integer
    description: A simple type that restricts the value to an integer between 0 and 2,147,483,647 (inclusive).
    minimum_value: 0
  PositiveInt:
    typeof: integer
    description: A simple type that restricts the value to an integer between 1 and 2,147,483,647 (inclusive).
    minimum_value: 1
  PositiveFloat:
    typeof: float
    description: A simple type that restricts the value to a float between >0 and max 32-bit float {i.e. (2−2^-23) × 2^27
      ≈ 3.4 × 10^38}
    annotations:
      xsd_minExclusive: '0.0'
    minimum_value: 0
  PercentFraction:
    typeof: float
    description: A simple type that restricts the value to a float between 0 and 1 (inclusive).
    maximum_value: 1.0
    minimum_value: 0.0
  UniversallyUniqueIdentifier:
    typeof: uri
    description: This is a unique ID for the file but does not conform to the ID pattern used in the rest of the file. The
      rest of the IDs are either an full LSID or an internal ID which is a string that is simply unique in this file. As the
      UniversallyUniqueIdentifier is used from outside this file to identify it having the same ID in another file could cause
      problems. A UUID is 32 hexadecimal digits, in 5 groups, 8-4-4-4-12, separated by hyphens e.g.......................
      urn:uuid:3e450fae-b8f2-4d35-aa54-702168b2487f There are methods to generate these in most modern languages. http://www.ietf.org/rfc/rfc4122.txt
    pattern: (urn:uuid:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})
  Color:
    typeof: integer
    description: 'A simple type that identifies itself as a Color, the value is an integer between -2,147,483,648 and 2,147,483,647
      (inclusive). The value is a signed 32 bit encoding of RGBA so "-1" is #FFFFFFFF or solid white. NOTE: Prior to the 2012-06
      schema the default values were incorrect and produced a transparent red not solid white.'
  LSID:
    typeof: string
    description: 'Either LSID or internal consistent IDs for the file See: http://www.openmicroscopy.org/site/support/file-formats/working-with-ome-xml/id-and-lsid'
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:\S+:\S+)|(\S+:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ProjectID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Project:\S+)|(Project:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  DatasetID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Dataset:\S+)|(Dataset:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ImageID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Image:\S+)|(Image:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  PixelsID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Pixels:\S+)|(Pixels:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  PlaneID:
    typeof: LSID
  ChannelID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Channel:\S+)|(Channel:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ModuleID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Module:\S+)|(Module:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  FolderID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Folder:\S+)|(Folder:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ExperimenterID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Experimenter:\S+)|(Experimenter:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ExperimenterGroupID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:ExperimenterGroup:\S+)|(ExperimenterGroup:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  ExperimentID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Experiment:\S+)|(Experiment:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  MicrobeamManipulationID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:MicrobeamManipulation:\S+)|(MicrobeamManipulation:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  InstrumentID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Instrument:\S+)|(Instrument:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  MicroscopeID:
    typeof: LSID
  ObjectiveID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Objective:\S+)|(Objective:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  LightSourceID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:LightSource:\S+)|(LightSource:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  FilterSetID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:FilterSet:\S+)|(FilterSet:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  DichroicID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Dichroic:\S+)|(Dichroic:\S+)
      xsd_pattern_use: 'advisory: IDs and references accept any string (user)'
  FilterID:
    typeof: LSID
    annotations:
      xsd_pattern: (urn:lsid:([\w\-\.]+\.[\w\-\.]+)+:Filter:\S+)|(Filter:\S+)
