      Tier: '1'
  DeformableMirrorSettings:
    description: This element holds the Setting applied to a Deformable Mirror used during the Acquisition of this Channel
      as well as a reference (the ID attribute) to the Deformable Mirror in question.
    is_a: ElectroOpticalDeviceSettings
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  ElectroOpticalModulatorSettings:
    description: This element holds the Setting applied to an Electro-Optical Modulator used during the Acquisition of this
      Channel as well as a reference (the ID attribute) to the Electro-Optical Modulator in question.
    is_a: ElectroOpticalDeviceSettings
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  PockelCellSettings:
    description: This element holds the Setting applied to a PockelCell used  during the Acquisiton of this Channel as well
      as a reference (the ID attribute) to the PockelCell in question.
    is_a: ElectroOpticalDeviceSettings
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '2'
  LiquidCrystalTuneableFilterSettings:
    description: This element holds the Setting applied to a Liquid Crystal Tunable Filter (LCTF) used during the Acquisition
      of this Channel as well as a reference (the ID attribute) to the LCTF in question.
    is_a: ElectroOpticalDeviceSettings
    attributes:
      PolarizationRotation:
        range: float
        description: A Pockels cell is a device consisting of an electro-optic crystal (with some electrodes attached to it)
          through which a light beam can propagate. The phase delay in the crystal (→ Pockels effect) can be modulated by
          applying a variable electric voltage. Alignment of the crystal axis with the light beam axis is critical. This field
          records the polarization rotation applied to the beam during the acquisition of this Channel.
        annotations:
          Tier: '2'
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  SpatialLightModulatorSettings:
    description: This element holds the Setting applied to a Spatial Light Modulator used during the Acquisition of this Channel
      as well as a reference (the ID attribute) to the Spatial Light Modulator in question.
    is_a: ElectroOpticalDeviceSettings
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  DiffractionGratingSettings:
    description: This element holds the Setting applied to a Diffraction Grating used during the Acquisition of this Channel
      as well as a reference (the ID attribute) to the Diffraction Grating in question.
    is_a: OpticalApertureSettings
    attributes:
      DiffractionEfficiency:
        range: PercentFraction
        description: This is a measure of the performance efficiency of this device. It's a measure of how much optical power
          is diffracted into a designated direction compared to the power incident onto the diffractive element.
        annotations:
          Tier: '2'
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  MaskingPlateSettings:
    description: This element holds the Setting applied to a Masking Plate used during the Acquisition of this Channel as
      well as a reference (the ID attribute) to the Masking Plate in question.
    is_a: OpticalApertureSettings
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '2'
  PinholeSettings:
    description: This element holds the Setting applied to a Pinhole used during the Acquisition of this Channel as well as
      a reference (the ID attribute) to the Pinhole in question.
    is_a: OpticalApertureSettings
    attributes:
      Aperture:
        range: float
        description: This refers to the Diameter of the Pin Hole's Aperture that was set for this Acquisition, expressed in
          Airy units.
        required: true
        annotations:
          Tier: '1'
    annotations:
      Extension: Advanced+Confocal
      Domain: ImageAcquisitionSettings
      Category: Settings
      Tier: '1'
  IntensityCalibrationTool:
    description: A tool, such as the Meta-Max calibration toold developed by the 4D Nucleome Imaging Standards Working Group,
      used to perform an intensity calibration procedure.
    is_a: ManufacturerSpec
    attributes:
      LightSensor:
        inlined: false
