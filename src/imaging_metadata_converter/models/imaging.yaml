    description: This field records the function of this Prism. Beam-shaping (i.e., Anamorphic) Prism pairs are used for reshaping
      the profile of a laser beam. For example, the elliptical beam from a laser diode can be transformed into a beam with
      circular cross-section, by magnifying the elliptical beam in one dimension. They can also be used to convert a circular
      beam into an elliptical beam. Dispersing prisms can be employed to bend and separate light into its component wavelengths.
