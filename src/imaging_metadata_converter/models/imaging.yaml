        description: This field captures the general category to which this Intensity Calibration tool belongs.
        required: true
        annotations:
          Tier: '2'
      CalibrationType:
        range: IntensityCalibrationType
        description: The type of calibration proceudure this tool is intended to perform.
        required: true
        annotations:
          Tier: '2'
      LastCalibrationDate:
        range: date
        description: This field records the Date in which the most recent Calibration Procedure of this Calibration Tool was
          performed.
        annotations:
          Tier: '2'
    annotations:
      Extension: Calibration and Performance
      Domain: MicroscopeHardwareSpecifications
      Category: CalibrationTools
      Tier: '2'
  LightSensor:
    description: A tool, such as the Meta-Max calibration toold developed by the 4D Nucleome Imaging Standards Working Group,
      used to perform an intensity calibration procedure.
    is_a: ManufacturerSpec
    attributes:
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '3'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Name:
