      Category: CalibrationTools
      Tier: '2'
  OpticalCalibration:
    description: This describes the procedure that was used for Optical Calibration and the resulting Calibration measurements.
    attributes:
      OpticalCalibrationImage:
        inlined: false
        annotations:
          xsd_element: OpticalCalibrationImageRef
        multivalued: true
        required: true
        description: This is an empty element that refers to an Image (typically a z-stack) obtained by observing the Optical
          Standard used in this instance and Acquired using the same Instrument and Settings employed to acquire the experimental
          Image this calibration refers to.
        range: Image
      PSFEquationFile:
        range: FileAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element refers to any type of file describing the PSF Equation that was used in this case.
        annotations:
          Extension: Calibration and Performance
          Domain: ImageAcquisitionSettings
          Category: ChildElement
          Tier: '2'
      OpticalCalibrationReport:
        range: FileAnnotation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element refers to any File containing a report generated by the Calibration Software referred to
          in Calibration procedure.
        annotations:
          Extension: Calibration and Performance
          Domain: ImageAcquisitionSettings
          Category: ChildElement
          Tier: '3'
      ChromaticRegistrationEvaluation:
        range: ChromaticRegistrationEvaluation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: 'According to ISO 21073:2019, co-registration accuracy measures the capacity of a microscope system to
          image a fluorescent object with different excitation and emission Wavelengths at the same position in the Image.
          Hence, the spatial distance of the Image positions of a Point-like object (i.e., Spot or Point Emitter) located
          in the centre of the Field of View (FOV) for different excitation and detection Wavelength bands is denoted as co-registration
          accuracy. The co-registration accuracy shall be calculated from the Intensity maxima or the Intensity centre of
          gravity of the Image of the Point-like object for the different Wavelengths. The lateral co-registration accuracy
          is expressed as: ∆lateral = √(xλ1 - xλ2)^2 + (yλ1 - yλ2)^2; and the axial co-registration accuracy is expressed
          as: ∆axial = √(zλ1 - zλ2)^2. This element refers to the results of a specific Co-registration Accuracy evaluation
          assay associated with this Optical Calibration procedure.'
      FieldUniformityEvaluation:
        range: FieldUniformityEvaluation
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This describes the procedure that was used to measure the Field dependent variations in the pixel-to-pixel
          sensitivity of the detector and/or by distortions in the optical path.
      OpticalCalibrationStandard:
        range: OpticalCalibrationStandard
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
        description: This element refers to the Optical Calibration Standard used in this case. This might be a pre-manufactured
          slide, such as those produced by Chroma (https://www.chroma.com/products/accessories/92001-autofluorescent-plastic-slides),
          Argolight (http://argolight.com/), Geller MicroAnalytical Laboratory (Magnification Reference Standard MRS-4 and
          others; http://www.gellermicro.com/mag_standards/mrs.html), Zeiss and others. Alternatively, the standard might
          be a slide containing multi-colored beads of known size and emission characteristics. Finally, slides coated with
          specific DNA origami patterns are increasingly being used for this purpose as well.
        annotations:
          xsd_element: OpticalCalibrationStandardGroup
      CalibrationSoftware:
        range: CalibrationSoftware
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a software tool utilized to analyze Calibration metrics obtained from this Calibration
          Procedure and generate a suitable Calibration Reports. As an example, such a Software tool might analyzes microscopy
          images of fluorescent Colored Beads in order to quantify the Resolution and Chromatic Registration of a fluorescence
          microsocope over the full Field of View (FOV). An example of such a tool is PSFj (http://www.knoplab.de/psfj/sample-page/).
          Alternatively, such a Software tool might be used to extract Intensity Calibration results obtained with a specific
          Intensity Calibration Tool, such as a Power Meter or MetaMax (https://www.umassmed.edu/grunwaldlab/).
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '3'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Date:
        range: date
        description: Ths field records the Date in which this Calibration procedure was performed.
        required: true
        annotations:
          Tier: '2'
      TheoreticalXYSpotSize_FWHM:
        range: float
        description: This field captures the Theoretical (expected) lateral spot size expressed as the Full Width at Half
          Maximum (FWHM) of the Point Spread Function (PSF) intensity profile fitted using a Gaussian function, on the basis
          of the given optical conditions. This is a measure of the expected resolution of the system in the xy-plane. This
          value should be calculated in a manner as to be compared to the Median XY Spot Size_FWHM.
        annotations:
          Tier: '2'
      TheoreticalXYSpotSize_FWHMUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from OpticalCalibration.TheoreticalXYSpotSize_FWHM
        description: The unit of TheoreticalXYSpotSize_FWHM.
      MedianXYSpotSize_FWHM:
        range: float
        description: An important way of evaluating the effective resolution of any Microscope, consists in measuring the
          size and shape of the observed Point Spread Function (PSF) generated by imaging one or more fluorescent Point-like
          objects (i.e., Point Emitters) under conditions that are identical to those used to Acquire a given experimental
          Image. More specifically and according to ISO 21073:2019, lateral Resolution is defined by the FWHM of the intensity
          signal along a lateral direction through the centre of a fluorescent Point-like object (i.e., Spot or Point Emitter)
          positioned at the center of the Field of View (FOV). This field captures the average Observed Median lateral (i.e.,
          in the xy-plane) Spot Sze expressed as the Full Width at Half Maximum (FWHM) of the Point Spread Function (PSF)
          intensity profile fitted using an Elliptic Gaussian function. Ideally this measurement should be reflective of multiple
          individual Point Emitter observations across the Field of View (FOV). However, if a single measurement is taken,
          it is essential that this be taken from the center of the Objective FOV.
        annotations:
          Tier: '2'
      MedianXYSpotSize_FWHMUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from OpticalCalibration.MedianXYSpotSize_FWHM
        description: The unit of MedianXYSpotSize_FWHM.
      MinXYSpotSize_FWHM:
        range: float
        description: An important way of evaluating the effective resolution of any Microscope, consists in measuring the
          size and shape of the observed Point Spread Function (PSF) generated by imaging one or more fluorescent Point-like
          objects (i.e., Point Emitters) under conditions that are identical to those used to Acquire a given experimental
          Image. More specifically and according to ISO 21073:2019, lateral Resolution is defined by the FWHM of the intensity
          signal along a lateral direction through the centre of a fluorescent Point-like object (i.e., Spot or Point Emitter)
          positioned at the center of the Field of View (FOV). This field captures the average Observed Minimum lateral (i.e.,
          in the xy-plane) Spot Sze expressed as the Full Width at Half Maximum (FWHM) of the Point Spread Function (PSF)
          intensity profile fitted using an Elliptic Gaussian function. Ideally this measurement should be reflective of multiple
          individual Point Emitter observations across the Field of View (FOV). However, if a single measurement is taken,
          it is essential that this be taken from the center of the Objective FOV.
        annotations:
          Tier: '2'
      MinXYSpotSize_FWHMUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from OpticalCalibration.MinXYSpotSize_FWHM
        description: The unit of MinXYSpotSize_FWHM.
      MaxXYSpotSize_FWHM:
        range: float
        description: An important way of evaluating the effective resolution of any Microscope, consists in measuring the
          size and shape of the observed Point Spread Function (PSF) generated by imaging one or more fluorescent Point-like
          objects (i.e., Point Emitters) under conditions that are identical to those used to Acquire a given experimental
          Image. More specifically and according to ISO 21073:2019, lateral Resolution is defined by the FWHM of the intensity
          signal along a lateral direction through the centre of a fluorescent Point-like object (i.e., Spot or Point Emitter)
          positioned at the center of the Field of View (FOV). This field captures the average Observed Maximum lateral (i.e.,
          in the xy-plane) Spot Sze expressed as the Full Width at Half Maximum (FWHM) of the Point Spread Function (PSF)
          intensity profile fitted using an Elliptic Gaussian function. Ideally this measurement should be reflective of multiple
          individual Point Emitter observations across the Field of View (FOV). However, if a single measurement is taken,
          it is essential that this be taken from the center of the Objective FOV.
        annotations:
          Tier: '3'
      MaxXYSpotSize_FWHMUnit:
        range: float
        annotations:
          Tier: '3'
          description_source: derived from OpticalCalibration.MaxXYSpotSize_FWHM
        description: The unit of MaxXYSpotSize_FWHM.
      TheoreticaZSpotSize_FWHM:
        range: float
        description: This field captures the Theoretical (expected) z-axial spot size expressed as the Full Width at Half
          Maximum (FWHM) of the Point Spread Function (PSF) intensity profile fitted using a Gaussian function, on the basis
          of the given optical conditions. This is a measure of the expected resolution of the system in the z-plane. This
          value should be used calculated in a manner as to be compared to the median Z spot size.
        annotations:
          Tier: '2'
      TheoreticaZSpotSize_FWHMUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from OpticalCalibration.TheoreticaZSpotSize_FWHM
        description: The unit of TheoreticaZSpotSize_FWHM.
      MedianZSpotSize_FWHM:
        range: float
        description: An important way of evaluating the effective resolution of any Microscope, consists in measuring the
          size and shape of the observed Point Spread Function (PSF) generated by imaging one or more fluorescent Point-like
          objects (i.e., Point Emitters) under conditions that are identical to those used to Acquire a given experimental
          Image. More specifically and according to ISO 21073:2019, axial Resolution is defined by the FWHM of the intensity
          signal along the axial direction through the centre of a fluorescent Point-like object (i.e., Spot or Point Emitter)
          positioned at the center of the Field of View (FOV). This field captures the average Observed Median Z-axial Spot
          Sze expressed as the Full Width at Half Maximum (FWHM) of the Point Spread Function (PSF) intensity profile fitted
          using an Elliptic Gaussian function. Ideally this measurement should be reflective of multiple individual Point
          Emitter observations across the Field of View (FOV). However, if a single measurement is taken, it is essential
          that this be taken from the center of the Objective FOV.
        annotations:
          Tier: '2'
      MedianZSpotSize_FWHMUnit:
        range: float
        annotations:
          Tier: '2'
          description_source: derived from OpticalCalibration.MedianZSpotSize_FWHM
        description: The unit of MedianZSpotSize_FWHM.
      CheckedNA:
        range: boolean
        description: In case the Numerical Aperture (NA) of the Objective utilized to perform this Optical Calibration is
          variable (i.e., as for example in case of Objectives that can be used with or without Cover Glass or Objectives
          that can be dipped in different media), this field capture whether (True) or not (False) a manual check was performed
          to confirm that the Numerical Aperture was set to the Maximum allowable value. This check is necessary because often
          NA regulation in these types of Objectives occurs via a rotating collar whose exact position is difficult to measure
          and reproduce across different Experiments. In this context, setting the collar to the Maximum NA position is desirable
          not only because it is more easy to reproduce and it best to estimate the maximal resolution of the system.
        annotations:
          Tier: '2'
      Z-Dimension:
        range: boolean
        description: This field records whether (True) or not (False) this Optical Calibration procedure was performed using
          XY or XYZ Images of the Optical Standard sample.
        annotations:
          Tier: '2'
      NyquistRate:
        range: float
        description: This field captures the ratio between the Pixel Size and the Nyquist Criterion. The Nyquist-Shannon sampling
          theorem establishes that 'when sampling a signal (e.g., converting from an analog signal to digital), the sampling
          frequency must be greater than twice the Band Width of the input signal in order to be able to reconstruct the original
          perfectly from the sampled version' (Whittaker E.T., (1915). Proc. Roy. Soc. Edinburgh Sect. A, 25:181; Shannon
          C.E., (1949) Proc. IRE, 37:10). The Nyquist Criterion determines the minimal Sampling Density needed to capture
          ALL information from the Specimen into the Image. It can be shown that if the Sampling Density is higher than the
          Nyquist Rate (also referred to as Critical Sampling Distance) all information about the object is captured. It is
          important to note that the Nyquist Rate depends on the Objective Numerical Aperture (NA) and on the Excitation and
          Emission WaveLengths. The recommended Nyquist Rate is > 2 for conventional light microscopy, and it is 2.5 - 3 for
          high resolution imaging.
        annotations:
          Tier: '2'
      SampleSize:
        range: PositiveInt
        description: This field captures the Sample size that was used to calculate the reported Optical Calibration metrics.
          For example, this might represent the number of Colored Beads that were utilized to gather data on the Optical performance
          of the Microscope.
        annotations:
          Tier: '2'
      PSFEquation:
        range: string
        description: This field captures the Equation that was used to perform the Eliptical PSF Gaussian Fit.
        annotations:
          Tier: '2'
      Planarity:
        range: float
        description: This is a measure of the flatness of the focal plane across the Field of View (FOV). The planarity of
          the focal plane is calculated from the observed z-position of the best focus of each Point Emitter. It indicates
          focal aberrations or tilt. Ideally this measurement should be reflective of multiple individual Point Emitter observations
          across the Field of View (FOV). However, if a single measurement is taken, it is essential that this be taken from
          the center of the Objective FOV.
        annotations:
          Tier: '3'
      PlanarityUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '3'
          description_source: derived from OpticalCalibration.Planarity
        description: The unit of Planarity.
      LateralAsymmetry:
        range: float
        description: This field reports the mean +/- standard deviation over the Field of View (FOV) of the observed Point
          Spread Function (PSF) Lateral Asymmetry (i.e. the ratio of the minimum lateral FWMH over the maximum lateral FWHM).
          It indicates the presence of optical aberrations. Ideally this measurement should be reflective of multiple individual
          Point Emitter observations across the Field of View (FOV). However, if a single measurement is taken, it is essential
          that this be taken from the center of the Objective FOV.
        annotations:
          Tier: '3'
      AxialAsymmetry:
        range: float
        description: This field reports the mean +/- standard deviation over the Field of View (FOV) of the observed Point
          Spread Function (PSF) Axial Asymmetry (i.e. the ratio of the minimum axial FWMH over the maximum axial FWHM; also
          referred to as Spherical Aberration). It indicates the presence of optical aberrations. Ideally this measurement
          should be reflective of multiple individual Point Emitter observations across the Field of View (FOV). However,
          if a single measurement is taken, it is essential that this be taken from the center of the Objective FOV.
        annotations:
          Tier: '3'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationProcedure
      Tier: '2'
  FieldUniformityEvaluation:
    description: This describes the procedure that was used to measure the Field dependent variations in the pixel-to-pixel
      sensitivity of the detector and/or by distortions in the optical path.
    attributes:
      FlatFieldImage:
        inlined: false
        annotations:
          xsd_element: FlatFieldImageRef
        multivalued: true
        required: true
        description: This is an empty element that refers to an Image obtained from a Standard Slide designed to eavluate
          the Field of View (FOV) dependent variations in the pixel-to-pixel sensitivity of the detector and/or by distortions
          in the Optical Path.
        range: Image
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      MaxIntensityPixelXCoordinate:
        range: float
        description: This field reports the x-axis coordinate of the Pixel that has the Maximum Intensity in the Image used
          for this Flat Field Calibration procedure.
        annotations:
          Tier: '2'
      MaxIntensityPixelYCoordinate:
        range: float
        description: This field reports the y-axis coordinate of the Pixel that has the Maximum Intensity in the Image used
          for this Flat Field Calibration procedure.
        annotations:
          Tier: '2'
      MeanMaxtoCornerIntensityRatio:
        range: float
        description: This field reports the Mean between the Ratios obtained by comparing the Maximum Pixel Intensity and
          the Intensities of the four corner Pixels of the Image used for this Flat Field Calibration procedure.
        annotations:
          Tier: '2'
      SDMaxtoCornerIntensityRatio:
        range: float
        description: This field reports the Standard Deviation between the Ratios obtained by comparing the Maximum Pixel
          Intensity and the Intensities of the four corner Pixels of the Image used for this Flat Field Calibration procedure.
        annotations:
          Tier: '2'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationProcedure
      Tier: '2'
  ChromaticRegistrationEvaluation:
    description: 'According to ISO 21073:2019, co-registration accuracy measures the capacity of a microscope system to image
      a fluorescent object with different excitation and emission Wavelengths at the same position in the Image. Hence, the
      spatial distance of the Image positions of a Point-like object (i.e., Spot or Point Emitter) located in the centre of
      the Field of View (FOV) for different excitation and detection Wavelength bands is denoted as co-registration accuracy.
      The co-registration accuracy shall be calculated from the Intensity maxima or the Intensity centre of gravity of the
      Image of the Point-like object for the different Wavelengths. The lateral co-registration accuracy is expressed as:
      ∆lateral = √(xλ1 - xλ2)^2 + (yλ1 - yλ2)^2; and the axial co-registration accuracy is expressed as: ∆axial = √(zλ1 -
      zλ2)^2. This element refers to the results of a specific Co-registration Accuracy evaluation assay associated with this
      Optical Calibration procedure.'
    attributes:
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      ReferenceWavelength:
        range: float
        description: This field captures the Wavelength of the Reference Channel against which the Chromatic Registration
          Accuracy is being calculated in this procedure.
        required: true
        annotations:
          Tier: '2'
      ReferenceWavelengthUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from ChromaticRegistrationEvaluation.ReferenceWavelength
        description: The unit of ReferenceWavelength.
      TestWavelength:
        range: float
        description: This field captures the Wavelength of the Test Channel whose Chromatic Registration Accuracy is being
          calculated in this procedure.
        required: true
        annotations:
          Tier: '2'
      TestWavelengthUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from ChromaticRegistrationEvaluation.TestWavelength
        description: The unit of TestWavelength.
      XChromaticShift_RT:
        range: float
        description: 'This field captures the offset in the the observed X-coordinate of the Intensity maxima or the Intensity
          centre of gravity of the Image of a Point-like object (i.e., Spot or Point Emitter) when comparing the Reference
          vs. the Test Wavelengths. This shall be calculates as: √(xλT - xλR)^2, where This offset could be reported either
          in number of Pixels or in physical Distance, when a sub-Pixel offset needs to be calculated.'
        annotations:
          Tier: '2'
      XChromaticShift_RTUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from ChromaticRegistrationEvaluation.XChromaticShift_RT
        description: The unit of XChromaticShift_RT.
      YChromaticShift_RT:
        range: float
        description: 'This field captures the offset in the the observed Y-coordinate of the Intensity maxima or the Intensity
          centre of gravity of the Image of a Point-like object (i.e., Spot or Point Emitter) when comparing the Reference
          vs. the Test Wavelengths. This shall be calculates as: √(xλT - xλR)^2, where This offset could be reported either
          in number of Pixels or in physical Distance, when a sub-Pixel offset needs to be calculated.'
        annotations:
          Tier: '2'
      YChromaticShift_RTUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '3'
          description_source: derived from ChromaticRegistrationEvaluation.YChromaticShift_RT
        description: The unit of YChromaticShift_RT.
      XChromaticShift_TR:
        range: float
        description: 'This field captures the offset in the the observed X-coordinate of the Intensity maxima or the Intensity
          centre of gravity of the Image of a Point-like object (i.e., Spot or Point Emitter) when comparing the Test vs.
          the Reference Wavelengths. This shall be calculates as: √(xλR - xλT)^2, where This offset could be reported either
          in number of Pixels or in physical Distance, when a sub-Pixel offset needs to be calculated.'
        annotations:
          Tier: '2'
      XChromaticShift_TRUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from ChromaticRegistrationEvaluation.XChromaticShift_TR
        description: The unit of XChromaticShift_TR.
      YChromaticShift_TR:
        range: float
        description: 'This field captures the offset in the the observed Y-coordinate of the Intensity maxima or the Intensity
          centre of gravity of the Image of a Point-like object (i.e., Spot or Point Emitter) when comparing the Test vs.
          the Reference Wavelengths. This shall be calculates as: √(xλR - xλT)^2, where This offset could be reported either
          in number of Pixels or in physical Distance, when a sub-Pixel offset needs to be calculated.'
        annotations:
          Tier: '2'
      YChromaticShift_TRUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '3'
          description_source: derived from ChromaticRegistrationEvaluation.YChromaticShift_TR
        description: The unit of YChromaticShift_TR.
      AxialChromaticShift_RT:
        range: float
        description: 'This field captures the offset in the the observed Z-coordinate of the Intensity maxima or the Intensity
          centre of gravity of the Image of a Point-like object (i.e., Spot or Point Emitter) when comparing the Reference
          vs. the Test Wavelengths. This shall be calculates as: √(zλT - zλR)^2, where This offset could be reported either
          in number of Pixels or in physical Distance, when a sub-Pixel offset needs to be calculated.'
        annotations:
          Tier: '2'
      AxialChromaticShift_RTUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from ChromaticRegistrationEvaluation.AxialChromaticShift_RT
        description: The unit of AxialChromaticShift_RT.
      AxialChromaticShift_TR:
        range: float
        description: 'This field captures the offset in the the observed Z-coordinate of the Intensity maxima or the Intensity
          centre of gravity of the Image of a Point-like object (i.e., Spot or Point Emitter) when comparing the Test vs.
          the Reference Wavelengths. This shall be calculates as: √(zλT - zλR)^2, where This offset could be reported either
          in number of Pixels or in physical Distance, when a sub-Pixel offset needs to be calculated.'
        annotations:
          Tier: '2'
      AxialChromaticShift_TRUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from ChromaticRegistrationEvaluation.AxialChromaticShift_TR
        description: The unit of AxialChromaticShift_TR.
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationProcedure
      Tier: '2'
  FluorescentReferenceSlide:
    description: This element describes a Fluorescent Reference Slide. These Slides provide a uniform fluorescent field and
      therefore they enable to check how evenly a Excitation Light Source is filling the Field of View (FOV), and whether
      it is centered. These Slides are easy to use an cheap. However they are typically made of plastic and it is often difficult
      to ensure the reproducibility of their emission properties. These Slides are mostly known to be produced by Chroma,
      but similar products are available from Ted Pella or Thorlabs.
    is_a: OpticalCalibrationStandard
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationSample
      Tier: '2'
  ColoredBeadsSlide:
    description: This element describes a Slide coated with Multicolor Fluorescent Microspheres (also known as Multicolored
      Beads) used for assessing the Optical properties of the Microscope that was used to acquire this experimental Image.
      These Slides can be used to measure Optical properties such as resolution, chromatic registration, and different kinds
      of optical distorsions.
    is_a: OpticalCalibrationStandard
    attributes:
      ColoredBeads:
        range: ColoredBeads
        inlined: true
        required: true
        description: This element describes a preparation of multi-Colored Fluorescent Beads (also referred to as  Microspheres)
          used to facilitate the optical calibration of conventional fluorescence microscopes, confocal laser scanning microscopes,
          and associated image-processing equipments. These Beads are usually made of glass or plastic microspheres stained
          with one or more fluorescent dyes.
      Date:
        range: date
        description: This field captures the Date in which this Colored Beads Slide was prepared.
        annotations:
          Tier: '2'
      BeadVolume:
        range: float
        description: This field captures the Volume of the Multi Color Microspheres preparation that was utilized to prepare
          this Slide.
        annotations:
          Tier: '2'
      BeadVolumeUnit:
        range: UnitsVolume
        ifabsent: string(µl)
        annotations:
          Tier: '2'
          description_source: derived from ColoredBeadsSlide.BeadVolume
        description: The unit of BeadVolume.
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationSample
      Tier: '2'
  CalibrationStandardSlide:
    description: This element describes a Standard Calibration Slide (also referred to as Standard Test Slide) used for assessing
      the Optical properties of the Microscope that was used to acquire this experimental Image. These Slides can be used
      to measure multiple different Optical properties including resolution, chromatic registration, magnification, distance,
      and different kinds of optical distorsions.
    is_a: OpticalCalibrationStandard
    attributes:
      PatternImage:
        inlined: false
        annotations:
          xsd_element: PatternImageRef
          Tier: '2'
        required: true
        description: This is an empty element that refers to an Image depcting the pattern etched on this Calibration Slide.
        range: Image
      Type:
        range: CalibrationSlideType
        description: The type of calibration slide used in this case. Examples include slides produced by Argolight, Geller
          MicroAnalytical Laboratory, PSFCheck, Zeiss and others.
        required: true
        annotations:
          Tier: '2'
      CalibrationMeasure:
        range: CalibrationMeasure
        description: This field captures the Optical characteristic this Slide is intended to calibrate, examples include
          Co-registration Accuracy, Detector linearity, Distance, Magnification, Optical distorsion, Resolution, or Multi.
        required: true
        annotations:
          Tier: '2'
      ImagedArea:
        range: string
        description: This field describes the specific region or sets or regions of the Calibration Slide that have been used
          for this Optical Calibration procedure.
        annotations:
          Tier: '2'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationSample
      Tier: '2'
  DNAOrigami:
    description: This element describes an Standard Test Slide constructed using the DNA Origami technique.
    is_a: OpticalCalibrationStandard
    attributes:
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        required: true
        description: This element holds a free text multi-line optional description for this component.
      Size:
        range: float
        description: This field capture the Full Width at Half Maximum (FWHM) of the fluorescence emitters associated with
          this DNA Origami-based microscopy standard slide.
        required: true
        annotations:
          Tier: '2'
      SizeUnit:
        range: UnitsLength
        annotations:
          Tier: '2'
          description_source: derived from DNAOrigami.Size
        description: The unit of Size.
      Type:
        range: DNAOrigamiEmitterType
        description: This field captures the type of fluorescence emitter(s) associated with this DNA Origami-based Optical
          Calibration Standard used in this case. Options include Point-Source and Nanoruler.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationSample
      Tier: '2'
  ColoredBeads:
    description: This element describes a preparation of multi-Colored Fluorescent Beads (also referred to as  Microspheres)
      used to facilitate the optical calibration of conventional fluorescence microscopes, confocal laser scanning microscopes,
      and associated image-processing equipments. These Beads are usually made of glass or plastic microspheres stained with
      one or more fluorescent dyes.
    is_a: ManufacturerSpec
    attributes:
      WavelengthRange:
        range: WavelengthRange
        inlined: true
        required: true
        description: This element records a range of Wavelengths this component is designed for, according to the Manufacturer.
          Multiple of this element may be used.
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '2'
      Diameter:
        range: float
        description: This field captures the Diameter of these Colored Beads.
        required: true
        annotations:
          Tier: '2'
      DiameterUnit:
        range: UnitsLength
        ifabsent: string(nm)
        description: The unit of Diameter.
        annotations:
          description_source: derived from ColoredBeads.Diameter
      Concentration:
        range: float
        description: This field captures the concentration of these Colored Beads.
        required: true
        annotations:
          Tier: '2'
      ConcentrationUnit:
        range: UnitsConcentration
        ifabsent: string(Units/ml)
        description: The unit of Concentration.
        annotations:
          description_source: derived from ColoredBeads.Concentration
      Type:
        range: BeadType
        description: This field captures the type of these Colored Beads.
        annotations:
          Tier: '2'
      Material:
        range: string
        description: This field capture the Material that is used to construct these Colored Beads.
        annotations:
          Tier: '2'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationSamples
      Tier: '2'
  ExcitationCalibration:
    description: This element describes the procedure used to measure and calibrate the Wavelength and Irradiance of the Excitation
      Light Source used to Acquire this experimental Image and the resulting calibration measurements.
    is_a: IntensityCalibration
    attributes:
      SpinningDiskInLightPath:
        range: boolean
        description: In case of a Spinning Disk Confocal Microscope, this field records whether (True) or not (False)  the
          Spinning Disk was placed in the Light Path during this Calibration Procedure.
        annotations:
          Tier: '2'
      NominalEx-Wavelength:
        range: float
        description: In case this is different from the Excitation Wavelength of the Channel this Calibration Procedure is
          associated with, this field records the Nominal Peak Excitation Wavelength  that is employed during this Procedure.
        annotations:
          Tier: '2'
      NominalEx-WavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from ExcitationCalibration.NominalEx-Wavelength
        description: The unit of NominalEx-Wavelength.
      ObservedEx-Wavelength:
        range: float
        description: This field records the observed Peak Excitation Wavelength at the Back Objective as measured by using
          this Calibration Procedure.
        required: true
        annotations:
          Tier: '2'
      ObservedEx-WavelengthUnit:
        range: UnitsLength
        ifabsent: string(nm)
        annotations:
          Tier: '2'
          description_source: derived from ExcitationCalibration.ObservedEx-Wavelength
        description: The unit of ObservedEx-Wavelength.
      PercentageNominalPowerSettings:
        range: float
        description: This field records the input % Nominal Illumination Power that was set during this Calibration Procedure
          as by the Manufacturer.
        required: true
        annotations:
          Tier: '2'
      ObservedIlluminationPowerAtBackOfObjective:
        range: float
        description: This field records the observed excitation Illumination Power (also known as Power Output or Illumination
          Intensity) as recorded  at the back focal plane of the Objective by using this Calibration Procedure. In order to
          collect this metric it is necessary to remove the Objective.
        annotations:
          Tier: '2'
      ObservedIlluminationPowerAtBackObjectiveUnit:
        range: UnitsPower
        ifabsent: string(mW)
        annotations:
          Tier: '2'
      ObseredIlluminationPowerAtSample:
        range: float
        description: This field records the observed excitation Illumination Power (also known as Power Output or Illumination
          Intensity) as recorded  at the Sample (also referred to as the Front of the Objective) by using this Calibration
          Procedure. This metric is typically recorded with the Objective in place.
        required: true
        annotations:
          Tier: '2'
      ObseredIlluminationPowerAtSampleUnit:
        range: UnitsPower
        ifabsent: string(mW)
        annotations:
          Tier: '2'
          description_source: derived from ExcitationCalibration.ObseredIlluminationPowerAtSample
        description: The unit of ObseredIlluminationPowerAtSample.
      ShortTermIlluminationStability:
        range: float
        description: According to ISO 21073:2019, Illumination Stability is defined as the percentage deviation of Minimum
          and Maximum Illumination Power from the Average Power during the time interval considered. Specifically, SATB [%]
          = 100x {1-[(Pmax-Pmin)/Pmax+Pmin]}, where Pmax is the maximum laser power recorded during the time interval; and
          Pmin is the minimum laser power recorded during the time interval. This field records the Short Term Illumination
          Stability recorded during this Calibration Procedure by measuring Illumination Power every second for a time interval
          of 5 min of continuous illumination.
        annotations:
          Tier: '2'
      LongTermIlluminationStability:
        range: float
        description: According to ISO 21073:2019, Illumination Stability is defined as the percentage deviation of Minimum
          and Maximum Illumination Power from the Average Power during the time interval considered. Specifically, SATB [%]
          = 100x {1-[(Pmax-Pmin)/Pmax+Pmin]}, where Pmax is the maximum laser power recorded during the time interval; and
          Pmin is the minimum laser power recorded during the time interval. This field records the Long Term Illumination
          Stability recorded during this Calibration Procedure by measuring Illumination Power every 30 s for one second for
          a time interval of 120 min of continuous illumination.
        annotations:
          Tier: '2'
      IlluminationLinearity:
        range: float
        description: This field captures the Linear Correlation Coefficient of observed Output Illumination Power response
          to different input Power settings, as measured at the back of the Objective.
        annotations:
          Tier: '2'
      ObservedIrradianceAtSample:
        range: float
        description: Observed mean excitation light irradiance (radiant power per unit area) as measured at the sample plane
          over the Field of View (FOV).
        annotations:
          Tier: '3'
      ObservedIrradianceAtSampleUnit:
        range: UnitsIrradiance
        ifabsent: string(mW/µm2)
        annotations:
          Tier: '3'
          description_source: derived from ExcitationCalibration.ObservedIrradianceAtSample
        description: The unit of ObservedIrradianceAtSample.
      ObservedIrradianceVariance:
        range: float
        description: Observed excitation light irradiance (radiant power per unit area) variation over the Field of View (FOV).
        annotations:
          Tier: '3'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationProcedure
      Tier: '2'
  DetectorCalibration:
    description: This element describes a procedure used to measures the performance of the Dectector used to to Acquire this
      experimental Image.
    is_a: IntensityCalibration
    attributes:
      CalibrationMap:
        range: CalibrationMap
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: This element describes a 2D matrix containing values computed as a resulut of the calibration procedure.
          This matrix is the same size of the experimental Image this calibration refers to.
      DetectorCalibrationImage:
        inlined: false
        annotations:
          xsd_element: DetectorCalibrationImageRef
        multivalued: true
        description: This is an empty element that refers to an Image (typically a z-stack) obtained as part of this Detector
          Calibration Procedure used in this instance and Acquired using the same Instrument and Settings employed to acquire
          the experimental Image this calibration refers to.
        range: Image
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationProcedure
      Tier: '3'
  CalibrationMap:
    description: This element describes a 2D matrix containing values computed as a resulut of the calibration procedure.
      This matrix is the same size of the experimental Image this calibration refers to.
    attributes:
      Row:
        range: rowType
        inlined: true
        multivalued: true
        inlined_as_list: true
        required: true
      Description:
        range: string
        annotations:
          xsd_whiteSpace: preserve
        description: This element holds a free text multi-line optional description for this component.
      MetricType:
        range: MatrixTypeEnum
        description: This field captures the type of metric that was computed as part of the calibratin procedure in this
          instance.
        required: true
        annotations:
          Tier: '2'
      IlluminationIntensity:
        range: float
        description: This attribute only applies to matrices of type Variance and Mean. It represents the illumination intensity
          that was used to acquire the images used to contruct this matrix. The value can range from 0 (i.e. dark image) to
          any intenisty value experssed either as percentage or as absolute power.
        required: true
        annotations:
          Tier: '2'
      NrOfImages:
        range: integer
        description: This field represents the number of images that were employed to generate this calibration matrix.
        required: true
        annotations:
          Tier: '2'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationProcedure
      Tier: '3'
  MechanicalCalibration:
    description: This describes the procedures that were used for mechanical calibration and the resulting calibration results.
    attributes:
      SamplePositioning:
        inlined: false
        annotations:
          xsd_element: SamplePositioningRef
          Tier: '2'
        description: This empty element refers to the Sample Positioning device that was used for the Acquisition of the experimental
          Image this Mechanical Calibration procedure refers to.
        range: SamplePositioning
      FocusStabilizationDevice:
        inlined: false
        annotations:
          xsd_element: FocusStabilizationDeviceRef
          Tier: '2'
        description: This empty element refers to the optional Focus Stabilization Device that was used for the Acquisition
          of the experimental Image this Mechanical Calibration procedure refers to.
        range: FocusStabilizationDevice
      Annotation:
        inlined: false
        annotations:
          xsd_element: AnnotationRef
          Tier: '4'
        description: This is a simple multi-line comment or annotation describing this component.
        range: Annotation
      ID:
        range: LSID
        description: A Unique Identifier for this component.
        required: true
        identifier: true
        annotations:
          Tier: '4'
      Date:
        range: date
        description: Ths field records the Date in which this Calibration procedure was performed.
        required: true
        annotations:
          Tier: '4'
      MeasuredXReproducibility:
        range: float
        description: This field captures the observed Precision with which this Instrument is capable of maintaining a given
          X-axis position over time during Image Acquisition and as measured by this Mechanical Calibration procedure. This
          metric is generally referred to as Reproducibility and it might also be referred to as X Lateral Drift. This metric
          is particularly relevant for Stereology systems and for the calibration of Sample Positioning devices.
        required: true
        annotations:
          Tier: '2'
      MeasuredXReproducibilityUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredXReproducibility
        description: The unit of MeasuredXReproducibility.
      MeasuredYReproducibility:
        range: float
        description: This field captures the observed Precision with which this Instrument is capable of maintaining a given
          Y-axis position over time during Image Acquisition and as measured by this Mechanical Calibration procedure. This
          metric is generally referred to as Reproducibility and it might also be referred to as Y Lateral Drift. This metric
          is particularly relevant for Stereology systems and for the calibration of Sample Positioning devices.
        required: true
        annotations:
          Tier: '2'
      MeasuredYReproducibilityUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredYReproducibility
        description: The unit of MeasuredYReproducibility.
      MeasuredFocalReproducibility:
        range: float
        description: This field captures the observed Precision with which this Instrument is capable of maintaining a given
          Z-axis position over time during Image Acquisition and as measured by this Mechanical Calibration procedure. This
          metric is generally referred to as Reproducibility and it might also be referred to as Focal Drift. This metric
          is particularly relevant for Stereology systems and for the calibration of Sample Positioning devices.
        required: true
        annotations:
          Tier: '2'
      MeasuredFocalReproducibilityUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredFocalReproducibility
        description: The unit of MeasuredFocalReproducibility.
      MeasuredXRepeatability:
        range: float
        description: This field captures the observed X-axis Accuracy with which this Instrument is capable of returning to
          a previously visited position during Image Acquisition and as measured by this Mechanical Calibration Procedure.
          This metric is important for example for Tiling.
        required: true
        annotations:
          Tier: '2'
      MeasuredXRepeatabilityUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredXRepeatability
        description: The unit of MeasuredXRepeatability.
      MeasuredYRepeatability:
        range: float
        description: This field captures the observed Y-axis Accuracy with which this Instrument is capable of returning to
          a previously visited position during Image Acquisition and as measured by this Mechanical Calibration Procedure.
          This metric is important for example for Tiling.
        required: true
        annotations:
          Tier: '2'
      MeasuredYRepeatabilityUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredYRepeatability
        description: The unit of MeasuredYRepeatability.
      MeasuredFocalRepeatability:
        range: float
        description: This field captures the observed Z-axis Accuracy with which this Instrument is capable of returning to
          a previously visited position during Image Acquisition and as measured by this Mechanical Calibration Procedure.
          This metric is important for example for Tiling.
        required: true
        annotations:
          Tier: '2'
      MeasuredFocalRepeatabilityUnit:
        range: UnitsLength
        ifabsent: string(µm)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredFocalRepeatability
        description: The unit of MeasuredFocalRepeatability.
      MeasuredXSettlingTime:
        range: float
        description: This field captures the observed Time it takes for this Instrument to stabilize at the target X-axis
          position during Image Acquisition and as measured by this Mechanical Calibration Procedure.
        annotations:
          Tier: '2'
      MeasuredXSettlingTimeUnit:
        range: UnitsTime
        ifabsent: string(s)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredXSettlingTime
        description: The unit of MeasuredXSettlingTime.
      MeasuredYSettlingTime:
        range: float
        description: This field captures the observed Time it takes for this Instrument to stabilize at the target Y-axis
          position during Image Acquisition and as measured by this Mechanical Calibration Procedure.
        annotations:
          Tier: '2'
      MeasuredYSettlingTimeUnit:
        range: UnitsTime
        ifabsent: string(s)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredYSettlingTime
        description: The unit of MeasuredYSettlingTime.
      MeasuredFocalSettlingTime:
        range: float
        description: This field captures the observed Time it takes for this Instrument to stabilize at the target Z-axis
          position during Image Acquisition and as measured by this Mechanical Calibration Procedure.
        annotations:
          Tier: '2'
      MeasuredFocalSettlingTimeUnit:
        range: UnitsTime
        ifabsent: string(s)
        annotations:
          Tier: '2'
          description_source: derived from MechanicalCalibration.MeasuredFocalSettlingTime
        description: The unit of MeasuredFocalSettlingTime.
      MeasuredXReproducibility_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Precision with which this Instrument
          is capable of maintaining a given X-axis position over time during Image Acquisition and as measured by this Mechanical
          Calibration procedure.
        annotations:
          Tier: '2'
      MeasuredYReproducibility_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Precision with which this Instrument
          is capable of maintaining a given Y-axis position over time during Image Acquisition and as measured by this Mechanical
          Calibration procedure.
        annotations:
          Tier: '2'
      MeasuredFocalReproducibility_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Precision with which this Instrument
          is capable of maintaining a given Z-axis position over time during Image Acquisition and as measured by this Mechanical
          Calibration procedure.
        annotations:
          Tier: '2'
      MeasuredXRepeatability_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed X-axis Accuracy with which this
          Instrument is capable of returning to a previously visited position (useful for tiling) during Image Acquisition
          and as measured by this Mechanical Calibration Procedure.
        annotations:
          Tier: '2'
      MeasuredYRepeatability_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Y-axis Accuracy with which this
          Instrument is capable of returning to a previously visited position (useful for tiling) during Image Acquisition
          and as measured by this Mechanical Calibration Procedure.
        annotations:
          Tier: '2'
      MeasuredFocalRepeatability_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Z-axis Accuracy with which this
          Instrument is capable of returning to a previously visited position (useful for tiling) during Image Acquisition
          and as measured by this Mechanical Calibration Procedure.
        annotations:
          Tier: '2'
      MeasuredXSettlingTime_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Time it takes for this Instrument
          to stabilize at the target X-axis position during Image Acquisition and as measured by this Mechanical Calibration
          Procedure.
        annotations:
          Tier: '2'
      MeasuredYSettlingTime_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Time it takes for this Instrument
          to stabilize at the target Y-axis position during Image Acquisition and as measured by this Mechanical Calibration
          Procedure.
        annotations:
          Tier: '2'
      MeasuredFocalSettlingTime_SD:
        range: float
        description: This field captures the Standard Deviation associated with the observed Time it takes for this Instrument
          to stabilize at the target Z-axis position during Image Acquisition and as measured by this Mechanical Calibration
          Procedure.
        annotations:
          Tier: '2'
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: CalibrationProcedure
      Tier: '4'
  CalibrationSoftware:
    description: This element describes a software tool utilized to analyze Calibration metrics obtained from this Calibration
      Procedure and generate a suitable Calibration Reports. As an example, such a Software tool might analyzes microscopy
      images of fluorescent Colored Beads in order to quantify the Resolution and Chromatic Registration of a fluorescence
      microsocope over the full Field of View (FOV). An example of such a tool is PSFj (http://www.knoplab.de/psfj/sample-page/).
      Alternatively, such a Software tool might be used to extract Intensity Calibration results obtained with a specific
      Intensity Calibration Tool, such as a Power Meter or MetaMax (https://www.umassmed.edu/grunwaldlab/).
    is_a: Software
    annotations:
      Extension: Calibration and Performance
      Domain: ImageAcquisitionSettings
      Category: Software
      Tier: '2'
enums:
  MirroringDeviceAngleOfIncidenceUnit:
    permissible_values:
      deg: {}
  ShapeFillRule:
    description: The rule used to decide which parts of the shape to fill. [enumeration]
    permissible_values:
      EvenOdd: {}
      NonZero: {}
  ShapeFontFamily:
    description: 'The font family used to draw the text. [enumeration] Note: these values are all lower case so they match
      the standard HTML/CSS values. "fantasy" has been included for completeness; we do not recommend its regular use. This
      attribute is under consideration for removal from the OME-XML schema.'
    permissible_values:
      serif: {}
      sans-serif: {}
      cursive: {}
      fantasy: {}
      monospace: {}
  ShapeFontStyle:
    description: The style and weight applied to the text. [enumeration] This is a simplified combination of the HTML/CSS
      attributes font-style AND font-weight.
    permissible_values:
      Bold: {}
      BoldItalic: {}
      Italic: {}
      Normal: {}
  BinDataCompression:
    permissible_values:
      zlib: {}
      bzip2: {}
      none: {}
    description: Specifies the compression scheme used to encode the data.
    annotations:
      description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
  ExternalCompression:
    permissible_values:
      zlib: {}
      bzip2: {}
      none: {}
    description: Specifies the compression scheme used to encode the data.
    annotations:
      description_source: OME 2016-06 ome.xsd (CC BY 3.0, Open Microscopy Environment)
  VendorBinDataCompression:
    permissible_values:
      zlib: {}
      bzip2: {}
      none: {}
    description: Specifies the compression scheme used to encode the data.
    annotations:
      description_source: derived from VendorBinData.Compression
  Marker:
    description: Shape of marker on the end of a line. [enumeration]
    permissible_values:
      Arrow: {}
    annotations:
      xsdfu_plural: Markers
  NamingConvention:
    description: Predefined list of values for the well labels
    permissible_values:
      letter:
        description: 'While the label type ''number'' has a clear meaning the ''letter'' type is more complex. If you have
          less than 26 values use letters A to Z. Once you get more than 26 values there are several different approaches
          in use. One we have see include: Single letter, then double letter each running A to Z, right first e.g.......................
          A, B, C, ... X, Y, Z, AA, AB, AC, ... AY, AZ, BA, BB, ... This is the format used by Microsoft Excel so users may
          be familiar with it. This is the approach we use in the OMERO client applications. CAPITALsmall, each running A
          to Z, small first e.g....................... Aa, Ab, Ac, ... Ax, Ay, Az, Ba, Bb, Bc, ... By, Bz, Ca, Cb, ... This
          is in use by some plate manufactures. Single letter, then double letter, then triple letter, and so on e.g.......................
          A, B, C, ... X, Y, Z, AA, BB, CC, ... YY, ZZ, AAA, BBB, ... This has the advantage that the first 26 are the same
          as the standard but has a problem an the labels get wider and wider leading to user interface problems.'
      number:
        description: 1, 2, 3, ...
  FontFamily:
    description: 'The font family used to draw the text. [enumeration] Note: these values are all lower case so they match
      the standard HTML/CSS values. "fantasy" has been included for completeness we do not recommended its regular use.'
    permissible_values:
      serif:
        description: serif.
        annotations:
          xsdfu_enum: SERIF
      sans-serif:
        description: sans-serif.
        annotations:
          xsdfu_enum: SANSSERIF
      cursive:
        description: cursive.
        annotations:
          xsdfu_enum: CURSIVE
      fantasy:
        description: fantasy.
        annotations:
          xsdfu_enum: FANTASY
      monospace:
        description: monospace.
        annotations:
          xsdfu_enum: MONOSPACE
  PixelType:
    description: The number size/kind used to represent a Pixel
    permissible_values:
      bit:
        description: bit mask.
        annotations:
          xsdfu_enum: BIT
      complex:
        description: complex single-precision floating point.
        annotations:
          xsdfu_enum: COMPLEXFLOAT
      double:
        description: double-precision floating point.
        annotations:
          xsdfu_enum: DOUBLE
      double-complex:
        description: complex double-precision floating point.
        annotations:
          xsdfu_enum: COMPLEXDOUBLE
      float:
        description: single-precision floating point.
        annotations:
          xsdfu_enum: FLOAT
      int8:
        description: 8 bit signed integer.
        annotations:
          xsdfu_enum: INT8
      int12: {}
      int14: {}
      int16:
        description: 16 bit signed integer.
        annotations:
          xsdfu_enum: INT16
      int32:
        description: 32 bit signed integer.
        annotations:
          xsdfu_enum: INT32
      uint8:
        description: 8 bit unsigned integer.
        annotations:
          xsdfu_enum: UINT8
      uint12: {}
      uint14: {}
      uint16:
        description: 16 bit unsigned integer.
        annotations:
          xsdfu_enum: UINT16
      uint32:
        description: 32 bit unsigned integer.
        annotations:
          xsdfu_enum: UINT32
      Other: {}
  Binning:
    description: Represents the number of pixels that are combined to form larger pixels. {used:CCD,EMCCD}
    permissible_values:
      1x1:
        description: No binning.
        annotations:
          xsdfu_name: 1×1
          xsdfu_enum: ONEBYONE
          xsdfu_compatregex: ^\\s*1.*x.*1\\s*
      2x2:
        description: 2×2 binning.
        annotations:
          xsdfu_name: 2×2
          xsdfu_enum: TWOBYTWO
          xsdfu_compatregex: ^\\s*2.*x.*2\\s*
      4x4:
        description: 4×4 binning.
        annotations:
          xsdfu_name: 4×4
          xsdfu_enum: FOURBYFOUR
          xsdfu_compatregex: ^\\s*4.*x.*4\\s*
      8x8:
        description: 8×8 binning.
        annotations:
          xsdfu_name: 8×8
          xsdfu_enum: EIGHTBYEIGHT
          xsdfu_compatregex: ^\\s*8.*x.*8\\s*
      Other:
        description: Other binning value.
        annotations:
          xsdfu_enum: OTHER
  LightPathLocationOptions:
    permissible_values:
      Infinity space: {}
      Camera Port: {}
      Illumination port: {}
      Other: {}
    description: 'This field records the location of this component in the Microscope Light Path. The most common positions
      are: Infinity Space, Camera Port or Illumination Port.'
    annotations:
      description_source: derived from Filter.LightPathLocation
  Origin:
    permissible_values:
      Commercial-as is: {}
      Commercial-custom modified: {}
      Custom-built: {}
    description: This field describes the origin of this Microscope Stand. Specifically it specifies whether this Microscope
      Stand was purchased from a Commercial vendor and is being used as-is (i.e., Commercial- as is), purchased from a Commercial
      vendor and subsequently Modified for a specialized application (i.e., Commercial- custom-modified) or entirely Custom-built
      from scratch (i.e., Custom-built).
    annotations:
      description_source: derived from MicroscopeStand.Origin
  MicroscopeType:
    permissible_values:
      Compound: {}
      Custom made: {}
      Dissection: {}
      Electrophysiology: {}
      Light sheet: {}
      Stereomicroscope: {}
      Other: {}
    description: This field describes the general category to which this Microscope belongs. A Compound Microscope is a Microscope
      in which the primary image is generated by an objective or an objective and a tube-lens, and in which the Sample is
      observed through an eyepiece. A Custom Microscope is specially designed for specialized purposes. An Electrophysiology
      Microscope is a Microscope dedicated to electrophysiological observation and manipulation. A Lightsheet Microscope is
      a Microscope in which in contrast to epifluorescence microscopy only a thin slice (usually a few hundred nanometers
      to a few micrometers) of the sample is illuminated perpendicularly to the direction of observation. A Stereo Microscope
      (also known as Dissecting Microscope) is a low-power, binocular Microscope with long free working distance used for
      dissecting. Generally in this type of Microscope the object is observed by each eye from a slightly different angle,
      thus causing stereoscopic perception.
