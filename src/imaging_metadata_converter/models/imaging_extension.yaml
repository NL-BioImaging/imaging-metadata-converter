id: https://github.com/NL-BioImaging/imaging-metadata-converter/models/imaging/extension
name: imaging_extension
title: Imaging metadata extension
description: Metadata beyond LiMi that the source files hold, mostly electron microscopy, formerly
  mappings/schema.extended.json. Fields for existing model classes are mixins (InstrumentExtension, ...) that
  the imaging model's classes use; each field's schema_extended_path annotation is its path in
  schema.extended.json. Values of type object in schema.extended.json are strings here (annotation
  source_type), arrays multivalued strings.
version: 2.0.0
prefixes:
  linkml: https://w3id.org/linkml/
  imaging: https://github.com/NL-BioImaging/imaging-metadata-converter/models/imaging/
  ome: https://schemas.incenp.org/ome/v1/core/
default_prefix: imaging
default_range: string
imports:
- linkml:types
classes:
  Quantity:
    description: A value with the unit its source states, as free text.
    attributes:
      Value:
        range: float
      Unit:
        description: The unit as the source writes it, e.g. "um" or "mm".
  QuantityRange:
    description: A range of values, from Begin to End, with the unit its source states, as free text.
    attributes:
      Begin:
        range: float
      End:
        range: float
      Unit:
        description: The unit as the source writes it, e.g. "rad".
  Vector2D:
    description: A pair of values along X and Y.
    attributes:
      X:
        range: float
      Y:
        range: float

  OMEExtension:
    mixin: true
    attributes:
      Operations:
        annotations: {schema_extended_path: Operations, source_type: object}
      Features:
        annotations: {schema_extended_path: Features, source_type: object}
      Annotation:
        multivalued: true
        annotations: {schema_extended_path: Annotation, source_type: array}

  InstrumentExtension:
    description: The instrument as a whole (a TCS SP8, a Talos, an iCT 256), beside the components LiMi lists; a
      light microscope's body is its MicroscopeStand.
    mixin: true
    attributes:
      Manufacturer:
        description: The company that made the instrument as a whole.
        annotations: {schema_extended_path: Instrument.Manufacturer}
      Model:
        description: The Manufacturer's model name of the instrument as a whole (TCS SP8, Talos, iCT 256).
        annotations: {schema_extended_path: Instrument.Model}
      CatalogNumber:
        description: The Catalog, Part or Serial Number used by the Manufacturer to identify this instrument, as LiMi's
          ManufacturerSpec records it for each of its components.
      Type:
        description: The kind of instrument as the source names it, such as DICOM's modality (CT).
        annotations: {schema_extended_path: Instrument.Type}
      ComputerName:
        annotations: {schema_extended_path: Instrument.ComputerName}
      Vacuum:
        range: Vacuum
        inlined: true
      ElectronSource:
        description: The electron sources of this microscope.
        range: ElectronSource
        multivalued: true
        inlined_as_list: true
  Vacuum:
    description: The vacuum of an electron microscope.
    attributes:
      BufferVacuum:
        range: float
        annotations: {schema_extended_path: Instrument.Vacuum.BufferVacuum}
      GunVacuum:
        range: float
        annotations: {schema_extended_path: Instrument.Vacuum.GunVacuum}
      SampleVacuum:
        range: float
        annotations: {schema_extended_path: Instrument.Vacuum.SampleVacuum}
      SystemVacuum:
        range: float
        annotations: {schema_extended_path: Instrument.Vacuum.SystemVacuum}
      VacuumMode:
        annotations: {schema_extended_path: Instrument.Vacuum.VacuumMode}

  ImageExtension:
    mixin: true
    attributes:
      Type:
        annotations: {schema_extended_path: Image.Type}
      CropHint:
        range: CropHint
        inlined: true
      Corrections:
        range: Corrections
        inlined: true
      ElectronBeamSettings:
        range: ElectronBeamSettings
        inlined: true
      ElectronOpticsSettings:
        range: ElectronOpticsSettings
        inlined: true
      BeamScanSettings:
        range: BeamScanSettings
        inlined: true
      SlideScanSettings:
        range: SlideScanSettings
        inlined: true
      BinaryResult:
        annotations: {schema_extended_path: Image.BinaryResult, source_type: object}
  CropHint:
    description: The part of the image to show, in pixels from each edge.
    attributes:
      Left:
        range: integer
        annotations: {schema_extended_path: Image.CropHint.Left}
      Right:
        range: integer
        annotations: {schema_extended_path: Image.CropHint.Right}
      Top:
        range: integer
        annotations: {schema_extended_path: Image.CropHint.Top}
      Bottom:
        range: integer
        annotations: {schema_extended_path: Image.CropHint.Bottom}
  Corrections:
    description: Display corrections applied to the image.
    attributes:
      Contrast:
        range: float
        annotations: {schema_extended_path: Image.Corrections.Contrast}
      Brightness:
        range: float
        annotations: {schema_extended_path: Image.Corrections.Brightness}
      Gamma:
        range: float
        annotations: {schema_extended_path: Image.Corrections.Gamma}
      BlackLevel:
        range: float
        annotations: {schema_extended_path: Image.Corrections.BlackLevel}
      WhiteLevel:
        range: float
        annotations: {schema_extended_path: Image.Corrections.WhiteLevel}

  SoftwareExtension:
    mixin: true
    attributes:
      ApplicationID:
        annotations: {schema_extended_path: Software.ApplicationID}

  DetectorExtension:
    mixin: true
    attributes:
      Type:
        description: The type of detector as the source names it; CCD, CMOS and WaveFrontSensor have their own.
        close_mappings: ['ome:type']
        annotations: {schema_extended_path: Detector.Type}
      Channel:
        range: integer
        annotations: {schema_extended_path: Detector.Channel}
      CollectionAngle:
        description: The solid angle an analytical (X-ray) detector collects over.
        range: Quantity
        inlined: true
      ElevationAngle:
        description: The angle of an analytical detector above the specimen plane.
        range: Quantity
        inlined: true
      AzimuthAngle:
        description: The angle of an analytical detector around the beam axis.
        range: Quantity
        inlined: true

  DetectorSettingsExtension:
    description: Settings of the detector used, and what it measured during the acquisition, beyond LiMi's
      gains and offset.
    mixin: true
    attributes:
      Brightness:
        description: The detector's brightness setting, on the source's own scale.
        range: float
      Contrast:
        description: The detector's contrast setting, on the source's own scale.
        range: float
      CollectionAngleRange:
        description: The range of scattering angles a scanning (STEM) detector collects, e.g. of a HAADF detector.
        range: QuantityRange
        inlined: true
      LiveTime:
        description: The time an analytical detector's pulse processor was open for counts.
        range: Quantity
        inlined: true
      RealTime:
        description: The elapsed time of an analytical acquisition.
        range: Quantity
        inlined: true
      PulseProcessTime:
        description: The pulse processing (shaping) time of an analytical detector.
        range: Quantity
        inlined: true
      InputCountRate:
        description: The rate of counts arriving at an analytical detector, per second.
        range: float
      OutputCountRate:
        description: The rate of counts an analytical detector processed, per second.
        range: float
      Dispersion:
        description: The energy width of one channel of an analytical detector's spectrum.
        range: Quantity
        inlined: true
      OffsetEnergy:
        description: The energy offset of an analytical detector's spectrum.
        range: Quantity
        inlined: true
      BeginEnergy:
        description: The energy an analytical detector's spectrum begins at.
        range: Quantity
        inlined: true
      ElectronicsNoise:
        description: The electronic noise of an analytical detector, as an energy.
        range: Quantity
        inlined: true

  PixelsExtension:
    mixin: true
    attributes:
      TimePoints:
        description: The source's own indices of the image's first (Begin) and last (End) time point, such as
          BigDataViewer's Timepoints range, whose count is SizeT; time points are referred to by these indices.
        range: QuantityRange
        inlined: true
        annotations: {schema_extended_path: Pixels.TimePoints}
  PlaneExtension:
    description: The stage's axes beyond the Plane's PositionX, PositionY and PositionZ, in their style.
    mixin: true
    attributes:
      PositionM:
        description: The position along the stage's M axis, an axis besides X, Y and Z (Zeiss's stages).
        range: float
      PositionMUnit:
        description: The unit of PositionM.
        range: UnitsLength
      Tilt:
        description: The stage's tilt, about its primary (alpha) tilt axis.
        range: float
      TiltUnit:
        description: The unit of Tilt.
        range: UnitsAngle
      TiltBeta:
        description: The stage's tilt about its second (beta) tilt axis, as of a double-tilt holder.
        range: float
      TiltBetaUnit:
        description: The unit of TiltBeta.
        range: UnitsAngle
      Rotation:
        description: The stage's rotation.
        range: float
      RotationUnit:
        description: The unit of Rotation.
        range: UnitsAngle
      RawStage:
        range: RawStage
        inlined: true
  RawStage:
    description: The stage's axes as its own controller reports them, beside the Plane's position, which the
      acquisition software may have offset or aligned (ZEISS Atlas's RawStage beside its Stage).
    attributes:
      PositionX:
        range: float
      PositionXUnit:
        range: UnitsLength
      PositionY:
        range: float
      PositionYUnit:
        range: UnitsLength
      PositionZ:
        range: float
      PositionZUnit:
        range: UnitsLength
      PositionM:
        range: float
      PositionMUnit:
        range: UnitsLength
      Tilt:
        range: float
      TiltUnit:
        range: UnitsAngle
      TiltBeta:
        range: float
      TiltBetaUnit:
        range: UnitsAngle
      Rotation:
        range: float
      RotationUnit:
        range: UnitsAngle
  SamplePositioningSettingsExtension:
    mixin: true
    attributes:
      Bias:
        description: The bias voltage applied to the stage.
        range: float
      BiasUnit:
        description: The unit of Bias.
        range: UnitsElectricPotential
      BiasType:
        description: The kind of bias applied to the stage, as the source names it.
      BiasMode:
        description: The mode of the stage bias, as the source names it.
      SampleHeight:
        description: The height of the sample on a multi-sample stage.
        range: float
      SampleHeightUnit:
        description: The unit of SampleHeight.
        range: UnitsLength
      SampleRadius:
        description: The radius of the sample on a multi-sample stage.
        range: float
      SampleRadiusUnit:
        description: The unit of SampleRadius.
        range: UnitsLength

  ElectronSource:
    description: An electron source of an electron microscope (hardware; how it was set for an image is the
      image's ElectronBeamSettings).
    attributes:
      ID:
        description: A unique identifier for this electron source.
        identifier: true
      Type:
        annotations: {schema_extended_path: ElectronSource.Type}
  ElectronBeamSettings:
    description: The electron beam as set for the acquisition of this image, in LiMi's hardware/settings split.
    attributes:
      ElectronSource:
        description: The electron source these settings apply to.
        range: ElectronSource
        inlined: false
      Type:
        annotations: {schema_extended_path: ElectronBeam.Type}
      Mode:
        annotations: {schema_extended_path: ElectronBeam.Mode}
      Focus:
        range: float
        annotations: {schema_extended_path: ElectronBeam.Focus}
      SpotSize:
        range: float
        annotations: {schema_extended_path: ElectronBeam.SpotSize}
      SpotIndex:
        range: integer
        annotations: {schema_extended_path: ElectronBeam.SpotIndex}
      WorkingDistance:
        range: Quantity
        inlined: true
      AccelerationVoltage:
        range: Quantity
        inlined: true
      Current:
        range: Quantity
        inlined: true
      EmissionCurrent:
        range: Quantity
        inlined: true
      ConvergenceAngle:
        range: Quantity
        inlined: true
      Defocus:
        range: Quantity
        inlined: true
      Shift:
        range: Vector2D
        inlined: true
      SourceTilt:
        range: Vector2D
        inlined: true
      Stigmator:
        range: Vector2D
        inlined: true
      HighVoltage:
        range: HighVoltage
        inlined: true
  HighVoltage:
    description: High-voltage readings of the electron gun, as the source names them.
    attributes:
      BV:
        range: float
      Bia:
        range: float
      CV:
        range: float
      ExtCurrent:
        range: float
      ExtVoltage:
        range: float
      FV:
        range: float
      FcCurrent:
        range: float
      FcVoltage:
        range: float
      HighEmissionMode:
        range: boolean
      HvCurrent:
        range: float
      HvMode:
        range: integer
      HvVoltage:
        range: float
      Mid10kvVoltage:
        range: float
      SV:
        range: float
      SchCurrent:
        range: float
      SchVoltage:
        range: float
  ElectronOpticsSettings:
    description: The electron optics as set for the acquisition of this image.
    attributes:
      CameraLength:
        range: Quantity
        inlined: true
      OperatingMode:
        annotations: {schema_extended_path: ElectronOptics.OperatingMode}
      OperatingSubMode:
        annotations: {schema_extended_path: ElectronOptics.OperatingSubMode}
      ProjectorMode:
        annotations: {schema_extended_path: ElectronOptics.ProjectorMode}
      GunLensSetting:
        annotations: {schema_extended_path: ElectronOptics.GunLensSetting}
      Condenser1:
        description: The setting of the first condenser lens (C1), on the vendor's own scale, e.g. a fraction of
          its full excitation or a number of steps; values of different vendors are not comparable.
        range: float
      Condenser2:
        description: The setting of the second condenser lens (C2), on the vendor's own scale, as Condenser1.
        range: float
      Aperture:
        description: The apertures of the electron optics (condenser, objective, selected-area, ...) as set for
          this acquisition.
        range: ElectronAperture
        multivalued: true
        inlined_as_list: true
  ElectronAperture:
    description: One aperture of the electron optics, as set for the acquisition of an image.
    attributes:
      Name:
        description: The aperture's name, e.g. C1, C2, OBJ or SA.
      Number:
        description: The aperture's number in its mechanism.
        range: integer
      Type:
        description: The aperture's shape as the source names it, e.g. Circular.
      MechanismType:
        description: How the aperture is moved, e.g. Motorized.
      Diameter:
        description: The diameter of the aperture's opening.
        range: Quantity
        inlined: true
      Enabled:
        description: Whether the aperture is in the beam.
        range: boolean
      PositionOffset:
        description: The aperture's offset from its nominal position along X and Y, in the unit the source uses
          (TALOS writes metres).
        range: Vector2D
        inlined: true
  ScanSettings:
    description: The scan of a scanned acquisition, as set for it - what a confocal, an electron beam and a slide
      scan share; LiMi's ConfocalScannerSettings are one kind. Its rotation and scan direction are LiMi's, moved up
      from ConfocalScannerSettings, as are its integrations, one per scanned element integrated (LiMi has a single
      IntegrationNumber, Unit and Method, where a scan may average its lines and accumulate its frames).
    is_a: Settings
    abstract: true
    attributes:
      ScanDirectionality:
        range: ConfocalScanDirectionality
        description: This field records the ScanDirectionality that was set for this device during Acquisition. In Unidirectional
          scan mode, data are only acquired while the laser beam moves in one direction. In Bidirectional scan mode, one line
          is scanned in one direction, and the next line in the opposite direction. In other words, the return run, or flyback,
          of the laser beam is used for recording data as well, thus increasing the scanning frequency when using bidirectional
          scan mode. Refer to https://www.iso.org/standard/69820.html for further details and measurement methods.
        annotations:
          moved_from: ConfocalScannerSettings.ScanDirectionality
          Tier: '1'
      Rotation:
        range: float
        description: This field records the Rotation angle of the scan region.
        annotations:
          moved_from: ConfocalScannerSettings.Rotation
          Tier: '3'
      RotationUnit:
        range: UnitsAngle
        annotations:
          moved_from: ConfocalScannerSettings.RotationUnit
          Tier: '3'
          description_source: derived from ConfocalScannerSettings.Rotation
        description: The unit of Rotation.
      Integration:
        description: The signal integrations of the scan, one per kind of scanned element integrated and method (16
          lines averaged, 2 frames accumulated).
        range: Integration
        multivalued: true
        inlined_as_list: true
      FrameTime:
        description: The time to scan one frame.
        range: float
      FrameTimeUnit:
        description: The unit of FrameTime.
        range: UnitsTime
      LineTime:
        description: The time to scan one line.
        range: float
      LineTimeUnit:
        description: The unit of LineTime.
        range: UnitsTime
  Integration:
    description: One signal integration of a scan, LiMi's IntegrationNumber, IntegrationUnit and IntegrationMethod.
    attributes:
      Number:
        range: PositiveInt
        required: true
        description: Signal integration is generally utilized to improve the overall signal-to-noise ratio of the resulting
          Image. This field records the number of sequential Scanning Units (Line, Frame or Stack) that have been integrated
          for the Acquisition of this Channel.
        annotations:
          moved_from: ConfocalScannerSettings.IntegrationNumber
          Tier: '1'
      Unit:
        range: ScanIntegrationMode
        description: Signal integration is generally utilized to improve the overall signal-to-noise ratio of the resulting
          Image. This field refers to the nature of the Scanning Units used as the basis of signal integration. Refer to https://www.iso.org/standard/69820.html
          for further details and measurement methods.
        annotations:
          moved_from: ConfocalScannerSettings.IntegrationUnit
          Tier: '1'
      Method:
        range: ScanIntegrationMethod
        description: Signal integration is generally utilized to improve the overall signal-to-noise ratio of the resulting
          Image. This field defines the signal Integration Method utilized for the Acquisition of this Channel.
        annotations:
          moved_from: ConfocalScannerSettings.IntegrationMethod
          Tier: '1'
  BeamScanSettings:
    description: The scan of an electron beam (SEM, STEM), as set for the acquisition of this image, for all the
      detectors recording it.
    is_a: ScanSettings
    attributes:
      FieldOfView:
        range: FieldOfView
        inlined: true
      LineInterlacing:
        description: The number of interlaced fields the lines are scanned in; 1 is not interlaced.
        range: integer
  SlideScanSettings:
    description: The scan of a slide scanner, which moves the slide under a line camera in stripes (Aperio's
      ScanScope), as set for the acquisition of this image. Its values are as the scanner states them, with no unit
      where it states none.
    is_a: ScanSettings
    attributes:
      StripeWidth:
        description: The width of each scanned stripe, in pixels.
        range: integer
      LineCameraSkew:
        description: The skew of the line camera, as the scanner states it (Aperio's LineCameraSkew).
        range: float
      LineAreaXOffset:
        description: The offset along X between the line camera and the area the scanner images, as it states it
          (Aperio's LineAreaXOffset).
        range: float
      LineAreaYOffset:
        description: The offset along Y between the line camera and the area the scanner images, as it states it
          (Aperio's LineAreaYOffset).
        range: float
      FocusOffset:
        description: The focus offset the scan was taken with, as the scanner states it (Aperio's Focus Offset).
        range: float
  FieldOfView:
    description: The size of the field of view along X and Y.
    attributes:
      X:
        range: Quantity
        inlined: true
      Y:
        range: Quantity
        inlined: true
