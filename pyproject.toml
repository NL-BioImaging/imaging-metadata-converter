[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imaging-metadata-converter"
version = "0.1.0"
description = "Convert custom imaging acquisition metadata to common metadata"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["imaging", "metadata", "microscopy", "ome", "acquisition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NL-BioImaging/imaging-metadata-converter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imaging_metadata_converter = ["data/*.json"]
